    const wy = hy + noise2D(hx * warpScale, hy * warpScale, warpSeed2) * warpAmp;

    // Sample minerals and water from warped coordinates
    const ironW = bilinearSampleHR(hiResData.iron, wx, wy);
    const copperW = bilinearSampleHR(hiResData.copper, wx, wy);
    const mnW = bilinearSampleHR(hiResData.manganese, wx, wy);
    const mineralTotalW = ironW + copperW + mnW;
    const precipW = bilinearSampleHR(hiResData.precipitation, wx, wy);
    const gwW = bilinearSampleHR(hiResData.groundwater, wx, wy);
    const volcW = bilinearSampleHR(hiResData.volcanism, wx, wy);

    // Flora type fitness competition (mirrors stepHR6_floraRow logic)
    const regWaterW = Math.min(1, precipW * 3.0 + gwW * 1.5);
    const photoFit = regWaterW * 0.8;
    const chemoFit = mineralTotalW * Math.max(regWaterW, volcW * 1.5) * 1.2;
    const mixoFit = (0.6 + 0.5 * mineralTotalW) * regWaterW;

    if (chemoFit > photoFit && chemoFit > mixoFit && chemoFit > 0.02) {
      cell.floraType = 'chemotrophic';
    } else if (mixoFit > photoFit && mixoFit > chemoFit && mixoFit > 0.02) {
      cell.floraType = 'mixotrophic';
    } else if (photoFit > 0.02) {
      cell.floraType = 'photosynthetic';
    } else {
      cell.floraType = 'barren';
    }
  } else {
    // LowRes fallback: use the cell's stored (interpolated) minerals directly
    const mineralTotal = cell.mineralTotal;
    const precip = cell.precipitation;
    const gw = cell.groundwater;
    const volc = cell.volcanism || 0;
    const regWater = Math.min(1, precip * 3.0 + gw * 1.5);
    const photoFit = regWater * 0.8;
    const chemoFit = mineralTotal * Math.max(regWater, volc * 1.5) * 1.2;
    const mixoFit = (0.6 + 0.5 * mineralTotal) * regWater;

    if (chemoFit > photoFit && chemoFit > mixoFit && chemoFit > 0.02) {
      cell.floraType = 'chemotrophic';
    } else if (mixoFit > photoFit && mixoFit > chemoFit && mixoFit > 0.02) {
      cell.floraType = 'mixotrophic';
    } else if (photoFit > 0.02) {
      cell.floraType = 'photosynthetic';
    } else {
      cell.floraType = 'barren';
    }
  }

  // ── From here, flora type is already set per cell above ──

  if (cell.hasWater) {
    // Water prevents rooted canopy but NOT ground-level biology.
    // Flora type was already re-derived above — water doesn't
    // change what KIND of organisms live here, just their structure.
    // Ground cover: shallow water supports floating mat; deep water
    // submerges it. Canopy: always zero (can't root in standing water).
    cell.canopy = 0;

    const wd = cell.waterDepth || 0;
    if (wd > 0.3) {
        // Deep water: fully submerged, no surface flora
        cell.groundCover = 0;
        cell.chemoCrust = 0;
    } else if (wd > 0.1) {
        // Moderate water: sparse floating mat
        cell.groundCover = cell._hrGroundCover * 0.3;
        cell.chemoCrust = cell._hrChemoCrust * 0.2;
    } else {
        // Shallow water or wet surface: substantial floating mat
        cell.groundCover = cell._hrGroundCover * 0.6;
        cell.chemoCrust = cell._hrChemoCrust * 0.5;
    }

    // Organic content: waterlogged decomposition is slow → organic accumulates
    const prod = cell.groundCover * 0.5;
    cell.organicContent = prod * 0.7;  // wet = slow decomposition

    cell.floraDensity = clamp(Math.max(cell.groundCover, cell.chemoCrust), 0, 1);
    return;
  }

  const sat = cell.saturation;
  const grain = cell.grainSize;
  const precip = cell.precipitation;
  const gw = cell.groundwater;
  const volc = cell.volcanism || 0;
  const mineralTotal = cell.mineralTotal;
  const hasWaterLocal = cell.waterTableDepth < -0.01;

  // Ground cover (mirrors stepHR6) — scaled by water availability
  let gc;
  if (hasWaterLocal) gc = 0.3;
  else if (grain > 0.8) gc = 0.08;
  else {
    const waterFactor = clamp(precip * 3.0 + gw * 2.0, 0, 1);
    gc = (0.5 + (1.0 - grain) * 0.4) * waterFactor;
  }
  cell.groundCover = gc;

  // Canopy (mirrors stepHR6)
  let cd = 0;
  if (!hasWaterLocal && grain <= 0.7) {
    const waterFactor = Math.min(1, precip * 3.0 + gw * 1.5);
    let satFactor;
    if (sat > 0.95) satFactor = 0.15;
    else if (sat > 0.85) satFactor = 0.35;
    else if (sat > 0.5) satFactor = 0.80;
    else if (sat > 0.3) satFactor = 1.0;
    else satFactor = 0.45;
    const subFactor = grain < 0.5 ? 1.0 : Math.max(0, 1.0 - (grain - 0.5) * 3.0);
    cd = waterFactor * satFactor * subFactor;
    if (waterFactor > 0.05 && subFactor > 0.1) cd = Math.max(cd, 0.12);
  }
  cell.canopy = cd;

  // Chemo crust (mirrors stepHR6) — uses unwarped cell.mineralTotal
  let cc = 0;
  if (mineralTotal > 0.4) {
    const cf = mineralTotal * Math.max(sat, volc * 1.5);
    const pf = gc * 0.8;
    if (cf > pf) {
      cc = Math.min(1, (cf - pf) * 2.0);
      cell.groundCover *= (1 - cc * 0.6);
    }
  }
  cell.chemoCrust = cc;

  // Density for the flora overlay, from the refined cover values.
  cell.floraDensity = clamp(Math.max(cell.canopy, cell.groundCover), 0, 1);

  // Organic content (mirrors stepHR6)
  const prod = (cell.groundCover + cd) * 0.5;
  cell.organicContent = prod * (sat > 0.7 ? 0.7 : 0.3);
}

// ── Regional drainage: D8 flow accumulation + stream order ──
function computeRegionalDrainage(elevGrid) {
  const N = REGIONAL_SIZE * REGIONAL_SIZE;
  const order = new Int32Array(N);
  for (let i = 0; i < N; i++) order[i] = i;
  order.sort((a, b) => elevGrid[b] - elevGrid[a]);

  const flow = new Float32Array(N);
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      flow[ry * REGIONAL_SIZE + rx] = regionalCells[rx][ry].precipitation + 0.05;
    }
  }

  const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
  const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];

  for (let oi = 0; oi < N; oi++) {
    const i = order[oi];
    const rx = i % REGIONAL_SIZE;
    const ry = (i / REGIONAL_SIZE) | 0;
    const e = elevGrid[i];

    let lowest = -1, lowestElev = e;
    for (let d = 0; d < 8; d++) {
      const nx = rx + dx8[d], ny = ry + dy8[d];
      if (nx < 0 || nx >= REGIONAL_SIZE || ny < 0 || ny >= REGIONAL_SIZE) continue;
      const ni = ny * REGIONAL_SIZE + nx;
      if (elevGrid[ni] < lowestElev) {
        lowestElev = elevGrid[ni];
        lowest = ni;
      }
    }
    if (lowest >= 0) {
      flow[lowest] += flow[i];
    }
  }

  // Assign stream order from accumulated flow
  let maxFlow = 1;
  for (let i = 0; i < N; i++) if (flow[i] > maxFlow) maxFlow = flow[i];

  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const i = ry * REGIONAL_SIZE + rx;
      const cell = regionalCells[rx][ry];
      const f = flow[i];
      cell.flowAccum = f;
      const fn = Math.log(1 + f) / Math.log(1 + maxFlow);
      cell.drainageDensity = fn;
      if (fn > 0.75) cell.streamOrder = 3;
      else if (fn > 0.5) cell.streamOrder = 2;
      else if (fn > 0.28) cell.streamOrder = 1;
      else cell.streamOrder = 0;
    }
  }
}

// ── Substrate & saturation for a regional cell ──
function computeRegionalSubstrate(cell, seed) {
  const grainNoise = noise2D(cell.worldX * 0.05, cell.worldY * 0.05, seed + 4400);
  let grain;
  const zone = cell.zone;
  if (zone === 'summit' || zone === 'upper_slope') {
    grain = 0.75 + grainNoise * 0.2;   // coarse / rocky
  } else if (zone === 'mid_slope') {
    grain = 0.5 + grainNoise * 0.2;
  } else if (zone === 'lowland') {
    grain = 0.3 + grainNoise * 0.15;
  } else if (zone === 'coastal' || zone === 'tidal') {
    grain = 0.2 + grainNoise * 0.15;   // fine / silt
  } else {
    grain = 0.4 + grainNoise * 0.2;
  }
  if (cell.streamOrder >= 2) grain = Math.min(grain, 0.35); // river deposits fines
  cell.grainSize = clamp(grain, 0.05, 1.0);
  cell.baseGrainSize = cell.grainSize;

  // ── Break bilinear interpolation contours (same as HiRes path) ──
  if (cell.isLand) {
    const precipNoiseSeed = 0xA1B2;
    const gwNoiseSeed = 0xC3D4;
    const noiseFreq = 0.015;
    const precipNoiseAmp = 0.06;
    const gwNoiseAmp = 0.04;

    cell.precipitation += noise2D(cell.worldX * noiseFreq, cell.worldY * noiseFreq, precipNoiseSeed) * precipNoiseAmp;
    cell.precipitation = clamp(cell.precipitation, 0, 1);

    cell.groundwater += noise2D(cell.worldX * noiseFreq, cell.worldY * noiseFreq, gwNoiseSeed) * gwNoiseAmp;
    cell.groundwater = clamp(cell.groundwater, 0, 1);
  }

  // Saturation: combination of precipitation, groundwater, drainage, low slope
  const slopeFactor = clamp(1 - cell.slopeMag * 6, 0, 1);
  const drainageFactor = clamp(cell.drainageDensity * 1.5, 0, 1);
  let sat = cell.precipitation * 0.35 + cell.groundwater * 0.35 + drainageFactor * 0.3;
  sat *= (0.5 + slopeFactor * 0.5);
  if (!cell.isLand) sat = 1.0;
  cell.saturation = clamp(sat, 0, 1);

  // Water table depth proxy (0 = at surface)
  cell.waterTableDepth = clamp((1 - cell.saturation) * (0.3 + cell.baseElevation * 2), 0, 1);
}

// ── Standing water: fill local basins along major streams ──
function computeStandingWater(elevGrid) {
  const S = REGIONAL_SIZE;
  const N = S * S;
  const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
  const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];

  // Minimum feature sizes — tightened for the wet planet (precip 1.00 everywhere).
  // Previous values were tuned for a nearly-dry planet and flooded too many cells.
  const REG_MIN_BASIN_AREA  = 20;    // was 12 — lake must span ≥20 cells
  const REG_MIN_BASIN_DEPTH = 0.04;  // was 0.02 — depression must be ≥4 cm deep
  const REG_MIN_WATER_FEAT  = 15;    // was 8  — connected water component ≥15 cells
  const REG_POUR_TOLERANCE  = 0.005; // was 0.008 — shallower fill level
  const REG_SHORE_DIST      = 2;     // unchanged

  // Reset all cells
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const cell = regionalCells[rx][ry];
      cell.hasWater = false;
      cell.waterDepth = 0;
    }
  }

  // Flat arrays for BFS processing (indexed ry * S + rx)
  const hasWater   = new Uint8Array(N);
  const wDepth     = new Float32Array(N);

  // ── Ocean tiles ──
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const cell = regionalCells[rx][ry];
      if (!cell.isLand) {
        hasWater[ry * S + rx] = 1;
        wDepth[ry * S + rx] = -cell.baseElevation;
      }
    }
  }

  // ── Channel water: stream order >= 3 at regional scale (each cell ~1km) ──
  // At regional scale, only major rivers (SO 3+) are visible.
  // SO 2 channels are ~10-50m wide — a small fraction of a 1 km cell.
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const cell = regionalCells[rx][ry];
      if (cell.isLand && cell.streamOrder >= 3 && cell.saturation > 0.85) {
        hasWater[ry * S + rx] = 1;
        wDepth[ry * S + rx] = 0.02 + cell.drainageDensity * 0.05;
      }
    }
  }

  // ── Basin detection and filling ──
  const visited = new Uint8Array(N);
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const i = ry * S + rx;
      if (elevGrid[i] <= 0 || hasWater[i] || visited[i]) continue;

      // Check local minimum
      const e = elevGrid[i];
      let isMin = true;
      for (let d = 0; d < 8; d++) {
        const nx = rx + dx8[d], ny = ry + dy8[d];
        if (nx < 0 || nx >= S || ny < 0 || ny >= S) continue;
        if (elevGrid[ny * S + nx] <= e) { isMin = false; break; }
      }
      if (!isMin) continue;

      // BFS flood-fill basin
      const fillLevel = e + REG_POUR_TOLERANCE;
      const queue = [i];
      const basin = [i];
      visited[i] = 1;
      let maxDepth = 0;
      let head = 0;
      while (head < queue.length) {
        const ci = queue[head++];
        const cx = ci % S, cy = (ci / S) | 0;
        const depth = fillLevel - elevGrid[ci];
        if (depth > maxDepth) maxDepth = depth;
        for (let d = 0; d < 8; d++) {
          const nx = cx + dx8[d], ny = cy + dy8[d];
          if (nx < 0 || nx >= S || ny < 0 || ny >= S) continue;
          const ni = ny * S + nx;
          if (visited[ni] || elevGrid[ni] <= 0 || hasWater[ni]) continue;
          if (elevGrid[ni] < fillLevel) {
            visited[ni] = 1;
            queue.push(ni);
            basin.push(ni);
          }
        }
      }

      // Filter
      if (basin.length < REG_MIN_BASIN_AREA) continue;
      if (maxDepth < REG_MIN_BASIN_DEPTH) continue;
      // Check center cell has reasonable saturation
      const centerCell = regionalCells[rx][ry];
      if (centerCell.saturation < 0.4) continue;

      for (let b = 0; b < basin.length; b++) {
        const bi = basin[b];
        hasWater[bi] = 1;
        wDepth[bi] = Math.max(0.005, fillLevel - elevGrid[bi]);
      }
    }
  }

  // ── Connected component filtering ──
  const ccLabel = new Int32Array(N);
  ccLabel.fill(-1);
  let nextCC = 0;
  const ccSizes = [];

  for (let i = 0; i < N; i++) {
    if (!hasWater[i] || ccLabel[i] >= 0) continue;
    const label = nextCC++;
    const ccQueue = [i];
    ccLabel[i] = label;
    let size = 0;
    let hasOcean = false;
    let ch = 0;
    while (ch < ccQueue.length) {
      const ci = ccQueue[ch++];
      size++;
      if (elevGrid[ci] <= 0) hasOcean = true;
      const cx = ci % S, cy = (ci / S) | 0;
      for (let d = 0; d < 8; d++) {
        const nx = cx + dx8[d], ny = cy + dy8[d];
        if (nx < 0 || nx >= S || ny < 0 || ny >= S) continue;
        const ni = ny * S + nx;
        if (hasWater[ni] && ccLabel[ni] < 0) {
          ccLabel[ni] = label;
          ccQueue.push(ni);
        }
      }
    }
    ccSizes[label] = { size, hasOcean };
  }

  // Demote small land-only components
  for (let i = 0; i < N; i++) {
    if (!hasWater[i]) continue;
    const lab = ccLabel[i];
    if (lab >= 0 && !ccSizes[lab].hasOcean && ccSizes[lab].size < REG_MIN_WATER_FEAT) {
      hasWater[i] = 0;
      wDepth[i] = 0;
    }
  }

  // ── Shoreline saturation boost ──
  const dist = new Uint8Array(N);
  dist.fill(255);
  const shoreQueue = [];
  for (let i = 0; i < N; i++) {
    if (hasWater[i] && elevGrid[i] > 0) {
      dist[i] = 0;
      shoreQueue.push(i);
    }
  }
  let sHead = 0;
  while (sHead < shoreQueue.length) {
    const ci = shoreQueue[sHead++];
    const cd = dist[ci];
    if (cd >= REG_SHORE_DIST) continue;
    const cx = ci % S, cy = (ci / S) | 0;
    for (let d = 0; d < 8; d++) {
      const nx = cx + dx8[d], ny = cy + dy8[d];
      if (nx < 0 || nx >= S || ny < 0 || ny >= S) continue;
      const ni = ny * S + nx;
      const nd = cd + 1;
      if (nd < dist[ni] && !hasWater[ni] && elevGrid[ni] > 0) {
        dist[ni] = nd;
        shoreQueue.push(ni);
      }
    }
  }

  // ── Write back to regionalCells ──
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const i = ry * S + rx;
      const cell = regionalCells[rx][ry];
      cell.hasWater = !!hasWater[i];
      cell.waterDepth = wDepth[i];

      // Shoreline saturation boost for nearby land cells
      if (!hasWater[i] && dist[i] < 255 && dist[i] > 0) {
        const boost = Math.max(0, 0.12 - dist[i] * 0.05);
        cell.saturation = clamp((cell.saturation || 0) + boost, 0, 1);
      }
    }
  }
}

// ── Regional flora ──
function computeRegionalFloraCell(cell) {
  if (!cell.isLand) { cell.floraType = 'none'; cell.floraDensity = 0; return; }
  if (cell.isFreezing) { cell.floraType = 'frozen'; cell.floraDensity = 0; return; }
  if (cell.hasWater) {
    // Same graduated response as refineRegionalFloraFromHiRes:
    // water prevents rooted canopy, but floating mat persists in shallows.
    cell.canopy = 0;
    const wd = cell.waterDepth || 0;
    if (wd > 0.3) {
        cell.groundCover = 0;
        cell.chemoCrust = 0;
        cell.floraDensity = 0;
    } else if (wd > 0.1) {
        cell.groundCover = 0.2;
        cell.chemoCrust = 0;
        cell.floraDensity = 0.2;
    } else {
        cell.groundCover = 0.4;
        cell.chemoCrust = 0;
        cell.floraDensity = 0.4;
    }
    // Flora type: compute from fitness as normal (don't skip to 'none')
    const water = Math.max(cell.saturation, cell.waterAvailability);
    const photoFitness = water * 0.85 * (0.5 + 0.5 * (1 - cell.baseElevation));
    const chemoFitness = cell.mineralTotal * Math.max(water, cell.groundwater * 1.4) * 1.2;
    if (chemoFitness > photoFitness && chemoFitness > 0.05) {
        cell.floraType = 'chemotrophic';
    } else if (photoFitness > 0.05) {
        cell.floraType = 'photosynthetic';
    } else {
        cell.floraType = 'barren';
    }
    return;
  }

  const water = Math.max(cell.saturation, cell.waterAvailability);
  const photoFitness = water * 0.85 * (0.5 + 0.5 * (1 - cell.baseElevation));
  const chemoFitness = cell.mineralTotal * Math.max(water, cell.groundwater * 1.4) * 1.2;
  const mixoFitness  = (0.6 + 0.5 * cell.mineralTotal) * water;
  const maxFit = Math.max(photoFitness, chemoFitness, mixoFitness);

  if (maxFit < 0.05) { cell.floraType = 'barren'; cell.floraDensity = 0; return; }
  if (photoFitness >= chemoFitness && photoFitness >= mixoFitness) {
    cell.floraType = 'photosynthetic';
  } else if (chemoFitness >= mixoFitness) {
    cell.floraType = 'chemotrophic';
  } else {
    cell.floraType = 'mixotrophic';
  }
  cell.floraDensity = clamp(maxFit, 0, 1);

  // Ground cover vs canopy split
  cell.canopy = clamp(cell.floraDensity * (cell.floraType === 'photosynthetic' ? 1.0 : 0.6), 0, 1);
  cell.groundCover = clamp(cell.floraDensity * 0.8 + cell.saturation * 0.2, 0, 1);
}

// ══════════════════════════════════════════════════════════════════
// ── THE terrain derivation function — the ONLY one in the codebase ──
//    Called from every view (planetary low-res, planetary high-res,
//    regional, tile). Takes plain physical properties, returns terrain
//    type + cover type as strings. If the physical state is the same,
//    the output is the same, regardless of which view is rendering it.
//    No other function assigns terrain types anywhere in the codebase.
// ══════════════════════════════════════════════════════════════════
function deriveTerrainAndCover(elev, isLand, grainSize, saturation, groundCover, canopyDensity, chemoCrust, floraType, waterTableDepth, isCoastal) {
    // Return values
    let terrainType = 'dirt';
    let coverType = 'none';

    // ── Water ──
    if (!isLand || elev <= -0.1) {
        return { terrainType: 'deep_water', coverType: 'none' };
    }
    if (!isLand || elev <= 0) {
        return { terrainType: 'water', coverType: 'none' };
    }

    // ── Submerged land (ponded) ──
    if (waterTableDepth < -0.02) {
        return { terrainType: 'water', coverType: 'none' };
    }

    // ── Ground type: substrate × saturation × flora presence ──
    const fine = grainSize < 0.35;
    const sandy = grainSize >= 0.35 && grainSize < 0.6;
    const coarse = grainSize >= 0.6;
    const saturated = saturation > 0.75;
    const hasFlora = groundCover > 0.15;

    // Saturated fine substrate = MUD
    if (fine && saturated) {
        terrainType = 'mud';
    }
    // Saturated sand at coast = BEACH
    else if (sandy && saturated && isCoastal) {
        terrainType = 'beach';
    }
    // Saturated sand inland = MUD
    else if (sandy && saturated) {
        terrainType = 'mud';
    }
    // Coarse substrate without significant flora = ROCK
    else if (coarse && !hasFlora) {
        terrainType = 'rock';
    }
    // FLORA PRESENCE DETERMINES GRASS — not saturation
    // If the flora system says mat is growing here, the ground is GRASS
    else if (groundCover > 0.25) {
        terrainType = 'grass';
    }
    // Coarse with some flora = still ROCK (mat in crevices doesn't change the ground character)
    else if (coarse) {
        terrainType = 'rock';
    }
    // Dry sand without flora = SAND
    else if (sandy && saturation < 0.3 && groundCover < 0.1) {
        terrainType = 'sand';
    }
    // Sparse but visible mat = GRASS
    else if (groundCover > 0.08) {
        terrainType = 'grass';
    }
    // Genuinely bare ground — rare on this planet
    else {
        terrainType = 'dirt';
    }

    // ── Cover type ──
    if (canopyDensity > 0.45) {
        if (floraType === 'chemotrophic' || floraType === 2) coverType = 'mushforest';
        else coverType = 'forest';
    } else if (canopyDensity > 0.15) {
        if (floraType === 'chemotrophic' || floraType === 2) coverType = 'sparse_mushforest';
        else coverType = 'sparse_forest';
    } else {
        coverType = 'none';
    }

    return { terrainType, coverType };
}

// ── Regional terrain derivation — thin wrapper over deriveTerrainAndCover ──
function deriveRegionalTerrainType(cell) {
  // Water / ice handled here (canonical fn is elevation-based; regional keeps
  // its own deep/shallow/standing-water and freezing distinctions).
  if (!cell.isLand) {
    cell.terrainType = cell.isDeepWater ? 'deep_water' : 'water';
    cell.coverType = 'none';
    return;
  }
  if (cell.hasWater && (cell.waterDepth || 0) >= SHALLOW_WATER_TERRAIN_THRESHOLD) {
    cell.terrainType = 'water';
    cell.coverType = 'none';
    return;
  }
  // Shallow water (< threshold) falls through to normal terrain derivation.
  // The cell still has hasWater=true — it just doesn't RENDER as water terrain.
  if (cell.isFreezing) {
    cell.terrainType = 'rock';
    cell.coverType = 'none';
    return;
  }

  const isCoastal = cell.elevation > 0 && cell.elevation < 0.03;
  const result = deriveTerrainAndCover(
    cell.elevation,
    cell.isLand,
    cell.grainSize,
    cell.saturation,
    cell.groundCover,
    cell.canopy,
    cell.chemoCrust || 0,
    cell.floraType,
    cell.waterTableDepth,
    isCoastal
  );
  cell.terrainType = result.terrainType;
  cell.coverType = result.coverType;
}

// ══════════════════════════════════════════════════════════════════
// ── Per-Tile Palette Computation — Three-Layer Color Pipeline ──
//    (mirrors /mnt/user-data/outputs/palette-compute.js exactly)
// ══════════════════════════════════════════════════════════════════

// Material color tables (Layer 1, under white light)
const MAT = {
  photoLiving:    { r: 165, g: 28, b: 28 },
  photoBright:    { r: 200, g: 42, b: 38 },
  deadFresh:      { r: 130, g: 80, b: 45 },
  deadPeat:       { r: 50, g: 30, b: 20 },
  waterSurface:   { r: 65, g: 95, b: 135 },
  skyReflection:  { r: 175, g: 145, b: 80 },

  substrate: {
    iron:     { r: 150, g: 85, b: 50 },
    copper:   { r: 85, g: 130, b: 78 },
    manganese:{ r: 105, g: 82, b: 115 },
    depleted: { r: 155, g: 145, b: 130 },
  },
  bedrock: {
    iron:     { r: 120, g: 75, b: 55 },
    copper:   { r: 70, g: 100, b: 68 },
    manganese:{ r: 88, g: 72, b: 95 },
    depleted: { r: 130, g: 125, b: 115 },
  },
  sand: {
    iron:     { r: 185, g: 145, b: 95 },
    copper:   { r: 150, g: 165, b: 120 },
    manganese:{ r: 160, g: 145, b: 155 },
    depleted: { r: 195, g: 185, b: 165 },
  },
  chemo: {
    iron:     { r: 140, g: 90, b: 55 },
    copper:   { r: 55, g: 120, b: 105 },
    manganese:{ r: 110, g: 70, b: 130 },
    depleted: { r: 130, g: 125, b: 110 },
  },
};

// Mineral color interpolation — blend mineral endpoints by relative concentration
function mineralColor(iron, copper, manganese, colorTable) {
  const total = iron + copper + manganese;

  if (total < 0.05) {
    // Depleted — no significant mineral content
    return colorTable.depleted;
  }

  // Weighted blend by relative concentration
  const fi = iron / total;
  const fc = copper / total;
  const fm = manganese / total;

  let r = fi * colorTable.iron.r + fc * colorTable.copper.r + fm * colorTable.manganese.r;
  let g = fi * colorTable.iron.g + fc * colorTable.copper.g + fm * colorTable.manganese.g;
  let b = fi * colorTable.iron.b + fc * colorTable.copper.b + fm * colorTable.manganese.b;

  // Fade toward depleted at low total mineral concentration
  const mineralIntensity = Math.min(total * 2, 1);  // full intensity at total >= 0.5
  r = r * mineralIntensity + colorTable.depleted.r * (1 - mineralIntensity);
  g = g * mineralIntensity + colorTable.depleted.g * (1 - mineralIntensity);
  b = b * mineralIntensity + colorTable.depleted.b * (1 - mineralIntensity);

  return { r: Math.round(r), g: Math.round(g), b: Math.round(b) };
}

// Combined Layer 2+3 transform: white light → screen (LOCKED multipliers)
function toScreen(r, g, b) {
  return {
    r: Math.round(Math.min(255, Math.max(0, r * 0.790))),
    g: Math.round(Math.min(255, Math.max(0, g * 0.806))),
    b: Math.round(Math.min(255, Math.max(0, b * 0.728)))
  };
}

// Blend two colors by weight
function blend(c1, c2, w1, w2) {
  const t = w1 + w2;
  if (t < 0.001) return c1;
  const f1 = w1 / t, f2 = w2 / t;
  return {
    r: Math.round(c1.r * f1 + c2.r * f2),
    g: Math.round(c1.g * f1 + c2.g * f2),
    b: Math.round(c1.b * f1 + c2.b * f2)
  };
}

// Darken a color by a factor (0 = black, 1 = unchanged)
function darken(c, factor) {
  return {
    r: Math.round(c.r * factor),
    g: Math.round(c.g * factor),
    b: Math.round(c.b * factor)
  };
}

/**
 * Compute per-tile palette from physical state.
 * @param {object} p - Physical state of the tile
 * @returns {{ bg: {r,g,b}, fg: {r,g,b}, mid: {r,g,b} }}
 */
function computeTilePalette(p) {
  const iron = p.iron || 0;
  const copper = p.copper || 0;
  const mn = p.manganese || 0;
  const sat = p.saturation || 0;
  const org = p.organicContent || 0;
  const gc = p.groundCover || 0;
  const cd = p.canopyDensity || 0;
  const cc = p.chemoCrust || 0;
  const grain = p.grainSize || 0.3;
  const depth = p.waterDepth || 0;
  const tt = p.terrainType;
  const ct = p.coverType;
  const ft = p.floraType || 'barren';

  // Select the living ground cover color based on flora type
  // Photosynthetic: crimson mat
  // Chemotrophic: mineral-tinted crust (the "ground cover" IS the crust)
  // Mixotrophic: blend of both (dual-energy organism)
  // Barren: no living color (won't be used since groundCover would be ~0)
  let livingCoverColor;
  let livingCoverBright;  // brighter version for fg highlights

  const isChemo = ft === 'chemotrophic' || ft === 2;
  const isMixo  = ft === 'mixotrophic'  || ft === 3;
  const isPhoto = ft === 'photosynthetic' || ft === 1;

  if (isChemo) {
    livingCoverColor = mineralColor(iron, copper, mn, MAT.chemo);
    livingCoverBright = {
      r: Math.min(255, livingCoverColor.r + 35),
      g: Math.min(255, livingCoverColor.g + 25),
      b: Math.min(255, livingCoverColor.b + 30)
    };
  } else if (isMixo) {
    const chemoColor = mineralColor(iron, copper, mn, MAT.chemo);
    livingCoverColor = blend(MAT.photoLiving, chemoColor, 0.6, 0.4);
    livingCoverBright = blend(MAT.photoBright, {
      r: Math.min(255, chemoColor.r + 30),
      g: Math.min(255, chemoColor.g + 20),
      b: Math.min(255, chemoColor.b + 25)
    }, 0.6, 0.4);
  } else if (ft === 'barren' || ft === 0) {
    // Barren: ground cover is dead organic + sparse mineral surface biology
    // Not crimson — use dead organic color tinted by local minerals
    const substrate = mineralColor(iron, copper, mn, MAT.substrate);
    livingCoverColor = blend(MAT.deadFresh, substrate, 0.6, 0.4);
    livingCoverBright = {
      r: Math.min(255, livingCoverColor.r + 20),
      g: Math.min(255, livingCoverColor.g + 15),
      b: Math.min(255, livingCoverColor.b + 10)
    };
  } else {
    // Photosynthetic — crimson mat
    livingCoverColor = MAT.photoLiving;
    livingCoverBright = MAT.photoBright;
  }

  let bgL1, fgL1, midL1;  // Layer 1 colors (white light)

  // ── BACKGROUND (Layer 1) ──
  if (tt === 'water' || tt === 2) {
    // What's visible at the bottom: living mat (if present) over mineral substrate.
    // The mat doesn't vanish when submerged — it's still there under the water.
    const substrate = mineralColor(iron, copper, mn, MAT.substrate);
    let bottomColor;
    if (gc > 0.05) {
      // Living cover visible through the water, darkened by wet film
      const wetMat = darken(livingCoverColor, 0.82);
      bottomColor = blend(wetMat, substrate, gc, 1 - gc);
    } else {
      bottomColor = substrate;
    }
    const bottomVisibility = Math.max(0, 1 - depth * 4);  // fades by 0.25m
    bgL1 = blend(MAT.waterSurface, bottomColor, 1 - bottomVisibility, bottomVisibility);

  } else if (tt === 'deep_water' || tt === 1) {
    bgL1 = { r: 40, g: 58, b: 95 };  // deep blue, no bottom visible

  } else if (tt === 'mud' || tt === 3) {
    const substrate = mineralColor(iron, copper, mn, MAT.substrate);
    const organicColor = blend(MAT.deadFresh, MAT.deadPeat, 1 - org, org);
    let mudBase = blend(substrate, organicColor, 1 - org * 0.6, org * 0.6);
    mudBase = darken(mudBase, 1 - sat * 0.25);

    // Living flora covers the mud surface — same pattern as GRASS
    // High groundCover: mostly living cover color with dark mud in gaps
    // Low groundCover: mostly dark wet mud with sparse flora patches
    if (gc > 0.05) {
      bgL1 = blend(livingCoverColor, mudBase, gc * 0.7, 1 - gc * 0.7);
    } else {
      bgL1 = mudBase;
    }

    // Chemo overlay only if flora isn't already chemotrophic
    if (cc > 0.1 && !isChemo) {
      const chemoColor = mineralColor(iron, copper, mn, MAT.chemo);
      bgL1 = blend(bgL1, chemoColor, 1 - cc * 0.3, cc * 0.3);
    }

  } else if (tt === 'grass' || tt === 4) {
    const substrate = mineralColor(iron, copper, mn, MAT.substrate);
    const organicSub = blend(substrate, MAT.deadFresh, 1 - org * 0.3, org * 0.3);
    bgL1 = blend(livingCoverColor, organicSub, gc, 1 - gc);
    // Only apply additional chemo tinting if flora is NOT already chemotrophic
    // (avoids double-tinting on chemo tiles where livingCoverColor is already chemo)
    if (cc > 0.1 && !isChemo) {
      const chemoColor = mineralColor(iron, copper, mn, MAT.chemo);
      bgL1 = blend(bgL1, chemoColor, 1 - cc * 0.3, cc * 0.3);
    }
    if (sat > 0.5) {
      bgL1 = darken(bgL1, 1 - (sat - 0.5) * 0.15);
    }

  } else if (tt === 'dirt' || tt === 5) {
    const substrate = mineralColor(iron, copper, mn, MAT.substrate);
    const organicTint = blend(substrate, MAT.deadFresh, 1 - org * 0.4, org * 0.4);
    bgL1 = organicTint;
    // Ground cover: if mat is present on dirt, it should be visible
    if (gc > 0.05) {
      bgL1 = blend(bgL1, livingCoverColor, 1 - gc * 0.7, gc * 0.7);
    }
    if (sat > 0.3) {
      bgL1 = darken(bgL1, 1 - (sat - 0.3) * 0.2);
    }

  } else if (tt === 'sand' || tt === 6) {
    bgL1 = mineralColor(iron, copper, mn, MAT.sand);
    if (gc > 0.05) {
      bgL1 = blend(bgL1, livingCoverColor, 1 - gc * 0.25, gc * 0.25);
    }

  } else if (tt === 'rock' || tt === 7) {
    if (grain > 0.85) {
      bgL1 = mineralColor(iron, copper, mn, MAT.bedrock);
    } else {
      const rock = mineralColor(iron, copper, mn, MAT.bedrock);
      const sub = mineralColor(iron, copper, mn, MAT.substrate);
      const rockiness = (grain - 0.6) / 0.4;  // 0 at grain=0.6, 1 at grain=1.0
      bgL1 = blend(rock, sub, rockiness, 1 - rockiness);
    }
    if (gc > 0.03) {
      bgL1 = blend(bgL1, livingCoverColor, 1 - gc * 0.2, gc * 0.2);
    }
    // Only apply additional chemo tinting if flora is NOT already chemotrophic
    // (avoids double-tinting on chemo tiles where livingCoverColor is already chemo)
    if (cc > 0.1 && !isChemo) {
      const chemoColor = mineralColor(iron, copper, mn, MAT.chemo);
      bgL1 = blend(bgL1, chemoColor, 1 - cc * 0.3, cc * 0.3);
    }

  } else if (tt === 'beach' || tt === 8) {
    bgL1 = mineralColor(iron, copper, mn, MAT.sand);
    if (sat > 0.5) {
      bgL1 = darken(bgL1, 1 - (sat - 0.5) * 0.2);
    }

  } else {
    bgL1 = { r: 100, g: 90, b: 75 };  // Fallback
  }

  // ── Wet film modifier for shallow standing water ──
  // Tiles with very shallow water (< 5cm) keep their ground terrain type
  // but get darkened with a slight blue shift — the water film effect.
  if (depth > 0 && depth < SHALLOW_WATER_TERRAIN_THRESHOLD && tt !== 'water' && tt !== 2 && tt !== 'deep_water' && tt !== 1) {
    const wetIntensity = depth / SHALLOW_WATER_TERRAIN_THRESHOLD; // 0 at no water, 1 at threshold
    const wetDarken = 1.0 - wetIntensity * 0.18; // up to 18% darker
    bgL1 = {
      r: Math.round(bgL1.r * wetDarken),
      g: Math.round(bgL1.g * wetDarken),
      b: Math.round(Math.min(255, bgL1.b * wetDarken + wetIntensity * 6)) // slight blue shift
    };
  }

  // ── FOREGROUND (Layer 1) ──
  if (tt === 'water' || tt === 2) {
    // Shallow water: mat highlights show through alongside sky reflection
    const bottomVis = Math.max(0, 1 - depth * 4);
    if (bottomVis > 0.1 && gc > 0.1) {
      const wetBright = darken(livingCoverBright, 0.85);
      fgL1 = blend(wetBright, MAT.skyReflection, bottomVis * 0.4, 1 - bottomVis * 0.4);
    } else {
      fgL1 = MAT.skyReflection;
    }
  } else if (tt === 'deep_water' || tt === 1) {
    fgL1 = MAT.skyReflection;

  } else if (tt === 'mud' || tt === 3) {
    // Mud fg: puddle reflections + flora highlights
    if (gc > 0.2) {
      // Flora present: highlights are a mix of living cover bright + water reflection
      fgL1 = blend(livingCoverBright, MAT.skyReflection, gc * 0.5, 1 - gc * 0.5);
    } else {
      // Bare mud: puddle reflections only
      fgL1 = blend(MAT.skyReflection, MAT.substrate.depleted, sat, 1 - sat);
    }

  } else if (tt === 'grass' || tt === 4) {
    if (cc > 0.3) {
      fgL1 = mineralColor(iron, copper, mn, MAT.chemo);
      fgL1 = { r: Math.min(255, fgL1.r + 30), g: Math.min(255, fgL1.g + 20), b: Math.min(255, fgL1.b + 20) };
    } else {
      fgL1 = livingCoverBright;
    }

  } else if (tt === 'dirt' || tt === 5) {
    if (gc > 0.1) {
      fgL1 = livingCoverColor;
    } else {
      const sub = mineralColor(iron, copper, mn, MAT.substrate);
      fgL1 = { r: Math.min(255, sub.r + 35), g: Math.min(255, sub.g + 25), b: Math.min(255, sub.b + 20) };
    }

  } else if (tt === 'rock' || tt === 7) {
    const rockBase = mineralColor(iron, copper, mn, MAT.bedrock);
    fgL1 = { r: Math.min(255, rockBase.r + 40), g: Math.min(255, rockBase.g + 30), b: Math.min(255, rockBase.b + 25) };

  } else if (tt === 'sand' || tt === 6 || tt === 'beach' || tt === 8) {
    const sandBase = mineralColor(iron, copper, mn, MAT.sand);
    fgL1 = { r: Math.min(255, sandBase.r + 25), g: Math.min(255, sandBase.g + 20), b: Math.min(255, sandBase.b + 15) };

  } else {
    fgL1 = { r: Math.min(255, bgL1.r + 30), g: Math.min(255, bgL1.g + 25), b: Math.min(255, bgL1.b + 20) };
  }

  // ── COVER MODIFICATION (forest / mushforest canopy) ──
  if (ct === 'forest' || ct === 1) {
    const shadeAmount = cd * 0.65;  // dense canopy blocks up to 65% of light
    bgL1 = darken(bgL1, 1 - shadeAmount);
    bgL1 = blend(bgL1, darken(livingCoverColor, 0.4), 1 - cd * 0.3, cd * 0.3);

    fgL1 = blend(livingCoverBright, livingCoverColor, 0.6, 0.4);
    if (cd < 0.5) {
      const groundFg = fgL1;
      fgL1 = blend(groundFg, livingCoverBright, 1 - cd, cd);
    }

  } else if (ct === 'sparse_forest' || ct === 3) {
    const shadeAmount = cd * 0.4;
    bgL1 = darken(bgL1, 1 - shadeAmount);
    bgL1 = blend(bgL1, darken(livingCoverColor, 0.5), 1 - cd * 0.15, cd * 0.15);

    fgL1 = blend(fgL1, livingCoverBright, 0.5, 0.5);

  } else if (ct === 'mushforest' || ct === 2) {
    const chemoColor = mineralColor(iron, copper, mn, MAT.chemo);
    const shadeAmount = cd * 0.55;
    bgL1 = darken(bgL1, 1 - shadeAmount);
    bgL1 = blend(bgL1, darken(chemoColor, 0.5), 1 - cd * 0.35, cd * 0.35);

    fgL1 = { r: Math.min(255, chemoColor.r + 35), g: Math.min(255, chemoColor.g + 25), b: Math.min(255, chemoColor.b + 30) };

  } else if (ct === 'sparse_mushforest' || ct === 4) {
    const chemoColor = mineralColor(iron, copper, mn, MAT.chemo);
    const shadeAmount = cd * 0.3;
    bgL1 = darken(bgL1, 1 - shadeAmount);
    bgL1 = blend(bgL1, darken(chemoColor, 0.6), 1 - cd * 0.2, cd * 0.2);

    fgL1 = blend(fgL1, chemoColor, 0.5, 0.5);
  }

  // ── MID-TONE (Layer 1) ──
  midL1 = blend(bgL1, fgL1, 0.65, 0.35);

  // ── APPLY LAYERS 2+3 (star + adaptation) ──
  const bg = toScreen(bgL1.r, bgL1.g, bgL1.b);
  const fg = toScreen(fgL1.r, fgL1.g, fgL1.b);
  const mid = toScreen(midL1.r, midL1.g, midL1.b);

  return { bg, fg, mid };
}

// ── Physical-state adapters (viewer data → computeTilePalette input) ──
// Tile chunk: typed-array store indexed by tile `i`
function tilePhysical(t, i) {
  return {
    terrainType:    intToTerrainType(t.terrainType[i]),
    coverType:      intToCoverType(t.coverType[i]),
    iron:           t.iron[i] || 0,
    copper:         t.copper[i] || 0,
    manganese:      t.manganese[i] || 0,
    grainSize:      t.grainSize[i] || 0.3,
    saturation:     t.saturation[i] || 0,
    organicContent: (t.organicContent && t.organicContent[i]) || 0,
    groundCover:    t.groundCover[i] || 0,
    canopyDensity:  t.canopy[i] || 0,
    chemoCrust:     t.chemoCrust[i] || 0,
    waterDepth:     t.waterDepth[i] || 0,
    floraType:      ['barren','photosynthetic','chemotrophic','mixotrophic'][t.floraType[i]] || 'barren',
  };
}

// Regional cell: object with named string/scalar properties
function regionalPhysical(cell) {
  const m = cell.minerals || {};
  return {
    terrainType:    cell.terrainType,
    coverType:      cell.coverType,
    iron:           m.iron || 0,
    copper:         m.copper || 0,
    manganese:      m.manganese || 0,
    grainSize:      cell.grainSize || 0.3,
    saturation:     cell.saturation || 0,
    organicContent: cell.organicContent || 0,
    groundCover:    cell.groundCover || 0,
    canopyDensity:  cell.canopy || 0,
    chemoCrust:     cell.chemoCrust || 0,
    waterDepth:     cell.waterDepth || 0,
    floraType:      cell.floraType || 'barren',
  };
}

// ── Regional overlay color functions ──
const regionalOverlayFunctions = {
  'surface': function(cell) {
    // Regional-only water features (drainage channels, ponds)
    if (cell.isLand && cell.hasWater && (cell.waterDepth || 0) >= SHALLOW_WATER_TERRAIN_THRESHOLD) {
      const m = cell.minerals || {};
      return computeTilePalette({
        terrainType: 'water', waterDepth: cell.waterDepth || 0,
        iron: m.iron || 0, copper: m.copper || 0, manganese: m.manganese || 0,
        groundCover: cell.groundCover || 0,
        floraType: cell.floraType || 'barren',
      }).bg;
    }

    // Ocean cells: sample hi-res colors (ocean color doesn't need regional detail)
    if (!cell.isLand) {
      if (hiResData) {
        const hx = (cell.worldX / CELLS_PER_PLANETARY) * hiResMultiplier;
        const hy = (cell.worldY / CELLS_PER_PLANETARY) * hiResMultiplier;
        const r = bilinearSampleHR(hiResData.colorR, hx, hy);
        const g = bilinearSampleHR(hiResData.colorG, hx, hy);
        const b = bilinearSampleHR(hiResData.colorB, hx, hy);
        return { r: Math.round(r), g: Math.round(g), b: Math.round(b) };
      }
      if (cell.isDeepWater) return computeTilePalette({ terrainType: 'deep_water' }).bg;
      return computeTilePalette({ terrainType: 'water', waterDepth: 0.15 }).bg;
    }

    // Land cells: compute color from the regional cell's own physical state.
    // This gives full 512×512 resolution because each regional cell has its
    // own refined physical properties (saturation, minerals, flora, terrain).
    if (cell.isFreezing) return { r: 210, g: 215, b: 220 };
    return computeTilePalette(regionalPhysical(cell)).bg;
  },
  'topographic': function(cell) {
    if (!cell.isLand) return cell.isDeepWater ? { r: 10, g: 22, b: 40 } : { r: 26, g: 48, b: 80 };
    const maxLand = getPlanetMaxLandElev();
    const t = clamp(cell.baseElevation / maxLand, 0, 1);
    return lerpColor({ r: 60, g: 75, b: 55 }, { r: 200, g: 185, b: 160 }, t);
  },
  'drainage': function(cell) {
    if (!cell.isLand) return { r: 15, g: 25, b: 40 };
    const so = cell.streamOrder;
    if (so >= 3) return { r: 40, g: 120, b: 200 };
    if (so === 2) return { r: 60, g: 140, b: 190 };
    if (so === 1) return { r: 90, g: 150, b: 170 };
    const d = clamp(cell.drainageDensity, 0, 1);
    return lerpColor({ r: 40, g: 40, b: 40 }, { r: 80, g: 110, b: 120 }, d);
  },
  'saturation': function(cell) {
    if (!cell.isLand) return { r: 20, g: 40, b: 70 };
    const s = clamp(cell.saturation, 0, 1);
    return { r: Math.floor(60 - s * 40), g: Math.floor(50 + s * 60), b: Math.floor(50 + s * 150) };
  },
  'terrainType': function(cell) {
    const tt = cell.terrainType;
    if (tt === 'deep_water') return { r: 18, g: 27, b: 47 };
    if (tt === 'water') return { r: 40, g: 70, b: 110 };
    if (tt === 'mud') return { r: 90, g: 70, b: 45 };
    if (tt === 'grass') return { r: 80, g: 120, b: 55 };
    if (tt === 'dirt') return { r: 110, g: 85, b: 55 };
    if (tt === 'sand') return { r: 190, g: 175, b: 130 };
    if (tt === 'rock') return { r: 120, g: 115, b: 108 };
    if (tt === 'beach') return { r: 210, g: 195, b: 155 };
    return { r: 60, g: 60, b: 60 };
  },
  'zone': function(cell) {
    const z = cell.zone;
    if (z === 'summit') return { r: 220, g: 210, b: 200 };
    if (z === 'upper_slope') return { r: 170, g: 150, b: 130 };
    if (z === 'mid_slope') return { r: 130, g: 130, b: 90 };
    if (z === 'lowland') return { r: 90, g: 130, b: 70 };
    if (z === 'coastal') return { r: 180, g: 165, b: 120 };
    if (z === 'tidal') return { r: 90, g: 120, b: 140 };
    return { r: 40, g: 60, b: 90 };
  },
  'iron': cell => mineralChannel(cell, 'iron'),
  'copper': cell => mineralChannel(cell, 'copper'),
  'manganese': cell => mineralChannel(cell, 'manganese'),
  'composite': cell => ({
    r: Math.floor(cell.minerals.iron * (cell.isLand ? 255 : 80)),
    g: Math.floor(cell.minerals.copper * (cell.isLand ? 255 : 80)),
    b: Math.floor(cell.minerals.manganese * (cell.isLand ? 255 : 80)),
  }),
  'moisture': cell => overlayFunctions['moisture'](cell),
  'precipitation': cell => overlayFunctions['precipitation'](cell),
  'groundwater': cell => overlayFunctions['groundwater'](cell),
  'waterAvail': cell => overlayFunctions['waterAvail'](cell),
  'floraType': function(cell) {
    if (cell.floraType === 'photosynthetic') return { r: 128, g: 32, b: 32 };
    if (cell.floraType === 'chemotrophic')   return { r: 80, g: 32, b: 96 };
    if (cell.floraType === 'mixotrophic')    return { r: 112, g: 48, b: 64 };
    if (cell.floraType === 'barren')         return { r: 64, g: 64, b: 64 };
    if (cell.floraType === 'frozen')         return { r: 192, g: 192, b: 200 };
    return { r: 16, g: 32, b: 48 };
  },
  'floraDensity': function(cell) {
    if (!cell.isLand) return { r: 10, g: 20, b: 35 };
    if (cell.floraType === 'barren' || cell.floraType === 'frozen' || cell.floraType === 'none') return { r: 32, g: 32, b: 32 };
    const d = clamp(cell.floraDensity, 0, 1);
    const base = regionalOverlayFunctions['floraType'](cell);
    return {
      r: Math.floor(base.r * (0.3 + d * 0.7)),
      g: Math.floor(base.g * (0.3 + d * 0.7)),
      b: Math.floor(base.b * (0.3 + d * 0.7)),
    };
  },
};

function printRegionalDiagnostic() {
  if (!regionalCells) return;
  const counts = {};
  const zoneCounts = {};
  let land = 0, water = 0;
  for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
    for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
      const c = regionalCells[rx][ry];
      counts[c.terrainType] = (counts[c.terrainType] || 0) + 1;
      zoneCounts[c.zone] = (zoneCounts[c.zone] || 0) + 1;
      if (c.isLand) land++; else water++;
    }
  }
  const total = REGIONAL_SIZE * REGIONAL_SIZE;
  const fmt = (obj) => Object.keys(obj)
    .map(k => `${k}=${(obj[k] / total * 100).toFixed(1)}%`)
    .join('  ');
  console.log('=== REGIONAL DIAGNOSTIC ===');
  console.log('Land:', land, 'Water:', water);
  console.log('Terrain types: ' + fmt(counts));
  console.log('Zones: ' + fmt(zoneCounts));
  console.log('=== END REGIONAL DIAGNOSTIC ===');
}

// ── Regional map renderer ──
function renderRegionalMap(overlay) {
  if (!regionalCells) return;
  const colorFn = regionalOverlayFunctions[overlay] || regionalOverlayFunctions['surface'];
  const img = regionalCtx.createImageData(REGIONAL_SIZE, REGIONAL_SIZE);
  const data = img.data;
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const col = colorFn(regionalCells[rx][ry]);
      const off = (ry * REGIONAL_SIZE + rx) * 4;
      data[off] = col.r;
      data[off + 1] = col.g;
      data[off + 2] = col.b;
      data[off + 3] = 255;
    }
  }
  regionalCtx.putImageData(img, 0, 0);
  drawTilePositionMarker();
}

// ── Tile position marker on the regional map ──
// Draws a small highlighted box on the regional canvas showing which cell
// the current tile view is displaying.  Called after every regional render
// and after tile pan operations.
function drawTilePositionMarker() {
  if (!currentTileData || !regionalCells) return;
  const rx = currentTileData.rx;
  const ry = currentTileData.ry;
  regionalCtx.save();
  const size = 5;
  // Dark outline for contrast on any terrain
  regionalCtx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
  regionalCtx.lineWidth = 3;
  regionalCtx.strokeRect(rx - size / 2 - 1, ry - size / 2 - 1, size + 2, size + 2);
  // White inner box
  regionalCtx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  regionalCtx.lineWidth = 1;
  regionalCtx.strokeRect(rx - size / 2, ry - size / 2, size, size);
  regionalCtx.restore();
}

// ── Selection marker on planetary views ──
function drawMarkerBox(c, mx, my, half) {
  c.save();
  // dark contrast outline so the white box reads on any terrain
  c.strokeStyle = 'rgba(0, 0, 0, 0.45)';
  c.lineWidth = 3;
  c.strokeRect(mx - half, my - half, half * 2, half * 2);
  // white box
  c.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  c.lineWidth = 1.5;
  c.strokeRect(mx - half, my - half, half * 2, half * 2);
  // center dot
  c.beginPath();
  c.arc(mx, my, 1.8, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255, 255, 255, 0.95)';
  c.fill();
  c.restore();
}

// Forward-project a planetary cell (fractional cx,cy) onto the globe's screen
// pixels. Returns null when the point is on the far (hidden) hemisphere.
function globeCellToPixel(cellX, cellY) {
  const gw = globeCanvas.width, gh = globeCanvas.height;
  const scx = gw / 2, scy = gh / 2;
  const radius = Math.min(scx, scy) * 0.9;

  const lon = ((cellX / W) * 2 - 1) * Math.PI;
  const lat = (1 - (2 * cellY) / H) * (Math.PI / 2);

  // world-space unit vector (matches globePixelToCell's convention)
  const x3d = Math.cos(lat) * Math.sin(lon);
  const y3d = -Math.sin(lat);
  const z3d2 = Math.cos(lat) * Math.cos(lon);

  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

  // invert the view rotation to recover screen-space coords
  const sy = cosX * y3d + sinX * z3d2;
  const z3d = -sinX * y3d + cosX * z3d2;
  const sx = cosY * x3d - sinY * z3d;
  const sz = sinY * x3d + cosY * z3d;

  if (sz <= 0) return null; // facing away from the viewer

  return { x: scx + sx * radius, y: scy + sy * radius };
}

function drawSelectionMarker() {
  if (!selectedRegion) return;

  if (currentView === 'flat') {
    const scaleX = 1024 / W, scaleY = 512 / H;
    drawMarkerBox(ctx, selectedRegion.cx * scaleX, selectedRegion.cy * scaleY, 9);
  } else if (currentView === 'mollweide') {
    const p = mollweideProject(selectedRegion.cx, selectedRegion.cy, mollweideCanvas.width, mollweideCanvas.height);
    drawMarkerBox(mollweideCtx, p.x, p.y, 8);
  } else if (currentView === 'globe') {
    const p = globeCellToPixel(selectedRegion.cx, selectedRegion.cy);
    if (p) drawMarkerBox(globeCtx, p.x, p.y, 8);
  }
}

let activePreset = 'Default';

function buildTuningPanel() {
  const panel = document.getElementById('tuningPanel');
  panel.innerHTML = '';

  // Presets
  const presetRow = document.createElement('div');
  presetRow.className = 'tune-presets';
  for (const name of Object.keys(tuningPresets)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    if (name === activePreset) btn.classList.add('preset-active');
    btn.addEventListener('click', () => applyPreset(name));
    presetRow.appendChild(btn);
  }
  panel.appendChild(presetRow);

  // Group params
  const groups = {};
  for (const key in paramConfig) {
    const cfg = paramConfig[key];
    if (!groups[cfg.group]) groups[cfg.group] = [];
    groups[cfg.group].push(key);
  }

  for (const groupName in groups) {
    const label = document.createElement('div');
    label.className = 'tune-group-label';
    label.textContent = groupName;
    panel.appendChild(label);

    for (const key of groups[groupName]) {
      const cfg = paramConfig[key];
      const row = document.createElement('div');
      row.className = 'tune-row';

      const lbl = document.createElement('label');
      lbl.textContent = cfg.label;
      lbl.setAttribute('for', 'tune_' + key);
      row.appendChild(lbl);

      const input = document.createElement('input');
      input.type = 'range';
      input.id = 'tune_' + key;
      input.min = cfg.min;
      input.max = cfg.max;
      input.step = cfg.step;
      input.value = params[key];

      const valSpan = document.createElement('span');
      valSpan.className = 'tune-value';
      valSpan.textContent = params[key];

      input.addEventListener('input', () => {
        params[key] = parseFloat(input.value);
        valSpan.textContent = input.value;
      });

      row.appendChild(input);
      row.appendChild(valSpan);
      panel.appendChild(row);
    }
  }

  // Actions
  const actions = document.createElement('div');
  actions.className = 'tune-actions';

  const regenBtn = document.createElement('button');
  regenBtn.textContent = '↻ Regenerate';
  regenBtn.addEventListener('click', () => runGeneration());
  actions.appendChild(regenBtn);

  const resetBtn = document.createElement('button');
  resetBtn.textContent = '⌫ Reset defaults';
  resetBtn.addEventListener('click', () => {
    for (const key in defaultParams) params[key] = defaultParams[key];
    activePreset = 'Default';
    buildTuningPanel();
    showToast('Reset to defaults');
  });
  actions.appendChild(resetBtn);

  panel.appendChild(actions);
}

function applyPreset(name) {
  for (const key in defaultParams) params[key] = defaultParams[key];
  const preset = tuningPresets[name];
  for (const key in preset) params[key] = preset[key];
  activePreset = name;
  buildTuningPanel();
  showToast('Applied preset: ' + name);
}

// ══════════════════════════════════════════════════════════════════
// ── High-Resolution Surface Generation (additive) ──
//    Phase 1 (steps 1-5) runs at 512×256 as before. Phase 2 computes
//    coastline, substrate, water table, drainage, flora, terrain and
//    surface color on an interpolated high-res grid (HR_W × HR_H).
// ══════════════════════════════════════════════════════════════════

let hiResMultiplier = 4;          // set from the resolution dropdown at generation time
let HR_W = 0, HR_H = 0, HR_TOTAL = 0;
let hiResData = null;             // typed arrays, or null when rendering from the low-res grid
let planet = null;               // canonical surface data (alias of hiResData once generated)

// Overlays that have a high-res representation. Everything else keeps
// using the low-res grid (wind, currents, minerals, precip, etc.).
const HI_RES_OVERLAYS = new Set([
  'surface', 'floraType', 'floraDensity',
  'terrainType', 'substrate', 'saturation', 'drainage'
]);

function yieldFrame() { return new Promise(r => setTimeout(r, 0)); }

// ── Progress bar helpers ──
function updateProgress(message, percent) {
  const c = document.getElementById('progressContainer');
  const b = document.getElementById('progressBar');
  const t = document.getElementById('progressText');
  if (c) c.style.display = 'inline-block';
  if (b) b.style.width = clamp(percent, 0, 100) + '%';
  if (t) t.textContent = message || '';
}
function hideProgress() {
  const c = document.getElementById('progressContainer');
  const t = document.getElementById('progressText');
  if (c) c.style.display = 'none';
  if (t) t.textContent = '';
}

// Run `fn(hy)` for every high-res row, yielding periodically so the
// progress bar animates. Spreads `label` progress across [pctStart,pctEnd].
async function forEachHRRow(fn, label, pctStart, pctEnd) {
  const rowsPerChunk = Math.max(1, Math.floor(HR_H / 24));
  for (let hy = 0; hy < HR_H; hy += rowsPerChunk) {
    const end = Math.min(HR_H, hy + rowsPerChunk);
    for (let y = hy; y < end; y++) fn(y);
    updateProgress(label, pctStart + (end / HR_H) * (pctEnd - pctStart));
    await yieldFrame();
  }
}

// ── Phase 2 entry point ──
async function generateHighResSurface(seed) {
  HR_W = W * hiResMultiplier;
  HR_H = H * hiResMultiplier;
  HR_TOTAL = HR_W * HR_H;

  // Allocate high-res typed arrays (guarded — Ultra can be large).
  try {
    hiResData = {
      elevation:       new Float32Array(HR_TOTAL),
      isLand:          new Uint8Array(HR_TOTAL),
      isShallowWater:  new Uint8Array(HR_TOTAL),
      isDeepWater:     new Uint8Array(HR_TOTAL),
      isFreezing:      new Uint8Array(HR_TOTAL),

      // Interpolated from low-res
      precipitation:   new Float32Array(HR_TOTAL),
      groundwater:     new Float32Array(HR_TOTAL),
      waterAvail:      new Float32Array(HR_TOTAL),
      volcanism:       new Float32Array(HR_TOTAL),
      iron:            new Float32Array(HR_TOTAL),
      copper:          new Float32Array(HR_TOTAL),
      manganese:       new Float32Array(HR_TOTAL),
      // Atmospheric fields carried up for overlays (base-resolution phenomena,
      // interpolated so flat / Mollweide read one unified source)
      windU:           new Float32Array(HR_TOTAL),
      windV:           new Float32Array(HR_TOTAL),
      windSpeed:       new Float32Array(HR_TOTAL),
      temperature:     new Float32Array(HR_TOTAL),
      sst:             new Float32Array(HR_TOTAL),
      plateId:         new Uint16Array(HR_TOTAL),

      // Computed at high-res
      grainSize:       new Float32Array(HR_TOTAL),
      waterTableDepth: new Float32Array(HR_TOTAL),
      saturation:      new Float32Array(HR_TOTAL),
      groundCover:     new Float32Array(HR_TOTAL),
      canopyDensity:   new Float32Array(HR_TOTAL),
      chemoCrust:      new Float32Array(HR_TOTAL),
      organicContent:  new Float32Array(HR_TOTAL),
      floraType:       new Uint8Array(HR_TOTAL),
      terrainType:     new Uint8Array(HR_TOTAL),
      coverType:       new Uint8Array(HR_TOTAL),
      streamOrder:     new Uint8Array(HR_TOTAL),

      // For rendering
      colorR:          new Uint8Array(HR_TOTAL),
      colorG:          new Uint8Array(HR_TOTAL),
      colorB:          new Uint8Array(HR_TOTAL),
    };
  } catch (err) {
    console.error('High-res allocation failed:', err);
    hiResData = null;
    statusText.textContent = 'High-res grid too large for available memory — using low-res.';
    return;
  }

  await forEachHRRow(hy => stepHR1_elevationRow(hy, seed), 'Interpolating elevation…', 0, 14);
  await forEachHRRow(hy => stepHR2_atmosphereRow(hy),      'Interpolating atmosphere…', 14, 28);
  await forEachHRRow(hy => stepHR3_substrateRow(hy, seed), 'Computing substrate…', 28, 42);
  await forEachHRRow(hy => stepHR4_waterTableRow(hy),      'Computing water table…', 42, 52);
  await stepHR5_drainage();                                 // 52 → 72
  await forEachHRRow(hy => stepHR6_floraRow(hy),           'Computing flora…', 72, 82);
  await forEachHRRow(hy => stepHR7_terrainRow(hy),         'Deriving terrain…', 82, 88);
  await forEachHRRow(hy => stepHR8_colorRow(hy),           'Computing colors…', 88, 99);
}

// ── Sphere coords for a high-res cell (wrap-safe noise input) ──
function hrSphere(hx, hy) {
  const lat = (hy / HR_H) * Math.PI;
  const lon = (hx / HR_W) * Math.PI * 2;
  const sinLat = Math.sin(lat);
  return { x: sinLat * Math.cos(lon), y: Math.cos(lat), z: sinLat * Math.sin(lon) };
}

// ── Step HR1: elevation refinement (interpolate + coastline noise) ──
function stepHR1_elevationRow(hy, seed) {
  const ly = hy / hiResMultiplier;
  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;
    const lx = hx / hiResMultiplier;

    const baseElev = bilinearInterpolate(lx, ly, c => c.elevation);
    const s = hrSphere(hx, hy);

    // Multi-octave coastline noise (only near sea level)
    let coastNoise = 0, amp = 0.015, freq = 8;
    for (let oct = 0; oct < 4; oct++) {
      coastNoise += noise3D(s.x * freq, s.y * freq, s.z * freq, seed + oct * 131) * amp;
      amp *= 0.5; freq *= 2;
    }
    const coastProximity = Math.exp(-Math.abs(baseElev) * 30);

    // Broader inland terrain variation
    let terrainNoise = 0; amp = 0.008; freq = 4;
    for (let oct = 0; oct < 3; oct++) {
      terrainNoise += noise3D(s.x * freq, s.y * freq, s.z * freq, seed + 777 + oct * 313) * amp;
      amp *= 0.45; freq *= 2.2;
    }

    const elev = baseElev + coastNoise * coastProximity + terrainNoise;
    hiResData.elevation[hi] = elev;
    hiResData.isLand[hi]         = elev > 0 ? 1 : 0;
    hiResData.isShallowWater[hi] = (elev <= 0 && elev > -0.1) ? 1 : 0;
    hiResData.isDeepWater[hi]    = elev <= -0.1 ? 1 : 0;
  }
}

// ── Step HR2: interpolate atmospheric / mineral fields ──
function stepHR2_atmosphereRow(hy) {
  const ly = hy / hiResMultiplier;
  const lcy = Math.min(H - 1, Math.floor(ly));
  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;
    const lx = hx / hiResMultiplier;

    hiResData.precipitation[hi] = bilinearInterpolate(lx, ly, c => c.precipitation);
    hiResData.groundwater[hi]   = bilinearInterpolate(lx, ly, c => c.groundwater);
    hiResData.waterAvail[hi]    = bilinearInterpolate(lx, ly, c => c.waterAvailability || 0);
    hiResData.volcanism[hi]     = bilinearInterpolate(lx, ly, c => c.volcanism || 0);
    hiResData.iron[hi]          = bilinearInterpolate(lx, ly, c => c.minerals.iron);
    hiResData.copper[hi]        = bilinearInterpolate(lx, ly, c => c.minerals.copper);
    hiResData.manganese[hi]     = bilinearInterpolate(lx, ly, c => c.minerals.manganese);
    hiResData.windU[hi]         = bilinearInterpolate(lx, ly, c => c.windU || 0);
    hiResData.windV[hi]         = bilinearInterpolate(lx, ly, c => c.windV || 0);
    hiResData.windSpeed[hi]     = bilinearInterpolate(lx, ly, c => c.windSpeed || 0);
    hiResData.temperature[hi]   = bilinearInterpolate(lx, ly, c => c.temperature || 0);
    hiResData.sst[hi]           = bilinearInterpolate(lx, ly, c => c.sst || 0);

    // Freezing + plate id carried from nearest low-res cell (discrete fields)
    const lcx = ((Math.floor(lx) % W) + W) % W;
    const lcell = cells[lcy * W + lcx];
    hiResData.isFreezing[hi] = lcell.isFreezing ? 1 : 0;
    hiResData.plateId[hi]    = lcell.plateId || 0;
  }
}

// ── Step HR3: substrate (grain size) ──
function stepHR3_substrateRow(hy, seed) {
  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;

    if (!hiResData.isLand[hi]) {
      hiResData.grainSize[hi] = hiResData.isDeepWater[hi] ? 0.05 : 0.3;
      continue;
    }

    const eL = hiResData.elevation[hy * HR_W + ((hx - 1 + HR_W) % HR_W)];
    const eR = hiResData.elevation[hy * HR_W + ((hx + 1) % HR_W)];
    const eU = hy > 0        ? hiResData.elevation[(hy - 1) * HR_W + hx] : hiResData.elevation[hi];
    const eD = hy < HR_H - 1 ? hiResData.elevation[(hy + 1) * HR_W + hx] : hiResData.elevation[hi];
    const gradX = (eR - eL) * 0.5, gradY = (eD - eU) * 0.5;
    const slope = Math.sqrt(gradX * gradX + gradY * gradY);

    const elev = hiResData.elevation[hi];
    const volc = hiResData.volcanism[hi];

    const slopeGrain = Math.min(slope * 3.0, 1);
    const elevGrain  = Math.min(Math.max(0, elev) * 1.5, 0.8);
    const volcGrain  = volc * 0.6;
    let grain = slopeGrain * 0.35 + elevGrain * 0.25 + volcGrain * 0.15 + 0.075;

    // Coastal fining
    if (elev < 0.03) {
      let hasOcean = false;
      const dx4 = [-1, 1, 0, 0], dy4 = [0, 0, -1, 1];
      for (let d = 0; d < 4; d++) {
        const nx = (hx + dx4[d] + HR_W) % HR_W;
        const ny = hy + dy4[d];
        if (ny >= 0 && ny < HR_H && !hiResData.isLand[ny * HR_W + nx]) { hasOcean = true; break; }
      }
      grain = hasOcean ? (grain * 0.4 + 0.5 * 0.6) : (grain * 0.4 + 0.3 * 0.6);
    }

    const s = hrSphere(hx, hy);
    grain += noise3D(s.x * 10, s.y * 10, s.z * 10, seed + 41) * 0.08;
    hiResData.grainSize[hi] = clamp(grain, 0, 1);
  }
}

// ── Step HR4: water table & saturation ──
function stepHR4_waterTableRow(hy) {
  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;

    if (!hiResData.isLand[hi]) {
      hiResData.waterTableDepth[hi] = hiResData.elevation[hi];
      hiResData.saturation[hi] = 1.0;
      continue;
    }

    const elev = hiResData.elevation[hi];
    const precip = hiResData.precipitation[hi];
    const volc = hiResData.volcanism[hi];
    const grain = hiResData.grainSize[hi];

    let depth = Math.max(0, elev) * 3.0;
    depth -= precip * 1.2;
    depth -= volc * 1.0;
    if (elev < 0.05) depth -= (1.0 - elev / 0.05) * 0.8;

    if (depth < 0) {
      let isBasin = true;
      const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
      const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];
      for (let d = 0; d < 8; d++) {
        const nx = (hx + dx8[d] + HR_W) % HR_W;
        const ny = hy + dy8[d];
        if (ny < 0 || ny >= HR_H) continue;
        if (hiResData.elevation[ny * HR_W + nx] < elev) { isBasin = false; break; }
      }
      if (!isBasin) depth = 0;
    }

    hiResData.waterTableDepth[hi] = depth;

    const capillary = (1.0 - grain) * 0.15;
    const effDepth = depth - capillary;
    hiResData.saturation[hi] = effDepth <= 0
      ? Math.min(1, Math.max(0.7, 1.0 - effDepth * 0.5))
      : Math.min(0.7, Math.exp(-effDepth * 8.0));
  }
}

// ── Step HR5: drainage (flow accumulation + stream order) ──
async function stepHR5_drainage() {
  const flowAccum = new Float32Array(HR_TOTAL);
  const streamOrder = hiResData.streamOrder;

  updateProgress('Preparing drainage…', 52);
  await yieldFrame();

  const landIndices = [];
  for (let hi = 0; hi < HR_TOTAL; hi++) {
    if (hiResData.isLand[hi]) {
      flowAccum[hi] = hiResData.precipitation[hi] || 0.005;
      landIndices.push(hi);
    }
  }

  updateProgress('Sorting elevation…', 56);
  await yieldFrame();
  landIndices.sort((a, b) => hiResData.elevation[b] - hiResData.elevation[a]);

  updateProgress('Accumulating flow…', 60);
  await yieldFrame();

  const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
  const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];
  const n = landIndices.length;
  const yieldInterval = Math.max(1, Math.floor(n / 8));

  for (let k = 0; k < n; k++) {
    const hi = landIndices[k];
    const hx = hi % HR_W, hy = (hi / HR_W) | 0;

    let lowestElev = hiResData.elevation[hi];
    let lowestIdx = -1;
    for (let d = 0; d < 8; d++) {
      const nx = (hx + dx8[d] + HR_W) % HR_W;
      const ny = hy + dy8[d];
      if (ny < 0 || ny >= HR_H) continue;
      const ni = ny * HR_W + nx;
      if (hiResData.elevation[ni] < lowestElev) { lowestElev = hiResData.elevation[ni]; lowestIdx = ni; }
    }
    if (lowestIdx >= 0) flowAccum[lowestIdx] += flowAccum[hi];

    if (k > 0 && k % yieldInterval === 0) {
      updateProgress('Accumulating flow…', 60 + (k / n) * 12);
      await yieldFrame();
    }
  }

  // Stream order thresholds
  const avgP = 0.05;
  const t1 = 2.0 / (1 + avgP * 5);
  const t2 = t1 * 5, t3 = t1 * 20;
  for (let k = 0; k < n; k++) {
    const hi = landIndices[k];
    const f = flowAccum[hi];
    streamOrder[hi] = f > t3 ? 3 : f > t2 ? 2 : f > t1 ? 1 : 0;
  }
}

// ── Step HR6: flora ──
function stepHR6_floraRow(hy) {
  // Domain warp parameters: displace sampling coordinates with noise to break
  // grid-aligned classification boundaries. Only affects the flora TYPE decision
  // and chemo crust threshold, not the continuous values (saturation, grain size,
  // etc.) that feed into terrain.
  const warpScale = 0.08;   // Noise frequency — one undulation per ~12 hi-res cells
  const warpAmp = 1.8;      // Displacement in hi-res cells
  const warpSeed1 = 0x7A3C;
  const warpSeed2 = 0x9E1F;

  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;

    if (!hiResData.isLand[hi] || hiResData.isFreezing[hi]) {
      hiResData.groundCover[hi] = 0;
      hiResData.canopyDensity[hi] = 0;
      hiResData.chemoCrust[hi] = 0;
      hiResData.organicContent[hi] = 0;
      hiResData.floraType[hi] = 0;
      continue;
    }

    const sat = hiResData.saturation[hi];
    const grain = hiResData.grainSize[hi];
    const precip = hiResData.precipitation[hi];
    const gw = hiResData.groundwater[hi];
    const volc = hiResData.volcanism[hi];
    const iron = hiResData.iron[hi];
    const copper = hiResData.copper[hi];
    const mn = hiResData.manganese[hi];
    const mineralTotal = iron + copper + mn;
    const depth = hiResData.waterTableDepth[hi];
    const hasWater = depth < -0.01;

    // Domain-warped coordinates for flora TYPE classification and chemo crust only.
    // This displaces the threshold boundary with noise so it follows an organic
    // contour instead of the planetary grid.
    const wx = hx + noise2D(hx * warpScale, hy * warpScale, warpSeed1) * warpAmp;
    const wy = hy + noise2D(hx * warpScale, hy * warpScale, warpSeed2) * warpAmp;
    const ironW = bilinearSampleHR(hiResData.iron, wx, wy);
    const copperW = bilinearSampleHR(hiResData.copper, wx, wy);
    const mnW = bilinearSampleHR(hiResData.manganese, wx, wy);
    const mineralTotalW = ironW + copperW + mnW;
    const precipW = bilinearSampleHR(hiResData.precipitation, wx, wy);
    const gwW = bilinearSampleHR(hiResData.groundwater, wx, wy);
    const volcW = bilinearSampleHR(hiResData.volcanism, wx, wy);

    // Ground cover — scaled by water availability so barren/dry zones get low coverage
    let gc;
    if (hasWater) gc = 0.3;
    else if (grain > 0.8) gc = 0.08;
    else {
      const waterFactor = clamp(precip * 3.0 + gw * 2.0, 0, 1);
      gc = (0.5 + (1.0 - grain) * 0.4) * waterFactor;
    }
    hiResData.groundCover[hi] = gc;

    // Canopy
    let cd = 0;
    if (!hasWater && grain <= 0.7) {
      const waterFactor = Math.min(1, precip * 3.0 + gw * 1.5);
      let satFactor;
      if (sat > 0.95) satFactor = 0.15;
      else if (sat > 0.85) satFactor = 0.35;
      else if (sat > 0.5) satFactor = 0.80;
      else if (sat > 0.3) satFactor = 1.0;
      else satFactor = 0.45;
      const subFactor = grain < 0.5 ? 1.0 : Math.max(0, 1.0 - (grain - 0.5) * 3.0);
      cd = waterFactor * satFactor * subFactor;
      if (waterFactor > 0.05 && subFactor > 0.1) cd = Math.max(cd, 0.12);
    }
    hiResData.canopyDensity[hi] = cd;

    // Chemo crust — uses warped mineralTotal so crust boundary matches flora type boundary
    let cc = 0;
    if (mineralTotalW > 0.4) {
      const cf = mineralTotalW * Math.max(sat, volc * 1.5);
      const pf = gc * 0.8;
      if (cf > pf) {
        cc = Math.min(1, (cf - pf) * 2.0);
        hiResData.groundCover[hi] *= (1 - cc * 0.6);
      }
    }
    hiResData.chemoCrust[hi] = cc;

    // Flora type — uses warped mineral/water values for organic boundaries
    const regWaterW = Math.min(1, precipW * 3.0 + gwW * 1.5);
    const photoFit = regWaterW * 0.8;
    const chemoFit = mineralTotalW * Math.max(regWaterW, volcW * 1.5) * 1.2;
    const mixoFit = (0.6 + 0.5 * mineralTotalW) * regWaterW;
    if (chemoFit > photoFit && chemoFit > mixoFit && chemoFit > 0.02) hiResData.floraType[hi] = 2;
    else if (mixoFit > photoFit && mixoFit > chemoFit && mixoFit > 0.02) hiResData.floraType[hi] = 3;
    else if (photoFit > 0.02) hiResData.floraType[hi] = 1;
    else hiResData.floraType[hi] = 0;

    // Organic content
    const prod = (hiResData.groundCover[hi] + cd) * 0.5;
    hiResData.organicContent[hi] = prod * (sat > 0.7 ? 0.7 : 0.3);
  }
}

// ── Step HR7: terrain type + cover type ──
function stepHR7_terrainRow(hy) {
  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;

    // Water / ice guards preserve the high-res deep/shallow distinction the
    // canonical fn collapses; everything else routes through deriveTerrainAndCover.
    if (hiResData.isDeepWater[hi])    { hiResData.terrainType[hi] = 1; hiResData.coverType[hi] = 0; continue; }
    if (hiResData.isShallowWater[hi]) { hiResData.terrainType[hi] = 2; hiResData.coverType[hi] = 0; continue; }
    if (!hiResData.isLand[hi])        { hiResData.terrainType[hi] = 2; hiResData.coverType[hi] = 0; continue; }
    if (hiResData.isFreezing[hi])     { hiResData.terrainType[hi] = 7; hiResData.coverType[hi] = 0; continue; }

    const elev = hiResData.elevation[hi];
    const isCoastal = elev > 0 && elev < 0.03;

    const result = deriveTerrainAndCover(
      elev,
      hiResData.isLand[hi],
      hiResData.grainSize[hi],
      hiResData.saturation[hi],
      hiResData.groundCover[hi],
      hiResData.canopyDensity[hi],
      hiResData.chemoCrust[hi],
      hiResData.floraType[hi],            // int enum — canonical handles both
      hiResData.waterTableDepth[hi],
      isCoastal
    );

    hiResData.terrainType[hi] = terrainTypeToInt(result.terrainType);
    hiResData.coverType[hi]   = coverTypeToInt(result.coverType);
  }
}

const HR_FLORA_NAMES = ['barren', 'photosynthetic', 'chemotrophic', 'mixotrophic'];

// ── Step HR8: pre-compute surface colors ──
function stepHR8_colorRow(hy) {
  for (let hx = 0; hx < HR_W; hx++) {
    const hi = hy * HR_W + hx;

    // Frozen land renders as ice regardless of palette
    if (hiResData.isLand[hi] && hiResData.isFreezing[hi]) {
      hiResData.colorR[hi] = 210; hiResData.colorG[hi] = 215; hiResData.colorB[hi] = 220;
      continue;
    }

    const wtd = hiResData.waterTableDepth[hi];
    const palette = computeTilePalette({
      terrainType:    intToTerrainType(hiResData.terrainType[hi]),
      coverType:      intToCoverType(hiResData.coverType[hi]),
      iron:           hiResData.iron[hi],
      copper:         hiResData.copper[hi],
      manganese:      hiResData.manganese[hi],
      grainSize:      hiResData.grainSize[hi],
      saturation:     hiResData.saturation[hi],
      organicContent: hiResData.organicContent[hi],
      groundCover:    hiResData.groundCover[hi],
      canopyDensity:  hiResData.canopyDensity[hi],
      chemoCrust:     hiResData.chemoCrust[hi],
      waterDepth:     wtd < 0 ? -wtd : 0,
      floraType:      HR_FLORA_NAMES[hiResData.floraType[hi]],
    });
    hiResData.colorR[hi] = palette.bg.r;
    hiResData.colorG[hi] = palette.bg.g;
    hiResData.colorB[hi] = palette.bg.b;
  }
}

// ══════════════════════════════════════════════════════════════════
// ── High-res rendering ──
// ══════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════
// ── Unified overlay module — ONE set of overlay colour functions ──
//    Every planetary map view (flat, globe, Mollweide) reads from here.
//    Each function takes a grid index `gi` into the `planet` typed arrays
//    and returns { r, g, b }. This is the single source of truth for
//    planetary colour — regional / tile reuse the same canonical
//    deriveTerrainAndCover + computeTilePalette upstream.
// ══════════════════════════════════════════════════════════════════
const overlays = {

  surface(gi) {
    return { r: planet.colorR[gi], g: planet.colorG[gi], b: planet.colorB[gi] };
  },

  topographic(gi) {
    if (planet.isDeepWater[gi])    return { r: 10, g: 22, b: 40 };
    if (planet.isShallowWater[gi]) return { r: 26, g: 48, b: 80 };
    const e = planet.elevation[gi];
    if (planet.isFreezing[gi] && planet.isLand[gi]) {
      const t = clamp(e / 0.6, 0, 1);
      return lerpColor({ r: 190, g: 195, b: 200 }, { r: 220, g: 225, b: 230 }, t);
    }
    if (e < 0.05)  return { r: 60, g: 75, b: 55 };
    if (e < 0.15)  return { r: 90, g: 100, b: 65 };
    if (e < 0.30)  return { r: 130, g: 115, b: 70 };
    if (e < 0.45)  return { r: 160, g: 130, b: 90 };
    if (e < 0.60)  return { r: 180, g: 160, b: 130 };
    return { r: 200, g: 185, b: 160 };
  },

  plates(gi) {
    const n = (plates && plates.length) ? plates.length : 1;
    const hue = (planet.plateId[gi] / n) * 360;
    // No plateType at surface res; approximate continental/oceanic by land mask.
    const land = planet.isLand[gi];
    return hslToRgb(hue, land ? 0.4 : 0.25, land ? 0.45 : 0.30);
  },

  iron(gi)      { return overlayMineral(gi, planet.iron[gi], 'iron'); },
  copper(gi)    { return overlayMineral(gi, planet.copper[gi], 'copper'); },
  manganese(gi) { return overlayMineral(gi, planet.manganese[gi], 'manganese'); },
  composite(gi) {
    const deep = !planet.isLand[gi] && !planet.isShallowWater[gi];
    const s = deep ? 80 : 255;
    return {
      r: Math.floor(planet.iron[gi]      * s),
      g: Math.floor(planet.copper[gi]    * s),
      b: Math.floor(planet.manganese[gi] * s),
    };
  },

  moisture(gi)      { return overlayPrecip(gi); },
  precipitation(gi) { return overlayPrecip(gi); },

  groundwater(gi) {
    if (!planet.isLand[gi]) return { r: 15, g: 20, b: 30 };
    const gw = planet.groundwater[gi];
    return { r: 10, g: Math.floor(30 + gw * 150), b: Math.floor(40 + gw * 120) };
  },

  waterAvail(gi) {
    if (!planet.isLand[gi]) return { r: 15, g: 20, b: 30 };
    const wa = planet.waterAvail[gi];
    return { r: 10, g: Math.floor(30 + wa * 170), b: Math.floor(20 + wa * 100) };
  },

  wind(gi) {
    if (planet.isLand[gi]) {
      const e = clamp(planet.elevation[gi], 0, 0.6);
      return { r: Math.floor(35 + e * 40), g: Math.floor(30 + e * 35), b: Math.floor(25 + e * 25) };
    }
    return { r: 20, g: 25, b: 38 };
  },

  currents(gi) {
    if (planet.isLand[gi]) return { r: 18, g: 18, b: 18 };
    const sst = planet.sst[gi];
    if (sst < 0.5) {
      const t = sst / 0.5;
      return { r: Math.floor(15 + t * 20), g: Math.floor(25 + t * 30), b: Math.floor(60 + t * 30) };
    }
    const t = (sst - 0.5) / 0.5;
    return { r: Math.floor(35 + t * 35), g: Math.floor(55 - t * 20), b: Math.floor(90 - t * 50) };
  },

  floraType(gi)    { return overlayFlora(gi); },
  floraDensity(gi) { return overlayFlora(gi); },

  terrainType(gi) {
    const colors = [[40,40,40],[10,18,45],[28,45,85],[85,65,38],[75,100,45],[110,82,50],[155,140,100],[92,88,78],[165,145,100]];
    const c = colors[planet.terrainType[gi]] || colors[0];
    const ct = planet.coverType[gi];
    const dim = (ct >= 1 && ct <= 2) ? 0.55 : ct >= 3 ? 0.75 : 1.0;
    return { r: (c[0]*dim)|0, g: (c[1]*dim)|0, b: (c[2]*dim)|0 };
  },

  substrate(gi) {
    if (!planet.isLand[gi]) return { r: 15, g: 18, b: 25 };
    const gs = planet.grainSize[gi];
    if (gs < 0.2) return { r: 55, g: 65, b: 85 };
    if (gs < 0.45) { const f=(gs-0.2)/0.25; return { r:(55+f*75)|0, g:(65+f*45)|0, b:(85-f*45)|0 }; }
    if (gs < 0.65) { const f=(gs-0.45)/0.2; return { r:(130+f*45)|0, g:(110+f*25)|0, b:(40+f*8)|0 }; }
    const f=(gs-0.65)/0.35; return { r:(175-f*70)|0, g:(135-f*50)|0, b:(48+f*35)|0 };
  },

  saturation(gi) {
    if (!planet.isLand[gi]) return { r: 10, g: 18, b: 45 };
    const s = planet.saturation[gi];
    return { r: (110 - s*90)|0, g: (75 + s*35)|0, b: (25 + s*110)|0 };
  },

  drainage(gi) {
    if (!planet.isLand[gi]) return { r: 12, g: 20, b: 40 };
    const so = planet.streamOrder[gi];
    if (so >= 3) return { r: 70, g: 150, b: 220 };
    if (so === 2) return { r: 55, g: 115, b: 180 };
    if (so === 1) return { r: 45, g: 85, b: 130 };
    return { r: 40, g: 46, b: 42 };
  },
};

// Shared overlay helpers (read planet)
function overlayMineral(gi, v, channel) {
  const deep = !planet.isLand[gi] && !planet.isShallowWater[gi];
  if (deep) {
    const d = Math.floor(v * 40);
    if (channel === 'iron')   return { r: d, g: 0, b: 0 };
    if (channel === 'copper') return { r: 0, g: d, b: 0 };
    return { r: 0, g: 0, b: d };
  }
  const f = Math.floor(v * 255);
  if (channel === 'iron')   return { r: f, g: Math.floor(f/4), b: Math.floor(f/8) };
  if (channel === 'copper') return { r: Math.floor(f/8), g: f, b: Math.floor(f/3) };
  return { r: Math.floor(f/3), g: Math.floor(f/8), b: f };
}
function overlayPrecip(gi) {
  if (!planet.isLand[gi]) return { r: 25, g: 35, b: 55 };
  const p = planet.precipitation[gi];
  return { r: 10, g: Math.floor(20 + p * 80), b: Math.floor(40 + p * 200) };
}
function overlayFlora(gi) {
  const ft = planet.floraType[gi];
  const cd = planet.canopyDensity[gi];
  const gc = planet.groundCover[gi];
  let r, g, b;
  if (!planet.isLand[gi]) { r = 10; g = 15; b = 30; }
  else if (planet.isFreezing[gi]) { r = 192; g = 192; b = 200; }
  else if (ft === 0) { r = 45; g = 40; b = 30; }
  else if (ft === 1) { r = (40 + gc * 55)|0; g = (12 + gc * 6)|0;  b = (12 + gc * 8)|0; }
  else if (ft === 2) { r = (25 + gc * 18)|0; g = (18 + gc * 12)|0; b = (35 + gc * 45)|0; }
  else if (ft === 3) { r = (35 + gc * 30)|0; g = (12 + gc * 8)|0;  b = (25 + gc * 22)|0; }
  else { r = 40; g = 40; b = 40; }
  if (cd > 0.15 && planet.isLand[gi] && !planet.isFreezing[gi]) { r = (r*0.6)|0; g = (g*0.6)|0; b = (b*0.6)|0; }
  return { r, g, b };
}

// Compatibility wrapper: legacy callers expect [r,g,b]
function overlayColorAt(gi, overlayName) {
  const fn = overlays[overlayName] || overlays.surface;
  const c = fn(gi);
  return { r: c.r, g: c.g, b: c.b };
}

// Color for one high-res cell under a given overlay → [r,g,b]
function hiResColorAt(hi, overlay) {
  if (overlay === 'surface') {
    return [hiResData.colorR[hi], hiResData.colorG[hi], hiResData.colorB[hi]];
  }
  if (overlay === 'terrainType') {
    const colors = [[40,40,40],[10,18,45],[28,45,85],[85,65,38],[75,100,45],[110,82,50],[155,140,100],[92,88,78],[165,145,100]];
    const c = colors[hiResData.terrainType[hi]] || colors[0];
    const ct = hiResData.coverType[hi];
    const dim = (ct >= 1 && ct <= 2) ? 0.55 : ct >= 3 ? 0.75 : 1.0;
    return [(c[0]*dim)|0, (c[1]*dim)|0, (c[2]*dim)|0];
  }
  if (overlay === 'floraDensity' || overlay === 'floraType') {
    const ft = hiResData.floraType[hi];
    const cd = hiResData.canopyDensity[hi];
    const gc = hiResData.groundCover[hi];
    let r, g, b;
    if (!hiResData.isLand[hi]) { r = 10; g = 15; b = 30; }
    else if (hiResData.isFreezing[hi]) { r = 192; g = 192; b = 200; }
    else if (ft === 0) { r = 45; g = 40; b = 30; }
    else if (ft === 1) { r = (40 + gc * 55)|0; g = (12 + gc * 6)|0;  b = (12 + gc * 8)|0; }
    else if (ft === 2) { r = (25 + gc * 18)|0; g = (18 + gc * 12)|0; b = (35 + gc * 45)|0; }
    else if (ft === 3) { r = (35 + gc * 30)|0; g = (12 + gc * 8)|0;  b = (25 + gc * 22)|0; }
    else { r = 40; g = 40; b = 40; }
    if (cd > 0.15 && hiResData.isLand[hi] && !hiResData.isFreezing[hi]) { r = (r*0.6)|0; g = (g*0.6)|0; b = (b*0.6)|0; }
    return [r, g, b];
  }
  if (overlay === 'saturation') {
    if (!hiResData.isLand[hi]) return [10, 18, 45];
    const s = hiResData.saturation[hi];
    return [(110 - s*90)|0, (75 + s*35)|0, (25 + s*110)|0];
  }
  if (overlay === 'substrate') {
    if (!hiResData.isLand[hi]) return [15, 18, 25];
    const gs = hiResData.grainSize[hi];
    if (gs < 0.2) return [55, 65, 85];
    if (gs < 0.45) { const f=(gs-0.2)/0.25; return [(55+f*75)|0,(65+f*45)|0,(85-f*45)|0]; }
    if (gs < 0.65) { const f=(gs-0.45)/0.2; return [(130+f*45)|0,(110+f*25)|0,(40+f*8)|0]; }
    const f=(gs-0.65)/0.35; return [(175-f*70)|0,(135-f*50)|0,(48+f*35)|0];
  }
  if (overlay === 'drainage') {
    if (!hiResData.isLand[hi]) return [12, 20, 40];
    const so = hiResData.streamOrder[hi];
    if (so >= 3) return [70, 150, 220];
    if (so === 2) return [55, 115, 180];
    if (so === 1) return [45, 85, 130];
    return [40, 46, 42];
  }
  // Fallback: surface
  return [hiResData.colorR[hi], hiResData.colorG[hi], hiResData.colorB[hi]];
}

// Render the flat 1024×512 canvas by downsampling the high-res grid.
function renderFlatFromHighRes(overlay) {
  imageData = ctx.createImageData(1024, 512);
  const d = imageData.data;
  const CW = 1024, CH = 512;
  for (let cy = 0; cy < CH; cy++) {
