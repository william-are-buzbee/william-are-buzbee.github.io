    const precip = avg(land, c => c.precipitation || 0);
    const gw = avg(land, c => c.groundwater || 0);
    const drain = avg(land, c => c.drainage || 0);
    const wa = avg(land, c => c.waterAvailability || 0);

    console.log(
      `${band.name.padEnd(25)} | wind: u=${windU.toFixed(3)} v=${windV.toFixed(3)} spd=${windSpd.toFixed(3)} | sst=${sst.toFixed(3)} | oceanMoist=${oceanMoist.toFixed(4)} landMoist=${landMoist.toFixed(4)} | precip=${precip.toFixed(4)} gw=${gw.toFixed(3)} drain=${drain.toFixed(4)} wa=${wa.toFixed(3)} | land=${land.length} ocean=${ocean.length}`
    );
  }

  const landCells = cells.filter(c => c.isLand);
  const oceanCells = cells.filter(c => !c.isLand);

  const stat = (arr, fn) => {
    if (!arr.length) return { min: 0, max: 0, mean: 0 };
    let min = Infinity, max = -Infinity, sum = 0;
    for (const c of arr) {
      const v = fn(c);
      if (v < min) min = v;
      if (v > max) max = v;
      sum += v;
    }
    return { min, max, mean: sum / arr.length };
  };

  console.log('\n=== GLOBAL STATS (land cells) ===');
  const fields = [
    ['precipitation', c => c.precipitation || 0],
    ['groundwater', c => c.groundwater || 0],
    ['drainage', c => c.drainage || 0],
    ['waterAvailability', c => c.waterAvailability || 0],
    ['atmosphericMoisture', c => c.atmosphericMoisture || 0],
    ['windSpeed', c => c.windSpeed || 0],
  ];

  for (const [name, fn] of fields) {
    const s = stat(landCells, fn);
    console.log(`  ${name.padEnd(22)} min=${s.min.toFixed(4)} max=${s.max.toFixed(4)} mean=${s.mean.toFixed(4)}`);
  }

  console.log('\n=== GLOBAL STATS (ocean cells) ===');
  const oceanFields = [
    ['sst', c => c.sst || 0],
    ['atmosphericMoisture', c => c.atmosphericMoisture || 0],
    ['windSpeed', c => c.windSpeed || 0],
    ['currentSpeed', c => c.currentSpeed || 0],
  ];

  for (const [name, fn] of oceanFields) {
    const s = stat(oceanCells, fn);
    console.log(`  ${name.padEnd(22)} min=${s.min.toFixed(4)} max=${s.max.toFixed(4)} mean=${s.mean.toFixed(4)}`);
  }

  let nanCount = { precip: 0, gw: 0, wa: 0, windU: 0, sst: 0 };
  for (const c of cells) {
    if (isNaN(c.precipitation) || c.precipitation === undefined) nanCount.precip++;
    if (isNaN(c.groundwater) || c.groundwater === undefined) nanCount.gw++;
    if (isNaN(c.waterAvailability) || c.waterAvailability === undefined) nanCount.wa++;
    if (isNaN(c.windU) || c.windU === undefined) nanCount.windU++;
    if (isNaN(c.sst) || c.sst === undefined) nanCount.sst++;
  }
  const hasNaN = Object.values(nanCount).some(v => v > 0);
  if (hasNaN) {
    console.log('\n⚠ NaN/UNDEFINED DETECTED:');
    for (const [k, v] of Object.entries(nanCount)) {
      if (v > 0) console.log(`  ${k}: ${v} cells`);
    }
  } else {
    console.log('\n✓ No NaN/undefined in critical fields');
  }

  console.log('=== END DIAGNOSTIC ===');
}

// ── Precipitation-focused diagnostic ──
function printPrecipDiagnostic() {
  console.log('\n=== PRECIPITATION DIAGNOSTIC ===');

  const land = [];
  const ocean = [];
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].isLand) land.push(i);
    else ocean.push(i);
  }

  let zeroPrecip = 0, lowPrecip = 0, modPrecip = 0, highPrecip = 0;
  for (const i of land) {
    const p = cells[i].precipitation || 0;
    if (p < 0.001) zeroPrecip++;
    else if (p < 0.05) lowPrecip++;
    else if (p < 0.2) modPrecip++;
    else highPrecip++;
  }
  const pct = (n) => (n / Math.max(1, land.length) * 100).toFixed(1);
  console.log('Land precipitation distribution:');
  console.log(`  Zero (<0.001):       ${zeroPrecip} (${pct(zeroPrecip)}%)`);
  console.log(`  Low (0.001-0.05):    ${lowPrecip} (${pct(lowPrecip)}%)`);
  console.log(`  Moderate (0.05-0.2): ${modPrecip} (${pct(modPrecip)}%)`);
  console.log(`  High (>0.2):         ${highPrecip} (${pct(highPrecip)}%)`);

  let zeroOceanMoist = 0;
  for (const i of ocean) {
    const m = cells[i].atmosphericMoisture || 0;
    if (m < 0.001) zeroOceanMoist++;
  }
  console.log(`\nOcean cells with zero moisture: ${zeroOceanMoist} / ${ocean.length} (${(zeroOceanMoist / Math.max(1, ocean.length) * 100).toFixed(1)}%)`);

  let barren = 0, photo = 0, chemo = 0, mixo = 0, other = 0;
  for (const i of land) {
    const ft = cells[i].floraType;
    if (ft === 'photosynthetic') photo++;
    else if (ft === 'chemotrophic') chemo++;
    else if (ft === 'mixotrophic') mixo++;
    else if (ft === 'barren') barren++;
    else other++;
  }
  console.log('\nFlora distribution:');
  console.log(`  Barren:          ${barren} (${pct(barren)}%)`);
  console.log(`  Photosynthetic:  ${photo} (${pct(photo)}%)`);
  console.log(`  Chemotrophic:    ${chemo} (${pct(chemo)}%)`);
  console.log(`  Mixotrophic:     ${mixo} (${pct(mixo)}%)`);
  if (other) console.log(`  Other (frozen):  ${other} (${pct(other)}%)`);

  console.log('\n--- Sample land cells ---');
  if (land.length) {
    const step = Math.max(1, Math.floor(land.length / 5));
    for (let s = 0; s < 5; s++) {
      const i = land[Math.min(land.length - 1, s * step)];
      const c = cells[i];
      const x = i % W;
      const y = Math.floor(i / W);
      const lat = ((y / H) * 180 - 90).toFixed(1);
      console.log(`  Cell (${x},${y}) lat=${lat}: elev=${(c.elevation || 0).toFixed(3)} precip=${(c.precipitation || 0).toFixed(4)} atmoMoist=${(c.atmosphericMoisture || 0).toFixed(4)} windSpd=${(c.windSpeed || 0).toFixed(3)} gw=${(c.groundwater || 0).toFixed(3)} wa=${(c.waterAvailability || 0).toFixed(3)} flora=${c.floraType} density=${(c.floraDensity || 0).toFixed(3)}`);
    }
  }

  console.log('=== END PRECIPITATION DIAGNOSTIC ===');
}

// ── Rendering ──
const canvas = document.getElementById('planetCanvas');
const ctx = canvas.getContext('2d');
let imageData = ctx.createImageData(1024, 512);

function setPixel2x(x, y, r, g, b) {
  const sx = x * 2, sy = y * 2;
  for (let dy = 0; dy < 2; dy++) {
    for (let dx = 0; dx < 2; dx++) {
      const off = ((sy + dy) * 1024 + (sx + dx)) * 4;
      imageData.data[off] = r;
      imageData.data[off + 1] = g;
      imageData.data[off + 2] = b;
      imageData.data[off + 3] = 255;
    }
  }
}

// ── HSL to RGB helper ──
function hslToRgb(h, s, l) {
  h /= 360;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h * 12) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return { r: Math.floor(f(0) * 255), g: Math.floor(f(8) * 255), b: Math.floor(f(4) * 255) };
}

// ── Color interpolation ──
function lerpColor(c1, c2, t) {
  return {
    r: Math.round(c1.r + (c2.r - c1.r) * t),
    g: Math.round(c1.g + (c2.g - c1.g) * t),
    b: Math.round(c1.b + (c2.b - c1.b) * t),
  };
}

// ── Mineral channel helper ──
function mineralChannel(cell, channel) {
  if (!cell.isLand && !cell.isShallowWater) {
    const v = Math.floor(cell.minerals[channel] * 40);
    if (channel === 'iron') return { r: v, g: 0, b: 0 };
    if (channel === 'copper') return { r: 0, g: v, b: 0 };
    return { r: 0, g: 0, b: v };
  }
  const v = Math.floor(cell.minerals[channel] * 255);
  if (channel === 'iron') return { r: v, g: Math.floor(v / 4), b: Math.floor(v / 8) };
  if (channel === 'copper') return { r: Math.floor(v / 8), g: v, b: Math.floor(v / 3) };
  return { r: Math.floor(v / 3), g: Math.floor(v / 8), b: v };
}

// ── Overlay color functions ──
const overlayFunctions = {

  'surface': function(cell) {
    // Unified with regional / high-res / tile: all surface color goes through
    // computeTilePalette on the SAME terrain/cover the canonical fn derived.
    if (cell.isDeepWater) return computeTilePalette({ terrainType: 'deep_water' }).bg;
    if (cell.isShallowWater) {
      const m = cell.minerals || {};
      return computeTilePalette({
        terrainType: 'water', waterDepth: 0.15,
        iron: m.iron || 0, copper: m.copper || 0, manganese: m.manganese || 0,
      }).bg;
    }
    if (cell.isFreezing) return { r: 210, g: 215, b: 220 };

    const m = cell.minerals || {};
    return computeTilePalette({
      terrainType:    cell.terrainType,
      coverType:      cell.coverType,
      iron:           m.iron || 0,
      copper:         m.copper || 0,
      manganese:      m.manganese || 0,
      grainSize:      cell._estGrainSize != null ? cell._estGrainSize : 0.3,
      saturation:     cell._estSaturation || 0,
      organicContent: 0,
      groundCover:    cell._estGroundCover || 0,
      canopyDensity:  cell._estCanopy || 0,
      chemoCrust:     cell._estChemoCrust || 0,
      waterDepth:     0,
      floraType:      cell.floraType || 'barren',
    }).bg;
  },

  'topographic': function(cell) {
    if (cell.isDeepWater)    return { r: 10, g: 22, b: 40 };
    if (cell.isShallowWater) return { r: 26, g: 48, b: 80 };

    if (cell.isFreezing && cell.isLand) {
      const t = clamp((cell.elevation) / 0.6, 0, 1);
      return lerpColor({ r: 190, g: 195, b: 200 }, { r: 220, g: 225, b: 230 }, t);
    }

    const e = cell.elevation;
    if (e < 0.05)  return { r: 60, g: 75, b: 55 };
    if (e < 0.15)  return { r: 90, g: 100, b: 65 };
    if (e < 0.30)  return { r: 130, g: 115, b: 70 };
    if (e < 0.45)  return { r: 160, g: 130, b: 90 };
    if (e < 0.60)  return { r: 180, g: 160, b: 130 };
    return { r: 200, g: 185, b: 160 };
  },

  'plates': function(cell) {
    if (cell.boundaryDistance === 0 && cell.boundaryType !== null) return { r: 240, g: 240, b: 240 };
    const hue = (cell.plateId / plates.length) * 360;
    const sat = cell.plateType === 'continental' ? 0.4 : 0.25;
    const lum = cell.plateType === 'continental' ? 0.45 : 0.30;
    return hslToRgb(hue, sat, lum);
  },

  'iron':      cell => mineralChannel(cell, 'iron'),
  'copper':    cell => mineralChannel(cell, 'copper'),
  'manganese': cell => mineralChannel(cell, 'manganese'),
  'composite': cell => ({
    r: Math.floor(cell.minerals.iron * ((!cell.isLand && !cell.isShallowWater) ? 80 : 255)),
    g: Math.floor(cell.minerals.copper * ((!cell.isLand && !cell.isShallowWater) ? 80 : 255)),
    b: Math.floor(cell.minerals.manganese * ((!cell.isLand && !cell.isShallowWater) ? 80 : 255)),
  }),

  'moisture': function(cell) {
    if (!cell.isLand) return { r: 25, g: 35, b: 55 };
    const p = cell.precipitation;
    return { r: 10, g: Math.floor(20 + p * 80), b: Math.floor(40 + p * 200) };
  },

  'precipitation': function(cell) {
    if (!cell.isLand) return { r: 25, g: 35, b: 55 };
    const p = cell.precipitation;
    return { r: 10, g: Math.floor(20 + p * 80), b: Math.floor(40 + p * 200) };
  },

  'groundwater': function(cell) {
    if (!cell.isLand) return { r: 15, g: 20, b: 30 };
    const gw = cell.groundwater;
    return { r: 10, g: Math.floor(30 + gw * 150), b: Math.floor(40 + gw * 120) };
  },

  'waterAvail': function(cell) {
    if (!cell.isLand) return { r: 15, g: 20, b: 30 };
    const wa = cell.waterAvailability;
    return { r: 10, g: Math.floor(30 + wa * 170), b: Math.floor(20 + wa * 100) };
  },

  'wind': function(cell) {
    if (cell.isLand) {
      const e = clamp(cell.elevation, 0, 0.6);
      return { r: Math.floor(35 + e * 40), g: Math.floor(30 + e * 35), b: Math.floor(25 + e * 25) };
    }
    return { r: 20, g: 25, b: 38 };
  },

  'currents': function(cell) {
    if (cell.isLand) return { r: 18, g: 18, b: 18 };
    const sst = cell.sst;
    if (sst < 0.5) {
      const t = sst / 0.5;
      return { r: Math.floor(15 + t * 20), g: Math.floor(25 + t * 30), b: Math.floor(60 + t * 30) };
    } else {
      const t = (sst - 0.5) / 0.5;
      return { r: Math.floor(35 + t * 35), g: Math.floor(55 - t * 20), b: Math.floor(90 - t * 50) };
    }
  },

  'floraType': function(cell) {
    if (cell.floraType === 'photosynthetic') return { r: 128, g: 32, b: 32 };
    if (cell.floraType === 'chemotrophic')   return { r: 80, g: 32, b: 96 };
    if (cell.floraType === 'mixotrophic')    return { r: 112, g: 48, b: 64 };
    if (cell.floraType === 'barren')         return { r: 64, g: 64, b: 64 };
    if (cell.floraType === 'frozen')         return { r: 192, g: 192, b: 200 };
    return { r: 16, g: 32, b: 48 };
  },

  'floraDensity': function(cell) {
    if (!cell.isLand) return { r: 10, g: 20, b: 35 };
    if (cell.floraType === 'barren' || cell.floraType === 'frozen') return { r: 32, g: 32, b: 32 };
    const d = clamp(cell.floraDensity, 0, 1);
    const base = overlayFunctions['floraType'](cell);
    return {
      r: Math.floor(base.r * (0.3 + d * 0.7)),
      g: Math.floor(base.g * (0.3 + d * 0.7)),
      b: Math.floor(base.b * (0.3 + d * 0.7)),
    };
  },
};

// ── Get current colorFn ──
function getColorFn(overlay) {
  return overlayFunctions[overlay] || overlayFunctions['surface'];
}

// ── Flat map renderer ──
// One path: sample the canonical `planet` surface through the unified overlay
// module. Wind / currents draw their base-resolution streamlines on top.
function render(overlay) {
  if (planet) {
    const CW = 1024, CH = 512;
    imageData = ctx.createImageData(CW, CH);
    const d = imageData.data;
    const fn = overlays[overlay] || overlays.surface;
    for (let cy = 0; cy < CH; cy++) {
      const gy = (cy * HR_H / CH) | 0;
      const rowBase = gy * HR_W;
      for (let cx = 0; cx < CW; cx++) {
        const gx = (cx * HR_W / CW) | 0;
        const col = fn(rowBase + gx);
        const off = (cy * CW + cx) * 4;
        d[off] = col.r; d[off + 1] = col.g; d[off + 2] = col.b; d[off + 3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);

    if (overlay === 'wind')     drawStreamlines(ctx, 'wind', 1024, 512);
    else if (overlay === 'currents') drawStreamlines(ctx, 'currents', 1024, 512);

    drawSelectionMarker();
    return;
  }

  // Fallback (surface allocation failed / OOM): legacy low-res cells path.
  if (!cells) return;
  imageData = ctx.createImageData(1024, 512);
  const colorFn = getColorFn(overlay);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = cells[y * W + x];
      const col = colorFn(c);
      setPixel2x(x, y, col.r, col.g, col.b);
    }
  }
  ctx.putImageData(imageData, 0, 0);
  if (overlay === 'wind')          drawStreamlines(ctx, 'wind', 1024, 512);
  else if (overlay === 'currents') drawStreamlines(ctx, 'currents', 1024, 512);
  drawSelectionMarker();
}

// ── Streamline rendering ──
function drawStreamlines(targetCtx, mode, canvasW, canvasH) {
  if (!cells) return;
  const scaleX = canvasW / W;
  const scaleY = canvasH / H;

  const numSeeds = mode === 'wind' ? 400 : 250;
  const steps = mode === 'wind' ? 20 : 25;
  const stepSize = 0.7;

  let meanSST = 0.5;
  if (mode === 'currents') {
    let sum = 0, count = 0;
    for (let i = 0; i < TOTAL; i++) {
      if (!cells[i].isLand) { sum += cells[i].sst; count++; }
    }
    if (count > 0) meanSST = sum / count;
  }

  const sqrtN = Math.ceil(Math.sqrt(numSeeds));
  for (let sy = 0; sy < sqrtN; sy++) {
    for (let sx = 0; sx < sqrtN; sx++) {
      let px = (sx + 0.5) / sqrtN * W;
      let py = (sy + 0.5) / sqrtN * H;

      const startIdx = Math.floor(clamp(py, 0, H-1)) * W + Math.floor(clamp(px, 0, W-1)) % W;
      if (mode === 'currents' && cells[startIdx].isLand) continue;

      const points = [{ x: px, y: py }];
      let validSteps = 0;

      for (let s = 0; s < steps; s++) {
        const ix = ((Math.floor(px) % W) + W) % W;
        const iy = clamp(Math.floor(py), 0, H - 1);
        const ci = iy * W + ix;
        const c = cells[ci];

        let u, v;
        if (mode === 'wind') {
          u = c.windU; v = c.windV;
        } else {
          if (c.isLand) break;
          u = c.currentU; v = c.currentV;
        }

        const mag = Math.sqrt(u * u + v * v);
        if (mag < 0.01) break;

        px += (u / mag) * stepSize;
        py += (v / mag) * stepSize;
        px = ((px % W) + W) % W;
        if (py < 0 || py >= H) break;

        points.push({ x: px, y: py });
        validSteps++;
      }

      if (validSteps < 3) continue;

      targetCtx.beginPath();
      targetCtx.moveTo(points[0].x * scaleX, points[0].y * scaleY);

      for (let i = 1; i < points.length; i++) {
        const dx = points[i].x - points[i-1].x;
        if (Math.abs(dx) > W / 2) {
          targetCtx.moveTo(points[i].x * scaleX, points[i].y * scaleY);
          continue;
        }
        targetCtx.lineTo(points[i].x * scaleX, points[i].y * scaleY);
      }

      if (mode === 'wind') {
        const ci = Math.floor(clamp(points[0].y, 0, H-1)) * W + ((Math.floor(points[0].x) % W) + W) % W;
        const spd = cells[ci].windSpeed;
        const alpha = clamp(0.15 + spd * 0.5, 0.15, 0.85);
        if (spd < 0.3) {
          targetCtx.strokeStyle = `rgba(120, 140, 160, ${alpha})`;
        } else if (spd < 0.8) {
          targetCtx.strokeStyle = `rgba(160, 190, 220, ${alpha})`;
        } else {
          targetCtx.strokeStyle = `rgba(220, 235, 255, ${alpha})`;
        }
      } else {
        const ci = Math.floor(clamp(points[0].y, 0, H-1)) * W + ((Math.floor(points[0].x) % W) + W) % W;
        const sst = cells[ci].sst;
        const diff = sst - meanSST;
        const alpha = clamp(0.3 + cells[ci].currentSpeed * 3, 0.2, 0.85);
        if (diff > 0.05) {
          const t = clamp(diff * 5, 0, 1);
          targetCtx.strokeStyle = `rgba(${200 + Math.floor(t*55)}, ${140 - Math.floor(t*60)}, ${60 - Math.floor(t*40)}, ${alpha})`;
        } else if (diff < -0.05) {
          const t = clamp(-diff * 5, 0, 1);
          targetCtx.strokeStyle = `rgba(${60 - Math.floor(t*30)}, ${100 + Math.floor(t*40)}, ${180 + Math.floor(t*60)}, ${alpha})`;
        } else {
          targetCtx.strokeStyle = `rgba(150, 150, 150, ${alpha})`;
        }
      }

      targetCtx.lineWidth = 1.2;
      targetCtx.stroke();

      if (points.length >= 2) {
        const last = points[points.length - 1];
        const prev = points[points.length - 2];
        const dx = last.x - prev.x;
        const dy = last.y - prev.y;
        if (Math.abs(dx) < W / 2) {
          const angle = Math.atan2(dy, dx);
          const ax = last.x * scaleX;
          const ay = last.y * scaleY;
          const arrowLen = 3;
          targetCtx.beginPath();
          targetCtx.moveTo(ax, ay);
          targetCtx.lineTo(ax - arrowLen * Math.cos(angle - 0.4), ay - arrowLen * Math.sin(angle - 0.4));
          targetCtx.moveTo(ax, ay);
          targetCtx.lineTo(ax - arrowLen * Math.cos(angle + 0.4), ay - arrowLen * Math.sin(angle + 0.4));
          targetCtx.stroke();
        }
      }
    }
  }
}

// ── Mollweide projection ──
const mollweideCanvas = document.getElementById('mollweideCanvas');
const mollweideCtx = mollweideCanvas.getContext('2d');

function mollweideProject(cellX, cellY, canvasW, canvasH) {
  const lon = (cellX / W) * 2 * Math.PI - Math.PI;
  const lat = (cellY / H) * Math.PI - Math.PI / 2;

  let theta = lat;
  for (let i = 0; i < 8; i++) {
    const denom = 2 + 2 * Math.cos(2 * theta);
    if (Math.abs(denom) < 1e-10) break;
    theta -= (2 * theta + Math.sin(2 * theta) - Math.PI * Math.sin(lat)) / denom;
  }

  const mx = (2 * Math.SQRT2 / Math.PI) * lon * Math.cos(theta);
  const my = Math.SQRT2 * Math.sin(theta);

  const scale = 0.92;
  const px = (mx / (2 * Math.SQRT2) * scale + 0.5) * canvasW;
  const py = (0.5 - my / (2 * Math.SQRT2) * scale) * canvasH;

  return { x: px, y: py };
}

function renderMollweide() {
  if (!cells) return;
  const mw = mollweideCanvas.width, mh = mollweideCanvas.height;
  const mImageData = mollweideCtx.createImageData(mw, mh);
  const data = mImageData.data;

  for (let i = 0; i < data.length; i += 4) {
    data[i] = 5; data[i + 1] = 8; data[i + 2] = 16; data[i + 3] = 255;
  }

  // Resample the unified flat texture (drawn by render() from `planet`) through
  // the inverse Mollweide projection — one source, so it matches globe & flat.
  if (planet) {
    const flat = ctx.getImageData(0, 0, 1024, 512).data;
    const scale = 0.92;
    for (let py = 0; py < mh; py++) {
      for (let px = 0; px < mw; px++) {
        const mx = ((px / mw - 0.5) / scale) * (2 * Math.SQRT2);
        const my = ((0.5 - py / mh) / scale) * (2 * Math.SQRT2);
        const ex = mx / (2 * Math.SQRT2), ey = my / Math.SQRT2;
        if (ex * ex + ey * ey > 1.0) continue;
        const sinTheta = clamp(my / Math.SQRT2, -1, 1);
        const theta = Math.asin(sinTheta);
        const cosTheta = Math.cos(theta);
        if (Math.abs(cosTheta) < 1e-10) continue;
        const lon = (mx * Math.PI) / (2 * Math.SQRT2 * cosTheta);
        if (lon < -Math.PI || lon > Math.PI) continue;
        const sinLat = clamp((2 * theta + Math.sin(2 * theta)) / Math.PI, -1, 1);
        const lat = Math.asin(sinLat);
        const tx = Math.min(1023, Math.max(0, ((lon + Math.PI) / (2 * Math.PI)) * 1024 | 0));
        const ty = Math.min(511, Math.max(0, ((lat + Math.PI / 2) / Math.PI) * 512 | 0));
        const src = (ty * 1024 + tx) * 4;
        const off = (py * mw + px) * 4;
        data[off] = flat[src]; data[off + 1] = flat[src + 1]; data[off + 2] = flat[src + 2]; data[off + 3] = 255;
      }
    }
    mollweideCtx.putImageData(mImageData, 0, 0);
    drawSelectionMarker();
    return;
  }

  const colorFn = getColorFn(overlaySelect.value);

  for (let cy = 0; cy < H; cy++) {
    for (let cx = 0; cx < W; cx++) {
      const pos = mollweideProject(cx, cy, mw, mh);
      const cell = cells[cy * W + cx];
      const col = colorFn(cell);

      const px0 = Math.round(pos.x);
      const py0 = Math.round(pos.y);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const px = px0 + dx;
          const py = py0 + dy;
          if (px >= 0 && px < mw && py >= 0 && py < mh) {
            const off = (py * mw + px) * 4;
            data[off] = col.r;
            data[off + 1] = col.g;
            data[off + 2] = col.b;
            data[off + 3] = 255;
          }
        }
      }
    }
  }

  mollweideCtx.putImageData(mImageData, 0, 0);
  drawSelectionMarker();
}

function mollweidePixelToCell(px, py) {
  const mw = mollweideCanvas.width, mh = mollweideCanvas.height;
  const scale = 0.92;

  const mx = ((px / mw - 0.5) / scale) * (2 * Math.SQRT2);
  const my = ((0.5 - py / mh) / scale) * (2 * Math.SQRT2);

  const ex = mx / (2 * Math.SQRT2);
  const ey = my / Math.SQRT2;
  if (ex * ex + ey * ey > 1.0) return null;

  const sinTheta = clamp(my / Math.SQRT2, -1, 1);
  const theta = Math.asin(sinTheta);
  const cosTheta = Math.cos(theta);

  if (Math.abs(cosTheta) < 1e-10) {
    const lat = sinTheta > 0 ? Math.PI / 2 : -Math.PI / 2;
    const cellX = Math.floor(W / 2);
    const cellY = Math.floor(Math.max(0, Math.min(H - 1, (lat + Math.PI / 2) / Math.PI * H)));
    return { x: cellX, y: cellY };
  }

  const lon = (mx * Math.PI) / (2 * Math.SQRT2 * cosTheta);
  if (lon < -Math.PI || lon > Math.PI) return null;

  const sinLat = clamp((2 * theta + Math.sin(2 * theta)) / Math.PI, -1, 1);
  const lat = Math.asin(sinLat);

  const cellX = Math.floor(((lon + Math.PI) / (2 * Math.PI)) * W) % W;
  const cellY = Math.floor(Math.max(0, Math.min(H - 1, ((lat + Math.PI / 2) / Math.PI) * H)));

  return { x: cellX, y: cellY };
}

mollweideCanvas.addEventListener('click', (e) => {
  const rect = mollweideCanvas.getBoundingClientRect();
  const scaleX = mollweideCanvas.width / rect.width;
  const scaleY = mollweideCanvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  const cell = mollweidePixelToCell(px, py);
  if (cell) {
    showCellInfo(cell.x, cell.y, e);
    showRegionalView(cell.x, cell.y);
  }
});

// ── Tooltip ──

function hideTooltip() {
  tooltipVisible = false;

}

document.addEventListener('mousedown', (e) => {
  if (!tooltipVisible) return;

});

function showCellInfo(x, y, mouseEvent) {
  if (!cells) return;
  const c = cells[y * W + x];
  if (mouseEvent) {
    showTooltip(c, mouseEvent.clientX, mouseEvent.clientY);
  }
}

function showRegionalCellTooltip(rx, ry, mouseEvent) {
  if (!regionalCells || !regionalCells[rx] || !regionalCells[rx][ry]) return;
  const c = regionalCells[rx][ry];
  if (mouseEvent) {
    showTooltip(c, mouseEvent.clientX, mouseEvent.clientY);
  }
}

// ── Globe renderer ──
const globeCanvas = document.getElementById('globeCanvas');
const globeCtx = globeCanvas.getContext('2d');
let currentView = 'flat';

const HOME_ROT_X = 0.15;
const HOME_ROT_Y = 0;
let rotX = HOME_ROT_X;
let rotY = HOME_ROT_Y;
let isDragging = false;
let lastMX = 0, lastMY = 0;
let dragMoved = false;

let autoSpin = true;
let lastFrameTime = 0;
let resumeDelay = false;

const spinSlider = document.getElementById('spinSpeedSlider');
const pauseBtn = document.getElementById('pauseSpinBtn');
const speedControl = document.getElementById('speedControl');

function getSpinSpeed() {
  return (spinSlider.value / 100) * 0.012;
}

let currentSpinSpeed = getSpinSpeed();

spinSlider.addEventListener('input', () => {
  currentSpinSpeed = getSpinSpeed();
});

pauseBtn.addEventListener('click', () => {
  autoSpin = !autoSpin;
  pauseBtn.textContent = autoSpin ? '⏸' : '▶';
});

function renderGlobe() {
  if (!cells) return;

  const flatCtx = ctx;
  const flatData = flatCtx.getImageData(0, 0, 1024, 512).data;

  const gw = globeCanvas.width, gh = globeCanvas.height;
  const globeImageData = globeCtx.createImageData(gw, gh);
  const data = globeImageData.data;

  const cx = gw / 2, cy = gh / 2;
  const radius = Math.min(cx, cy) * 0.9;

  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  for (let py = 0; py < gh; py++) {
    for (let px = 0; px < gw; px++) {
      const pixIdx = (py * gw + px) * 4;

      const sx = (px - cx) / radius;
      const sy = (py - cy) / radius;
      const r2 = sx * sx + sy * sy;

      if (r2 > 1.0) {
        data[pixIdx]     = 5;
        data[pixIdx + 1] = 8;
        data[pixIdx + 2] = 15;
        data[pixIdx + 3] = 255;
        continue;
      }

      const sz = Math.sqrt(1 - r2);

      let x3d = sx * cosY + sz * sinY;
      let z3d = -sx * sinY + sz * cosY;

      let y3d = sy * cosX - z3d * sinX;
      let z3d2 = sy * sinX + z3d * cosX;

      const lat = Math.asin(Math.max(-1, Math.min(1, -y3d)));
      const lon = Math.atan2(x3d, z3d2);

      const texX = ((lon / Math.PI + 1) / 2 * 1024) % 1024;
      const texY = ((-lat / (Math.PI / 2) + 1) / 2 * 512);

      const ti = Math.floor(Math.max(0, Math.min(1023, texX)));
      const tj = Math.floor(Math.max(0, Math.min(511, texY)));
      const texIdx = (tj * 1024 + ti) * 4;

      const ci = Math.floor(ti / 2);
      const cj = Math.floor(tj / 2);
      const elev = cells[cj * W + ci].elevation;

      const ciR = (ci + 1) % W;
      const cjU = Math.max(0, cj - 1);
      const elevRight = cells[cj * W + ciR].elevation;
      const elevUp    = cells[cjU * W + ci].elevation;
      const reliefScale = 8.0;
      const dEdx = (elevRight - elev) * reliefScale;
      const dEdy = (elevUp - elev) * reliefScale;
      const reliefShade = 1.0 + dEdx * 0.5 + dEdy * (-0.5);

      const shade = Math.max(0.08, Math.min(1.2, (0.3 + 0.7 * sz) * reliefShade));

      data[pixIdx]     = Math.floor(flatData[texIdx] * shade);
      data[pixIdx + 1] = Math.floor(flatData[texIdx + 1] * shade);
      data[pixIdx + 2] = Math.floor(flatData[texIdx + 2] * shade);
      data[pixIdx + 3] = 255;
    }
  }

  globeCtx.putImageData(globeImageData, 0, 0);
  drawOrientationHUD(globeCtx, gw);
  drawSelectionMarker();
}

function drawOrientationHUD(ctx, canvasW) {
  const size = 60;
  const cx = canvasW - size / 2 - 12;
  const cy = size / 2 + 12;
  const radius = 22;

  ctx.beginPath();
  ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(150, 160, 180, 0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const northX = cx;
  const northY = cy - Math.cos(rotX) * radius * 0.8;

  ctx.beginPath();
  ctx.arc(northX, northY, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#8ab4f8';
  ctx.fill();

  ctx.fillStyle = '#8ab4f8';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('N', northX, northY - 6);

  const southX = cx;
  const southY = cy + Math.cos(rotX) * radius * 0.8;

  ctx.beginPath();
  ctx.arc(southX, southY, 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(180, 130, 100, 0.6)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.fill();

  if (Math.abs(rotX - HOME_ROT_X) > 0.05) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.4, -Math.PI/2, -Math.PI/2 + rotX * 2, rotX < 0);
    ctx.strokeStyle = 'rgba(150, 180, 220, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function globePixelToCell(px, py) {
  const gw = globeCanvas.width, gh = globeCanvas.height;
  const cx = gw / 2, cy = gh / 2;
  const radius = Math.min(cx, cy) * 0.9;

  const sx = (px - cx) / radius;
  const sy = (py - cy) / radius;
  const r2 = sx * sx + sy * sy;
  if (r2 > 1.0) return null;

  const sz = Math.sqrt(1 - r2);

  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  let x3d = sx * cosY + sz * sinY;
  let z3d = -sx * sinY + sz * cosY;
  let y3d = sy * cosX - z3d * sinX;
  let z3d2 = sy * sinX + z3d * cosX;

  const lat = Math.asin(Math.max(-1, Math.min(1, -y3d)));
  const lon = Math.atan2(x3d, z3d2);

  const cellX = Math.floor(((lon / Math.PI + 1) / 2 * W) % W);
  const cellY = Math.floor(Math.max(0, Math.min(H - 1, (-lat / (Math.PI / 2) + 1) / 2 * H)));

  return { x: cellX, y: cellY };
}

globeCanvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragMoved = false;
  lastMX = e.clientX;
  lastMY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  rotY += dx * 0.01;
  rotX += dy * 0.01;
  rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));
  lastMX = e.clientX;
  lastMY = e.clientY;
  renderGlobe();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  if (autoSpin) {
    resumeDelay = true;
    setTimeout(() => { resumeDelay = false; }, 500);
  }
});

globeCanvas.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  isDragging = true;
  dragMoved = false;
  lastMX = e.touches[0].clientX;
  lastMY = e.touches[0].clientY;
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastMX;
  const dy = e.touches[0].clientY - lastMY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  rotY += dx * 0.01;
  rotX += dy * 0.01;
  rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));
  lastMX = e.touches[0].clientX;
  lastMY = e.touches[0].clientY;
  renderGlobe();
}, { passive: false });

window.addEventListener('touchend', () => {
  isDragging = false;
  if (autoSpin) {
    resumeDelay = true;
    setTimeout(() => { resumeDelay = false; }, 500);
  }
});

globeCanvas.addEventListener('click', (e) => {
  if (dragMoved) return;
  const rect = globeCanvas.getBoundingClientRect();
  const scaleX = globeCanvas.width / rect.width;
  const scaleY = globeCanvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  const cell = globePixelToCell(px, py);
  if (cell) {
    showCellInfo(cell.x, cell.y, e);
    showRegionalView(cell.x, cell.y);
  }
});

// ── Key state tracking ──
const keysHeld = new Set();

document.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    // Shift + arrows → pan the tile (chunk) map by one regional cell
    if (e.shiftKey && currentTileData && regionalCells) {
      e.preventDefault();
      let trx = currentTileData.rx, tryy = currentTileData.ry;
      if (e.key === 'ArrowRight') trx += 1;
      if (e.key === 'ArrowLeft')  trx -= 1;
      if (e.key === 'ArrowDown')  tryy += 1;
      if (e.key === 'ArrowUp')    tryy -= 1;
      trx  = Math.max(0, Math.min(REGIONAL_SIZE - 1, trx));
      tryy = Math.max(0, Math.min(REGIONAL_SIZE - 1, tryy));
      if (trx !== currentTileData.rx || tryy !== currentTileData.ry) {
        const cacheKey = `${trx},${tryy}`;
        const cached = tileChunkCache.get(cacheKey);
        if (cached) {
          currentTileData = cached;
          renderTileDetail(document.getElementById('tileOverlaySelect').value);
          const rc = regionalCells[trx][tryy];
          document.getElementById('tileDetailTitle').textContent =
            `TILES: (${trx}, ${tryy}) — ${rc.zone} ${rc.terrainType || ''}`;
          statusText.textContent = 'Tile loaded from cache';
        } else {
          const tt0 = performance.now();
          generateTileDetail(trx, tryy);
          const tt1 = performance.now();
          const rc = regionalCells[trx][tryy];
          document.getElementById('tileDetailTitle').textContent =
            `TILES: (${trx}, ${tryy}) — ${rc.zone} ${rc.terrainType || ''}`;
          statusText.textContent = `Tile panned in ${(tt1 - tt0).toFixed(0)} ms`;
        }
        // Redraw the regional map to update the position marker
        renderRegionalMap(regionalOverlaySelect.value);
      }
      return;
    }

    // Arrows → pan the regional map
    if (activeControl === 'regional' && selectedRegion) {
      e.preventDefault();
      // Close tile view and clear chunk cache — old positions are meaningless
      hideTileView();
      tileChunkCache.clear();
      // Shift by exactly one regional-map width so consecutive views are
      // perfectly adjacent: no skipped tiles, no repeated tiles.
      const panStep = REGIONAL_SIZE / CELLS_PER_PLANETARY;
      if (e.key === 'ArrowRight') selectedRegion.cx += panStep;
      if (e.key === 'ArrowLeft')  selectedRegion.cx -= panStep;
      if (e.key === 'ArrowDown')  selectedRegion.cy += panStep;
      if (e.key === 'ArrowUp')    selectedRegion.cy -= panStep;
      selectedRegion.cx = ((selectedRegion.cx % W) + W) % W;
      selectedRegion.cy = Math.max(0, Math.min(H - 1, selectedRegion.cy));

      const band = getLatitudeBand(Math.round(selectedRegion.cy));
      const plateCell = getPlanetaryCell(Math.round(selectedRegion.cx), Math.round(selectedRegion.cy));
      regionLabel.textContent = `REGION: (${Math.round(selectedRegion.cx)}, ${Math.round(selectedRegion.cy)}) — ${band}, ${plateCell.plateType}`;

      const t0 = performance.now();
      generateRegionalDetail(selectedRegion.cx, selectedRegion.cy);
      const t1 = performance.now();
      renderRegionalMap(regionalOverlaySelect.value);
      statusText.textContent = `Regional panned in ${(t1 - t0).toFixed(0)} ms`;

      render(overlaySelect.value);
      if (currentView === 'globe') renderGlobe();
      if (currentView === 'mollweide') renderMollweide();
      return;
    }

    if (currentView === 'globe') {
      e.preventDefault();
      keysHeld.add(e.key);
      autoSpin = false;
      pauseBtn.textContent = '▶';
    }
  }

  if (e.key === 'Shift') {
    keysHeld.add('Shift');
  }

  if (e.key === 'Escape' && selectedRegion) {
    closeRegionalView();
  }
});

document.addEventListener('keyup', e => {
  keysHeld.delete(e.key);
  if (e.key === 'Shift') keysHeld.delete('Shift');
});

window.addEventListener('blur', () => keysHeld.clear());

function processHeldKeys() {
  if (keysHeld.size === 0) return false;

  const speed = keysHeld.has('Shift') ? 0.04 : 0.01;
  let moved = false;

  if (keysHeld.has('ArrowLeft')) {
    rotY -= speed;
    moved = true;
  }
  if (keysHeld.has('ArrowRight')) {
    rotY += speed;
    moved = true;
  }
  if (keysHeld.has('ArrowUp')) {
    rotX = Math.max(-Math.PI / 2, rotX - speed);
    moved = true;
  }
  if (keysHeld.has('ArrowDown')) {
    rotX = Math.min(Math.PI / 2, rotX + speed);
    moved = true;
  }

  return moved;
}

// ── Spin animation loop ──
function spinLoop(timestamp) {
  if (currentView === 'globe' && cells) {
    let needsRender = false;

    if (processHeldKeys()) {
      needsRender = true;
    }

    if (autoSpin && !isDragging && !resumeDelay && keysHeld.size === 0) {
      rotY += currentSpinSpeed;
      needsRender = true;
    }

    if (needsRender && timestamp - lastFrameTime > 33) {
      renderGlobe();
      lastFrameTime = timestamp;
    }
  }

  requestAnimationFrame(spinLoop);
}
requestAnimationFrame(spinLoop);

// ── Home orientation ──
function returnHome() {
  const startX = rotX, startY = rotY;
  const targetX = HOME_ROT_X;
  let deltaY = HOME_ROT_Y - rotY;
  while (deltaY > Math.PI) deltaY -= Math.PI * 2;
  while (deltaY < -Math.PI) deltaY += Math.PI * 2;
  const targetY = rotY + deltaY;

  let frame = 0;
  const totalFrames = 30;

  function animateHome() {
    frame++;
    const t = frame / totalFrames;
    const ease = t * t * (3 - 2 * t);

    rotX = startX + (targetX - startX) * ease;
    rotY = startY + (targetY - startY) * ease;
    renderGlobe();

    if (frame < totalFrames) {
      requestAnimationFrame(animateHome);
    } else {
      rotX = HOME_ROT_X;
      rotY = HOME_ROT_Y;
      autoSpin = true;
      pauseBtn.textContent = '⏸';
    }
  }

  animateHome();
}

document.getElementById('homeBtn').addEventListener('click', returnHome);

// ══════════════════════════════════════════════════════════════════
// ── Regional Detail System ──
// ══════════════════════════════════════════════════════════════════

const REGIONAL_SIZE = 512;          // regional grid is 512×512 cells
const PLANETARY_CELL_KM = 78.0;     // each planetary cell ≈ 78 km across
const REGIONAL_CELL_KM = PLANETARY_CELL_KM / REGIONAL_SIZE; // ≈ 0.15 km/cell
const CELLS_PER_PLANETARY = REGIONAL_SIZE; // regional cells spanning one planetary cell edge

const regionalCanvas = document.getElementById('regionalCanvas');
const regionalCtx = regionalCanvas.getContext('2d');

let selectedRegion = null;     // { cx, cy } in planetary (fractional) coords
let regionalCells = null;      // regionalCells[rx][ry]
let activeControl = 'planetary';

// ── Sample a planetary cell with wrapping / clamping ──
function getPlanetaryCell(x, y) {
  const wx = ((Math.round(x) % W) + W) % W;
  const wy = clamp(Math.round(y), 0, H - 1);
  return cells[wy * W + wx];
}

// ── Deterministic per-region RNG ──
function seededRNG(a, b, c) {
  let s = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Bilinear interpolation of a planetary field over fractional coords ──
function bilinearInterpolate(x, y, accessor) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const v00 = accessor(getPlanetaryCell(x0, y0));
  const v10 = accessor(getPlanetaryCell(x0 + 1, y0));
  const v01 = accessor(getPlanetaryCell(x0, y0 + 1));
  const v11 = accessor(getPlanetaryCell(x0 + 1, y0 + 1));
  const vx0 = v00 + (v10 - v00) * fx;
  const vx1 = v01 + (v11 - v01) * fx;
  return vx0 + (vx1 - vx0) * fy;
}

// ── Planet-wide max land elevation (cached per generation) ──
let _planetMaxLandElev = null;
function getPlanetMaxLandElev() {
  if (_planetMaxLandElev !== null) return _planetMaxLandElev;
  let m = 0.01;
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].isLand && cells[i].elevation > m) m = cells[i].elevation;
  }
  _planetMaxLandElev = m;
  return m;
}

// ── Regional base elevation for one regional cell ──
// worldX, worldY are in regional-cell units across the whole planet
function computeRegionalBaseCell(worldX, worldY, seed) {
  // Fractional planetary coordinate
  const px = worldX / CELLS_PER_PLANETARY;
  const py = worldY / CELLS_PER_PLANETARY;

  // Smooth base elevation from planetary field
  const baseElev = bilinearInterpolate(px, py, c => c.elevation);

  // Multi-octave detail noise in world space (seamless across regions)
  let detail = 0, amp = 1, freq = 0.015, totalAmp = 0;
  for (let o = 0; o < 5; o++) {
    detail += amp * noise2D(worldX * freq, worldY * freq, seed + o * 1013);
    totalAmp += amp;
    amp *= 0.5;
    freq *= 2;
  }
  detail /= totalAmp;

  const maxLand = getPlanetMaxLandElev();
  const elevNorm = clamp(baseElev / maxLand, -1, 1);

  // Detail amplitude scales with terrain type
  let detailAmp;
  if (baseElev <= 0) {
    detailAmp = params.coastAmplitude * 0.4;
  } else {
    detailAmp = params.coastAmplitude + params.mountainDetail * elevNorm;
  }

  return baseElev + detail * detailAmp;
}

// ── Zone classification from elevation + slope ──
function classifyZone(elevation, slopeMag, maxLandElev) {
  if (elevation <= 0) {
    return elevation > -0.02 ? 'tidal' : 'coastal';
  }
  const en = elevation / maxLandElev;
  if (en < 0.06) return 'lowland';
  if (en < 0.35) return 'mid_slope';
  if (en < 0.65) return 'upper_slope';
  return 'summit';
}

// ── Regional detail generation ──
// Dispatcher: when a high-res planetary grid exists, the regional view reads
// its BASE physical state from it (so the regional view matches the planetary
// map) and only adds finer drainage/coastline detail on top. When there is no
// high-res grid (resolution multiplier = 1), fall back to computing the
// regional state independently from the low-res planetary grid.
function generateRegionalDetail(centerX, centerY) {
  if (hiResData) {
    generateRegionalDetailHiRes(centerX, centerY);
  } else {
    generateRegionalDetailLowRes(centerX, centerY);
  }
}

// ── Regional detail generation (LOW-RES fallback path — original behavior) ──
function generateRegionalDetailLowRes(centerX, centerY) {
  _planetMaxLandElev = null; // recompute per generation
  const maxLand = getPlanetMaxLandElev();

  const seed = parseInt(document.getElementById('seedInput').value, 10) || 0;
  // Detail noise must be a pure function of world coordinates (NOT the region
  // center), otherwise adjacent panned views sample different noise fields and
  // their seams don't line up. Seed from the global planetary seed only.
  const regionSeed = (seed ^ 0x51ED270B) | 0;

  // World-space origin (top-left) in regional-cell units
  const originWorldX = centerX * CELLS_PER_PLANETARY - REGIONAL_SIZE / 2;
  const originWorldY = centerY * CELLS_PER_PLANETARY - REGIONAL_SIZE / 2;

  // Allocate regionalCells[rx][ry]
  regionalCells = new Array(REGIONAL_SIZE);
  for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
    regionalCells[rx] = new Array(REGIONAL_SIZE);
  }

  // Pass 1a: base elevation (no noise yet) + planetary field sampling
  // Use a padded grid (MARGIN cells on each side) so the local slope and
  // convergence perturbation stabilize before reaching the interior 512×512 region.
  const S_LR = REGIONAL_SIZE;
  const NN_LR = S_LR * S_LR;
  const MARGIN_LR = 64;
  const S_PAD_LR = S_LR + 2 * MARGIN_LR;  // 640
  const NN_PAD_LR = S_PAD_LR * S_PAD_LR;
  const baseElevGridLR = new Float32Array(NN_LR);
  const elevGrid = new Float32Array(NN_LR);

  // Padded base elevation grid for drainage direction + convergence perturbation
  const baseElevPadLR = new Float32Array(NN_PAD_LR);

  for (let ry = -MARGIN_LR; ry < S_LR + MARGIN_LR; ry++) {
    for (let rx = -MARGIN_LR; rx < S_LR + MARGIN_LR; rx++) {
      const worldX = originWorldX + rx;
      const worldY = originWorldY + ry;
      const px = worldX / CELLS_PER_PLANETARY;
      const py = worldY / CELLS_PER_PLANETARY;
      const padIdx = (ry + MARGIN_LR) * S_PAD_LR + (rx + MARGIN_LR);
      baseElevPadLR[padIdx] = bilinearInterpolate(px, py, c => c.elevation);
      if (rx >= 0 && rx < S_LR && ry >= 0 && ry < S_LR) {
        baseElevGridLR[ry * S_LR + rx] = baseElevPadLR[padIdx];
      }
    }
  }

  // Pass 1b: drainage direction from planetary elevation gradient (globally deterministic).
  // Instead of BFS (which is window-dependent), sample the GLOBAL planetary elevation
  // via bilinearInterpolate at a wide window around each cell to determine downhill
  // direction. This gives the same direction regardless of which regional view the
  // cell appears in.
  const drainDirXPadLR = new Float32Array(NN_PAD_LR);
  const drainDirYPadLR = new Float32Array(NN_PAD_LR);

  const GRAD_RADIUS_PLANETARY_LR = 1.5;  // radius in planetary cells (~117 km, same physical scale as HiRes)
  const GRAD_STEPS_LR = 8;
  const gradDxLR = [0, 1, 1, 1, 0, -1, -1, -1];
  const gradDyLR = [-1, -1, 0, 1, 1, 1, 0, -1];

  const slopeMagPadLR = new Float32Array(NN_PAD_LR);

  for (let ry = 0; ry < S_PAD_LR; ry++) {
    for (let rx = 0; rx < S_PAD_LR; rx++) {
      const idx = ry * S_PAD_LR + rx;
      if (baseElevPadLR[idx] <= 0) {
        drainDirXPadLR[idx] = 0; drainDirYPadLR[idx] = 1; continue;
      }

      // Compute planetary coordinates for this padded cell
      const worldX = originWorldX + (rx - MARGIN_LR);
      const worldY = originWorldY + (ry - MARGIN_LR);
      const px = worldX / CELLS_PER_PLANETARY;
      const py = worldY / CELLS_PER_PLANETARY;
      const centerElev = baseElevPadLR[idx];

      // Wide-window gradient from global planetary elevation
      let gx = 0, gy = 0;
      for (let d = 0; d < GRAD_STEPS_LR; d++) {
        const samplePx = px + gradDxLR[d] * GRAD_RADIUS_PLANETARY_LR;
        const samplePy = py + gradDyLR[d] * GRAD_RADIUS_PLANETARY_LR;
        const sampleElev = bilinearInterpolate(samplePx, samplePy, c => c.elevation);
        const diff = centerElev - sampleElev;  // positive = downhill in that direction
        gx += gradDxLR[d] * diff;
        gy += gradDyLR[d] * diff;
      }
      const gLen = Math.sqrt(gx * gx + gy * gy) || 1;
      drainDirXPadLR[idx] = gx / gLen;
      drainDirYPadLR[idx] = gy / gLen;

      // Local 7×7 slope on the padded base elevation grid
      let localGx = 0, localGy = 0, localWt = 0;
      for (let ddy = -3; ddy <= 3; ddy++) {
        for (let ddx = -3; ddx <= 3; ddx++) {
          if (ddx === 0 && ddy === 0) continue;
          const nrx = rx + ddx, nry = ry + ddy;
          if (nrx < 0 || nrx >= S_PAD_LR || nry < 0 || nry >= S_PAD_LR) continue;
          const w = 1.0 / Math.sqrt(ddx * ddx + ddy * ddy);
          const diff = baseElevPadLR[idx] - baseElevPadLR[nry * S_PAD_LR + nrx];
          localGx += ddx * diff * w;
          localGy += ddy * diff * w;
          localWt += w;
        }
      }
      if (localWt > 0) { localGx /= localWt; localGy /= localWt; }
      const localSlopeMag = Math.sqrt(localGx * localGx + localGy * localGy);
      slopeMagPadLR[idx] = localSlopeMag;

      // Blend: steep terrain uses local slope, flat terrain uses wide gradient
      const FLAT_THRESH  = 0.0015;
      const STEEP_THRESH = 0.005;
      const t = clamp((localSlopeMag - FLAT_THRESH) / (STEEP_THRESH - FLAT_THRESH), 0, 1);

      if (t > 0.01 && localSlopeMag > 0.0001) {
        const nlx = localGx / localSlopeMag;
        const nly = localGy / localSlopeMag;

        let bx = drainDirXPadLR[idx] * (1 - t) + nlx * t;
        let by = drainDirYPadLR[idx] * (1 - t) + nly * t;
        const bLen = Math.sqrt(bx * bx + by * by) || 1;
        drainDirXPadLR[idx] = bx / bLen;
        drainDirYPadLR[idx] = by / bLen;
      }
    }
  }

  // ── Convergence perturbation (Bug 3 fix) ──
  const convergeSeed1LR = regionSeed + 5555;
  const convergeFreqLR = 0.007;
  const convergeMaxAngleLR = 0.35;

  for (let ry = 0; ry < S_PAD_LR; ry++) {
    for (let rx = 0; rx < S_PAD_LR; rx++) {
      const idx = ry * S_PAD_LR + rx;
      if (baseElevPadLR[idx] <= 0) continue;

      const worldX = originWorldX + (rx - MARGIN_LR);
      const worldY = originWorldY + (ry - MARGIN_LR);

      const flatness = clamp(1.0 - slopeMagPadLR[idx] / 0.005, 0, 1);
      if (flatness < 0.05) continue;

      const angle = noise2D(worldX * convergeFreqLR, worldY * convergeFreqLR, convergeSeed1LR)
                  * convergeMaxAngleLR * flatness;

      const dx = drainDirXPadLR[idx];
      const dy = drainDirYPadLR[idx];
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      drainDirXPadLR[idx] = dx * cos - dy * sin;
      drainDirYPadLR[idx] = dx * sin + dy * cos;
    }
  }

  // Extract interior 512×512 drainage direction from the padded grid
  const drainDirXLR = new Float32Array(NN_LR);
  const drainDirYLR = new Float32Array(NN_LR);
  for (let ry = 0; ry < S_LR; ry++) {
    for (let rx = 0; rx < S_LR; rx++) {
      const srcIdx = (ry + MARGIN_LR) * S_PAD_LR + (rx + MARGIN_LR);
      const dstIdx = ry * S_LR + rx;
      drainDirXLR[dstIdx] = drainDirXPadLR[srcIdx];
      drainDirYLR[dstIdx] = drainDirYPadLR[srcIdx];
    }
  }

  // Pass 1c: apply isotropic + anisotropic noise, build cell objects
  for (let ry = 0; ry < S_LR; ry++) {
    for (let rx = 0; rx < S_LR; rx++) {
      const idx = ry * S_LR + rx;
      const worldX = originWorldX + rx;
      const worldY = originWorldY + ry;
      const px = worldX / CELLS_PER_PLANETARY;
      const py = worldY / CELLS_PER_PLANETARY;
      const baseElev = baseElevGridLR[idx];

      // Isotropic detail noise (same as computeRegionalBaseCell)
      let detail = 0, amp = 1, freq = 0.015, totalAmp = 0;
      for (let o = 0; o < 5; o++) {
        detail += amp * noise2D(worldX * freq, worldY * freq, regionSeed + o * 1013);
        totalAmp += amp;
        amp *= 0.5;
        freq *= 2;
      }
      detail /= totalAmp;

      const elevNorm = clamp(baseElev / maxLand, -1, 1);
      let detailAmp;
      if (baseElev <= 0) {
        detailAmp = params.coastAmplitude * 0.4;
      } else {
        detailAmp = params.coastAmplitude + params.mountainDetail * elevNorm;
      }

      // Anisotropic channel noise
      let channelOffset = 0;
      if (baseElev > 0) {
        const fdx = drainDirXLR[idx];
        const fdy = drainDirYLR[idx];
        const alongDrain  =  worldX * fdx + worldY * fdy;
        const acrossDrainCorr = worldX * (-fdy) + worldY * fdx;
        const alongFreq  = 0.004;
        const acrossFreq = 0.07;
        let channelNoise = 0, cAmp = 1, cTotalAmp = 0;
        for (let o = 0; o < 3; o++) {
          const f = (o === 0) ? 1.0 : (o === 1) ? 2.0 : 4.0;
          channelNoise += cAmp * noise2D(
            alongDrain * alongFreq * f,
            acrossDrainCorr * acrossFreq * f,
            regionSeed + 7000 + o * 337
          );
          cTotalAmp += cAmp;
          cAmp *= 0.45;
        }
        channelNoise /= cTotalAmp;

        const slopeMagLocal = Math.sqrt(
          (rx > 0 && rx < S_LR - 1 ? (baseElevGridLR[idx + 1] - baseElevGridLR[idx - 1]) / 2 : 0) ** 2 +
          (ry > 0 && ry < S_LR - 1 ? (baseElevGridLR[idx + S_LR] - baseElevGridLR[idx - S_LR]) / 2 : 0) ** 2
        );
        const zoneLocal = classifyZone(baseElev, slopeMagLocal, maxLand);
        let channelAmp;
        switch (zoneLocal) {
          case 'lowland':     channelAmp = 0.018; break;
          case 'coastal':     channelAmp = 0.010; break;
          case 'tidal':       channelAmp = 0.006; break;
          case 'mid_slope':   channelAmp = 0.006; break;
          case 'upper_slope': channelAmp = 0.003; break;
          case 'summit':      channelAmp = 0.001; break;
          default:            channelAmp = 0.008; break;
        }
        channelOffset = channelNoise * channelAmp;
        // Reduce isotropic noise on flat terrain so anisotropic channels dominate
        if (zoneLocal === 'lowland')          detailAmp *= 0.4;
        else if (zoneLocal === 'coastal')     detailAmp *= 0.5;
        else if (zoneLocal === 'tidal')       detailAmp *= 0.5;
        else if (zoneLocal === 'mid_slope')   detailAmp *= 0.7;
        // upper_slope and summit keep full amplitude
      }

      const elev = baseElev + detail * detailAmp + channelOffset;
      elevGrid[idx] = elev;

      const cell = {
        rx, ry,
        worldX, worldY,
        baseElevation: elev,
        elevation: elev,
        isLand: elev > 0,
        // planetary-sampled fields
        precipitation: bilinearInterpolate(px, py, c => c.precipitation),
        groundwater: bilinearInterpolate(px, py, c => c.groundwater),
        waterAvailability: bilinearInterpolate(px, py, c => c.waterAvailability),
        atmosphericMoisture: bilinearInterpolate(px, py, c => c.atmosphericMoisture),
        temperature: bilinearInterpolate(px, py, c => c.temperature),
        drainage: bilinearInterpolate(px, py, c => c.drainage),
        windSpeed: bilinearInterpolate(px, py, c => c.windSpeed),
        sst: bilinearInterpolate(px, py, c => c.sst),
        minerals: {
          iron: bilinearInterpolate(px, py, c => c.minerals.iron),
          copper: bilinearInterpolate(px, py, c => c.minerals.copper),
          manganese: bilinearInterpolate(px, py, c => c.minerals.manganese),
        },
        grainSize: 0.3,
        baseGrainSize: 0.3,
        windU: bilinearInterpolate(px, py, c => c.windU),
        windV: bilinearInterpolate(px, py, c => c.windV),
        currentSpeed: 0,
        currentU: 0,
        currentV: 0,
      };
      cell.mineralTotal = cell.minerals.iron + cell.minerals.copper + cell.minerals.manganese;
      cell.dominant = maxKey(cell.minerals);
      cell.isShallowWater = elev > -0.08 && elev <= 0;
      cell.isDeepWater = elev <= -0.08;
      cell.isFreezing = cell.temperature < 0.5;
      regionalCells[rx][ry] = cell;
    }
  }

  // Pass 2: slopes + zone classification
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const cell = regionalCells[rx][ry];
      const xm = Math.max(0, rx - 1), xp = Math.min(REGIONAL_SIZE - 1, rx + 1);
      const ym = Math.max(0, ry - 1), yp = Math.min(REGIONAL_SIZE - 1, ry + 1);
      const gx = (elevGrid[ry * REGIONAL_SIZE + xp] - elevGrid[ry * REGIONAL_SIZE + xm]) / 2;
      const gy = (elevGrid[yp * REGIONAL_SIZE + rx] - elevGrid[ym * REGIONAL_SIZE + rx]) / 2;
      cell.slopeMag = Math.sqrt(gx * gx + gy * gy);
      cell.slopeDir = Math.atan2(gy, gx);
      cell.zone = classifyZone(cell.baseElevation, cell.slopeMag, maxLand);
    }
  }

  // Pass 3: drainage (flow accumulation over regional grid)
  computeRegionalDrainage(elevGrid);

  // ── Pass 3b: inherit planetary stream order as floor (LowRes path) ──
  if (planet && planet.streamOrder) {
    const MIN_DENSITY = [0, 0.30, 0.55, 0.80];

    for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
      for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
        const cell = regionalCells[rx][ry];
        if (!cell.isLand) continue;

        const px = cell.worldX / CELLS_PER_PLANETARY;
        const py = cell.worldY / CELLS_PER_PLANETARY;
        // Nearest-neighbor from the planetary grid
        const gi = (Math.round(py) % H) * W + ((Math.round(px) % W) + W) % W;
        const hrSO = planet.streamOrder[gi] || 0;

        if (hrSO > cell.streamOrder) {
          cell.streamOrder = hrSO;
        }
        const minDensity = MIN_DENSITY[Math.min(cell.streamOrder, 3)];
        if (cell.drainageDensity < minDensity) {
          cell.drainageDensity = minDensity;
        }
      }
    }
  }

  // Pass 4: substrate, saturation, standing water
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const cell = regionalCells[rx][ry];
      computeRegionalSubstrate(cell, regionSeed);
    }
  }
  computeStandingWater(elevGrid);

  // Pass 5: flora + terrain type
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const cell = regionalCells[rx][ry];
      computeRegionalFloraCell(cell);
      deriveRegionalTerrainType(cell);
    }
  }

  printRegionalDiagnostic();
}

// ── Bilinear sample of a high-res typed array at fractional (fx, fy) ──
//    fx wraps in longitude (0..HR_W), fy clamps in latitude (0..HR_H-1).
function bilinearSampleHR(array, fx, fy) {
  const x0 = Math.floor(fx);
  const y0 = Math.floor(fy);
  const dx = fx - x0;
  const dy = fy - y0;

  const cx0 = ((x0 % HR_W) + HR_W) % HR_W;
  const cx1 = ((x0 + 1) % HR_W + HR_W) % HR_W;
  const cy0 = Math.max(0, Math.min(HR_H - 1, y0));
  const cy1 = Math.max(0, Math.min(HR_H - 1, y0 + 1));

  const v00 = array[cy0 * HR_W + cx0];
  const v10 = array[cy0 * HR_W + cx1];
  const v01 = array[cy1 * HR_W + cx0];
  const v11 = array[cy1 * HR_W + cx1];

  const vx0 = v00 + (v10 - v00) * dx;
  const vx1 = v01 + (v11 - v01) * dx;
  return vx0 + (vx1 - vx0) * dy;
}

// ── Nearest-neighbor sample of a high-res typed array (for enum/int fields) ──
function nearestSampleHR(array, fx, fy) {
  const nx = ((Math.round(fx) % HR_W) + HR_W) % HR_W;
  const ny = Math.max(0, Math.min(HR_H - 1, Math.round(fy)));
  return array[ny * HR_W + nx];
}

// ── Regional detail generation (HIGH-RES path) ──
//    Reads the BASE physical state from the already-computed high-res grid,
//    then refines it with regional-scale coastline noise and higher-resolution
//    drainage. Ridge cells (streamOrder 0) inherit the high-res values
//    unchanged, so they render identically to the planetary map; channel cells
//    are pushed wetter / finer, adding detail the high-res grid can't resolve.
function generateRegionalDetailHiRes(centerX, centerY) {
  _planetMaxLandElev = null; // recompute per generation
  const maxLand = getPlanetMaxLandElev();

  const seed = parseInt(document.getElementById('seedInput').value, 10) || 0;
  const regionSeed = (seed ^ 0x51ED270B) | 0;

  // World-space origin (top-left) in regional-cell units
  const originWorldX = centerX * CELLS_PER_PLANETARY - REGIONAL_SIZE / 2;
  const originWorldY = centerY * CELLS_PER_PLANETARY - REGIONAL_SIZE / 2;

  regionalCells = new Array(REGIONAL_SIZE);
  for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
    regionalCells[rx] = new Array(REGIONAL_SIZE);
  }

  // Pass 1a: read BASE elevation from hi-res grid (no noise yet).
  // Use a padded grid (MARGIN cells on each side) so the local slope and
  // convergence perturbation stabilize before reaching the interior 512×512
  // region. This ensures continuity when the user pans the regional map.
  const S = REGIONAL_SIZE;
  const NN = S * S;
  const MARGIN = 64;
  const S_PAD = S + 2 * MARGIN;  // 640
  const NN_PAD = S_PAD * S_PAD;
  const baseElevGrid = new Float32Array(NN);
  const elevGrid = new Float32Array(NN);

  // Temporary arrays for high-res field samples (needed in Pass 1c)
  const _hx = new Float32Array(NN);
  const _hy = new Float32Array(NN);
  const _wx = new Float32Array(NN);
  const _wy = new Float32Array(NN);

  // Padded base elevation grid for drainage direction + convergence perturbation
  const baseElevPad = new Float32Array(NN_PAD);

  for (let ry = -MARGIN; ry < S + MARGIN; ry++) {
    for (let rx = -MARGIN; rx < S + MARGIN; rx++) {
      const worldX = originWorldX + rx;
      const worldY = originWorldY + ry;
      const px = worldX / CELLS_PER_PLANETARY;
      const py = worldY / CELLS_PER_PLANETARY;
      const hx = px * hiResMultiplier;
      const hy = py * hiResMultiplier;
      const padIdx = (ry + MARGIN) * S_PAD + (rx + MARGIN);
      baseElevPad[padIdx] = bilinearSampleHR(hiResData.elevation, hx, hy);
      // Store interior coordinate arrays
      if (rx >= 0 && rx < S && ry >= 0 && ry < S) {
        const idx = ry * S + rx;
        baseElevGrid[idx] = baseElevPad[padIdx];
        _hx[idx] = hx;
        _hy[idx] = hy;
        _wx[idx] = worldX;
        _wy[idx] = worldY;
      }
    }
  }

  // Pass 1b: drainage direction from hi-res elevation gradient (globally deterministic).
  // Instead of BFS (which is window-dependent), sample the GLOBAL hi-res elevation
  // grid at a wide window around each cell to determine downhill direction. The hi-res
  // grid was computed once during planet generation and is globally consistent — this
  // gives the same direction regardless of which regional view the cell appears in.
  const drainDirXPad = new Float32Array(NN_PAD);
  const drainDirYPad = new Float32Array(NN_PAD);

  const GRAD_RADIUS_HR = 3.0;  // radius in hi-res cells (~3 × 39 km = ~117 km at 4×)
  const GRAD_STEPS = 8;        // sample directions (N, NE, E, SE, S, SW, W, NW)
  const gradDx = [0, 1, 1, 1, 0, -1, -1, -1];
  const gradDy = [-1, -1, 0, 1, 1, 1, 0, -1];

  const slopeMagPad = new Float32Array(NN_PAD);

  for (let ry = 0; ry < S_PAD; ry++) {
    for (let rx = 0; rx < S_PAD; rx++) {
      const idx = ry * S_PAD + rx;
      if (baseElevPad[idx] <= 0) {
        drainDirXPad[idx] = 0;
        drainDirYPad[idx] = 1;
        continue;
      }

      // Compute hi-res coordinates for this padded cell
      const worldX = originWorldX + (rx - MARGIN);
      const worldY = originWorldY + (ry - MARGIN);
      const hx = (worldX / CELLS_PER_PLANETARY) * hiResMultiplier;
      const hy = (worldY / CELLS_PER_PLANETARY) * hiResMultiplier;
      const centerElev = baseElevPad[idx];

      // Wide-window gradient from global hi-res elevation
      let gx = 0, gy = 0;
      for (let d = 0; d < GRAD_STEPS; d++) {
        const sampleHx = hx + gradDx[d] * GRAD_RADIUS_HR;
        const sampleHy = hy + gradDy[d] * GRAD_RADIUS_HR;
        const sampleElev = bilinearSampleHR(hiResData.elevation, sampleHx, sampleHy);
        const diff = centerElev - sampleElev;  // positive = downhill in that direction
        gx += gradDx[d] * diff;
        gy += gradDy[d] * diff;
      }
      const gLen = Math.sqrt(gx * gx + gy * gy) || 1;
      drainDirXPad[idx] = gx / gLen;
      drainDirYPad[idx] = gy / gLen;

      // Local 7×7 slope on the padded base elevation grid
      let localGx = 0, localGy = 0, localWt = 0;
      for (let ddy = -3; ddy <= 3; ddy++) {
        for (let ddx = -3; ddx <= 3; ddx++) {
          if (ddx === 0 && ddy === 0) continue;
          const nrx = rx + ddx, nry = ry + ddy;
          if (nrx < 0 || nrx >= S_PAD || nry < 0 || nry >= S_PAD) continue;
          const w = 1.0 / Math.sqrt(ddx * ddx + ddy * ddy);
          const diff = baseElevPad[idx] - baseElevPad[nry * S_PAD + nrx];
          localGx += ddx * diff * w;
          localGy += ddy * diff * w;
          localWt += w;
        }
      }
      if (localWt > 0) { localGx /= localWt; localGy /= localWt; }
      const localSlopeMag = Math.sqrt(localGx * localGx + localGy * localGy);
      slopeMagPad[idx] = localSlopeMag;

      // Blend: steep terrain uses local slope, flat terrain uses wide gradient
      const FLAT_THRESH  = 0.0015;
      const STEEP_THRESH = 0.005;
      const t = clamp((localSlopeMag - FLAT_THRESH) / (STEEP_THRESH - FLAT_THRESH), 0, 1);

      if (t > 0.01 && localSlopeMag > 0.0001) {
        const nlx = localGx / localSlopeMag;
        const nly = localGy / localSlopeMag;

        let bx = drainDirXPad[idx] * (1 - t) + nlx * t;
        let by = drainDirYPad[idx] * (1 - t) + nly * t;
        const bLen = Math.sqrt(bx * bx + by * by) || 1;
        drainDirXPad[idx] = bx / bLen;
        drainDirYPad[idx] = by / bLen;
      }
    }
  }

  // ── Convergence perturbation (Bug 3 fix) ──
  // Rotate drainage direction vectors by a low-frequency noise angle on the padded grid.
  // This creates broad zones (~140-cell wavelength) where channels angle
  // toward each other (convergence) and zones where they angle apart (divergence).
  // The result is dendritic drainage instead of parallel ditches.
  const convergeSeed1 = regionSeed + 5555;
  const convergeFreq = 0.007;
  const convergeMaxAngle = 0.35;

  for (let ry = 0; ry < S_PAD; ry++) {
    for (let rx = 0; rx < S_PAD; rx++) {
      const idx = ry * S_PAD + rx;
      if (baseElevPad[idx] <= 0) continue;

      const worldX = originWorldX + (rx - MARGIN);
      const worldY = originWorldY + (ry - MARGIN);

      // Only perturb on flat terrain — steep slopes have reliable slope direction
      const flatness = clamp(1.0 - slopeMagPad[idx] / 0.005, 0, 1);
      if (flatness < 0.05) continue;

      // Low-frequency angular offset
      const angle = noise2D(worldX * convergeFreq, worldY * convergeFreq, convergeSeed1)
                  * convergeMaxAngle * flatness;

      // Rotate the drainage direction by this angle
      const dx = drainDirXPad[idx];
      const dy = drainDirYPad[idx];
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      drainDirXPad[idx] = dx * cos - dy * sin;
      drainDirYPad[idx] = dx * sin + dy * cos;
    }
  }

  // Extract interior 512×512 drainage direction from the padded grid
  const drainDirX = new Float32Array(NN);
  const drainDirY = new Float32Array(NN);
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const srcIdx = (ry + MARGIN) * S_PAD + (rx + MARGIN);
      const dstIdx = ry * S + rx;
      drainDirX[dstIdx] = drainDirXPad[srcIdx];
      drainDirY[dstIdx] = drainDirYPad[srcIdx];
    }
  }

  // Pass 1c: add isotropic + anisotropic noise, sample hi-res fields, build cells.
  for (let ry = 0; ry < S; ry++) {
    for (let rx = 0; rx < S; rx++) {
      const idx = ry * S + rx;
      const worldX = _wx[idx];
      const worldY = _wy[idx];
      const hx = _hx[idx];
      const hy = _hy[idx];
      const px = worldX / CELLS_PER_PLANETARY;
      const py = worldY / CELLS_PER_PLANETARY;
      const baseElev = baseElevGrid[idx];

      // ── Isotropic detail noise (same as before) ──
      let detail = 0, amp = 1, freq = 0.015, totalAmp = 0;
      for (let o = 0; o < 5; o++) {
        detail += amp * noise2D(worldX * freq, worldY * freq, regionSeed + o * 1013);
        totalAmp += amp;
        amp *= 0.5;
        freq *= 2;
      }
      detail /= totalAmp;

      const elevNorm = clamp(baseElev / maxLand, -1, 1);
      let detailAmp;
      if (baseElev <= 0) {
        detailAmp = params.coastAmplitude * 0.4;
      } else {
        detailAmp = params.coastAmplitude + params.mountainDetail * elevNorm;
      }

      // ── Anisotropic channel noise (aligned with drainage direction) ──
      // Creates organized ridge-channel topography for coherent drainage networks.
      let channelOffset = 0;
      if (baseElev > 0) {
        const fdx = drainDirX[idx];
        const fdy = drainDirY[idx];

        // Project world coords into drain-aligned frame
        const alongDrain  =  worldX * fdx + worldY * fdy;
        const acrossDrain = -worldX * fdy + worldX * fdx;
        // More accurate cross-projection:
        const acrossDrainCorr = worldX * (-fdy) + worldY * fdx;

        // Anisotropic noise: low freq along drain (continuous channels),
        // high freq across drain (periodic ridge-channel spacing)
        const alongFreq  = 0.004;
        const acrossFreq = 0.07;

        let channelNoise = 0, cAmp = 1, cTotalAmp = 0;
        for (let o = 0; o < 3; o++) {
          const f = (o === 0) ? 1.0 : (o === 1) ? 2.0 : 4.0;
          channelNoise += cAmp * noise2D(
            alongDrain * alongFreq * f,
            acrossDrainCorr * acrossFreq * f,
            regionSeed + 7000 + o * 337
          );
          cTotalAmp += cAmp;
          cAmp *= 0.45;
        }
        channelNoise /= cTotalAmp;

        // Zone-dependent amplitude: strongest on flats, weakest on steep slopes
        const slopeMagLocal = Math.sqrt(
          (rx > 0 && rx < S - 1 ? (baseElevGrid[idx + 1] - baseElevGrid[idx - 1]) / 2 : 0) ** 2 +
          (ry > 0 && ry < S - 1 ? (baseElevGrid[idx + S] - baseElevGrid[idx - S]) / 2 : 0) ** 2
        );
        const zoneLocal = classifyZone(baseElev, slopeMagLocal, maxLand);
        let channelAmp;
        switch (zoneLocal) {
          case 'lowland':     channelAmp = 0.018; break;
          case 'coastal':     channelAmp = 0.010; break;
          case 'tidal':       channelAmp = 0.006; break;
          case 'mid_slope':   channelAmp = 0.006; break;
          case 'upper_slope': channelAmp = 0.003; break;
          case 'summit':      channelAmp = 0.001; break;
          default:            channelAmp = 0.008; break;
        }

        channelOffset = channelNoise * channelAmp;

        // Reduce isotropic noise on flat terrain so anisotropic channels dominate
        if (zoneLocal === 'lowland')          detailAmp *= 0.4;
        else if (zoneLocal === 'coastal')     detailAmp *= 0.5;
        else if (zoneLocal === 'tidal')       detailAmp *= 0.5;
        else if (zoneLocal === 'mid_slope')   detailAmp *= 0.7;
        // upper_slope and summit keep full amplitude
      }

      const elev = baseElev + detail * detailAmp + channelOffset;
      elevGrid[idx] = elev;

      // ── Interpolated high-res physical base fields ──
      const hrGrain    = bilinearSampleHR(hiResData.grainSize, hx, hy);
      const hrSat      = bilinearSampleHR(hiResData.saturation, hx, hy);
      const hrGCover   = bilinearSampleHR(hiResData.groundCover, hx, hy);
      const hrCanopy   = bilinearSampleHR(hiResData.canopyDensity, hx, hy);
      const hrChemo    = bilinearSampleHR(hiResData.chemoCrust, hx, hy);
      const hrOrganic  = bilinearSampleHR(hiResData.organicContent, hx, hy);
      const hrWTD      = bilinearSampleHR(hiResData.waterTableDepth, hx, hy);
      const hrPrecip   = bilinearSampleHR(hiResData.precipitation, hx, hy);
      const hrGW       = bilinearSampleHR(hiResData.groundwater, hx, hy);
      const hrVolc     = bilinearSampleHR(hiResData.volcanism, hx, hy);
      const hrIron     = bilinearSampleHR(hiResData.iron, hx, hy);
      const hrCopper   = bilinearSampleHR(hiResData.copper, hx, hy);
      const hrManganese= bilinearSampleHR(hiResData.manganese, hx, hy);

      // Flora type: nearest-neighbor (discrete field, don't interpolate).
      const ftInt = nearestSampleHR(hiResData.floraType, hx, hy);
      const hrFloraType = HR_FLORA_NAMES[ftInt] || 'barren';

      // Fields the high-res grid doesn't carry stay sampled from the low-res
      // grid so the non-high-res overlays (moisture, temperature, currents,
      // wind, etc.) keep working exactly as before.
      const cell = {
        rx, ry,
        worldX, worldY,
        baseElevation: elev,
        elevation: elev,
        isLand: elev > 0,
        // planetary-sampled atmospheric fields (not present at high-res)
        precipitation: hrPrecip,
        groundwater: hrGW,
        waterAvailability: bilinearInterpolate(px, py, c => c.waterAvailability),
        atmosphericMoisture: bilinearInterpolate(px, py, c => c.atmosphericMoisture),
        temperature: bilinearInterpolate(px, py, c => c.temperature),
        drainage: bilinearInterpolate(px, py, c => c.drainage),
        windSpeed: bilinearInterpolate(px, py, c => c.windSpeed),
        sst: bilinearInterpolate(px, py, c => c.sst),
        volcanism: hrVolc,
        minerals: {
          iron: hrIron,
          copper: hrCopper,
          manganese: hrManganese,
        },
        grainSize: hrGrain,
        baseGrainSize: hrGrain,
        windU: bilinearInterpolate(px, py, c => c.windU),
        windV: bilinearInterpolate(px, py, c => c.windV),
        currentSpeed: 0,
        currentU: 0,
        currentV: 0,
        // high-res base values retained for the refinement passes
        _hrGrainSize: hrGrain,
        _hrSaturation: hrSat,
        _hrGroundCover: hrGCover,
        _hrCanopy: hrCanopy,
        _hrChemoCrust: hrChemo,
        _hrOrganic: hrOrganic,
        _hrWaterTableDepth: hrWTD,
        _hrFloraType: hrFloraType,
      };
      cell.mineralTotal = cell.minerals.iron + cell.minerals.copper + cell.minerals.manganese;
      cell.dominant = maxKey(cell.minerals);
      // Reclassify land/water from the refined elevation (adds coastline detail)
      cell.isShallowWater = elev > -0.08 && elev <= 0;
      cell.isDeepWater = elev <= -0.08;
      cell.isFreezing = cell.temperature < 0.5;
      regionalCells[rx][ry] = cell;
    }
  }

  // Pass 2: slopes + zone classification (on the refined elevation grid)
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const cell = regionalCells[rx][ry];
      const xm = Math.max(0, rx - 1), xp = Math.min(REGIONAL_SIZE - 1, rx + 1);
      const ym = Math.max(0, ry - 1), yp = Math.min(REGIONAL_SIZE - 1, ry + 1);
      const gx = (elevGrid[ry * REGIONAL_SIZE + xp] - elevGrid[ry * REGIONAL_SIZE + xm]) / 2;
      const gy = (elevGrid[yp * REGIONAL_SIZE + rx] - elevGrid[ym * REGIONAL_SIZE + rx]) / 2;
      cell.slopeMag = Math.sqrt(gx * gx + gy * gy);
      cell.slopeDir = Math.atan2(gy, gx);
      cell.zone = classifyZone(cell.baseElevation, cell.slopeMag, maxLand);
    }
  }

  // Pass 3: drainage (higher-resolution flow accumulation than the high-res grid)
  computeRegionalDrainage(elevGrid);

  // ── Pass 3b: inherit hi-res stream order as floor ──
  // The hi-res grid computed flow accumulation globally (stepHR5_drainage).
  // The regional flow accumulation is window-bounded and misses upstream
  // contributions from outside the view. Use the hi-res stream order as a
  // minimum — the regional computation can only increase it, not decrease it.
  if (hiResData && hiResData.streamOrder) {
    // Minimum drainageDensity values corresponding to each stream order
    // threshold, so downstream consumers (saturation, grain) see consistent
    // values for globally-established channels.
    const MIN_DENSITY = [0, 0.30, 0.55, 0.80];
    //                  so=0  so=1   so=2   so=3

    for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
      for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
        const cell = regionalCells[rx][ry];
        if (!cell.isLand) continue;

        const hx = (cell.worldX / CELLS_PER_PLANETARY) * hiResMultiplier;
        const hy = (cell.worldY / CELLS_PER_PLANETARY) * hiResMultiplier;
        const hrSO = nearestSampleHR(hiResData.streamOrder, hx, hy);

        if (hrSO > cell.streamOrder) {
          cell.streamOrder = hrSO;
        }
        const minDensity = MIN_DENSITY[Math.min(cell.streamOrder, 3)];
        if (cell.drainageDensity < minDensity) {
          cell.drainageDensity = minDensity;
        }
      }
    }
  }

  // Pass 4: refine substrate / saturation / water table from the high-res base.
  //         Ridge cells keep high-res values; channels get wetter and finer.
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      refineRegionalSubstrateFromHiRes(regionalCells[rx][ry]);
    }
  }
  computeStandingWater(elevGrid);

  // Pass 5: refine flora from the (possibly drainage-modified) state, then
  //         derive terrain type through the canonical function.
  for (let ry = 0; ry < REGIONAL_SIZE; ry++) {
    for (let rx = 0; rx < REGIONAL_SIZE; rx++) {
      const cell = regionalCells[rx][ry];
      refineRegionalFloraFromHiRes(cell);
      deriveRegionalTerrainType(cell);
    }
  }

  printRegionalDiagnostic();
}

// ── Refine substrate/saturation/water table from the high-res base ──
//    The high-res values are the starting point; drainage structure (resolved
//    only at regional resolution) pushes channels wetter and finer. Ridge
//    cells (streamOrder 0) are left exactly at their high-res base.
function refineRegionalSubstrateFromHiRes(cell) {
  // Start from the interpolated high-res base
  cell.grainSize = cell._hrGrainSize;
  cell.saturation = cell._hrSaturation;
  cell.waterTableDepth = cell._hrWaterTableDepth;

  if (!cell.isLand) {
    cell.saturation = 1.0;
    cell.baseGrainSize = cell.grainSize;
    return;
  }

  // ── Break bilinear interpolation contours ──
  // The hi-res grid provides only ~4 data points across the regional view.
  // Without noise, threshold crossings (canopy 0.45, cover type transitions)
  // produce grid-aligned straight-line boundaries. Small world-coordinate
  // noise makes these boundaries follow organic contours.
  const precipNoiseSeed = 0xA1B2;
  const gwNoiseSeed = 0xC3D4;
  const noiseFreq = 0.015;   // ~65-cell wavelength (~10 km)
  const precipNoiseAmp = 0.06;
  const gwNoiseAmp = 0.04;

  cell.precipitation += noise2D(cell.worldX * noiseFreq, cell.worldY * noiseFreq, precipNoiseSeed) * precipNoiseAmp;
  cell.precipitation = clamp(cell.precipitation, 0, 1);

  cell.groundwater += noise2D(cell.worldX * noiseFreq, cell.worldY * noiseFreq, gwNoiseSeed) * gwNoiseAmp;
  cell.groundwater = clamp(cell.groundwater, 0, 1);

  const so = cell.streamOrder;

  // ── Drainage-responsive water table modulation ──
  // The hi-res base WTD is 0.00 for most lowland continental cells.
  // Drainage creates differentiation: ridges shed water (WTD pushed positive),
  // channels collect water (WTD pushed negative/zero).
  const drainParams = {
    summit:      { ridge: 0.55, so1: 0.30, so2: 0.10, channel: 0.00 },
    upper_slope: { ridge: 0.40, so1: 0.18, so2: 0.05, channel: 0.00 },
    mid_slope:   { ridge: 0.28, so1: 0.10, so2: 0.02, channel: -0.01 },
    lowland:     { ridge: 0.18, so1: 0.06, so2: 0.00, channel: -0.02 },
    coastal:     { ridge: 0.06, so1: 0.02, so2: 0.00, channel: -0.02 },
    tidal:       { ridge: 0.00, so1: 0.00, so2: 0.00, channel: -0.03 },
  };

  const dp = drainParams[cell.zone] || drainParams.lowland;
  let wtdAdjust;
  if (so === 0) {
    wtdAdjust = dp.ridge;
  } else if (so === 1) {
    wtdAdjust = dp.so1;
  } else if (so === 2) {
    wtdAdjust = dp.so2;
  } else {
    wtdAdjust = dp.channel;  // negative = water table above surface
  }

  cell.waterTableDepth = cell._hrWaterTableDepth + wtdAdjust;

  // Recompute saturation from the drainage-modulated WTD
  // (same capillary fringe model as stepHR4_waterTableRow)
  const capillary = (1.0 - cell.grainSize) * 0.15;
  const effDepth = cell.waterTableDepth - capillary;
  cell.saturation = effDepth <= 0
    ? Math.min(1, Math.max(0.7, 1.0 - effDepth * 0.5))
    : Math.min(0.7, Math.exp(-effDepth * 8.0));

  cell.saturation = clamp(cell.saturation, 0, 1);

  // Channels deposit finer sediment than the ridges around them.
  if (so >= 2) {
    cell.grainSize = Math.min(cell.grainSize, 0.2);
  } else if (so >= 1) {
    cell.grainSize = Math.min(cell.grainSize, cell.grainSize * 0.8 + 0.05);
  }
  cell.grainSize = clamp(cell.grainSize, 0.05, 1.0);
  cell.baseGrainSize = cell.grainSize;
}

// ── Refine flora from the (possibly drainage-modified) state ──
//    Ground cover, canopy, chemo crust and organic content are recomputed with
//    the SAME formulas the high-res grid used (stepHR6), so a ridge cell whose
//    saturation/grain were left at the high-res base reproduces the high-res
//    flora exactly. Channel cells differ because their inputs changed. Flora
//    *type* (photo/chemo/mixo/barren) is inherited from the high-res grid.
function refineRegionalFloraFromHiRes(cell) {
  if (!cell.isLand) {
    cell.floraType = 'none'; cell.floraDensity = 0;
    cell.canopy = 0; cell.groundCover = 0;
    cell.chemoCrust = 0; cell.organicContent = 0;
    return;
  }
  if (cell.isFreezing) {
    cell.floraType = 'frozen'; cell.floraDensity = 0;
    cell.canopy = 0; cell.groundCover = 0;
    cell.chemoCrust = 0; cell.organicContent = 0;
    return;
  }

  // ── Re-derive flora type from continuous properties ──
  // Instead of inheriting cell._hrFloraType (a categorical value from the hi-res
  // grid that's identical across 128×128 regional cells), re-run the flora type
  // fitness competition using this cell's own mineral and water values.
  //
  // Domain warp: displace the mineral sampling coordinates with noise so the
  // classification boundary follows an organic contour instead of the bilinear
  // interpolation grid lines.

  if (hiResData) {
    const hx = (cell.worldX / CELLS_PER_PLANETARY) * hiResMultiplier;
    const hy = (cell.worldY / CELLS_PER_PLANETARY) * hiResMultiplier;

    // Domain warp (matches stepHR6_floraRow warp seeds and parameters)
    const warpScale = 0.08;
    const warpAmp = 1.8;
    const warpSeed1 = 0x7A3C;
    const warpSeed2 = 0x9E1F;
    const wx = hx + noise2D(hx * warpScale, hy * warpScale, warpSeed1) * warpAmp;
