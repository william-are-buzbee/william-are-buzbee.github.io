<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111214;
  color: #c8c8cc;
  font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}

.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: #1a1b1e;
  border-bottom: 1px solid #2a2b2e;
  flex-wrap: wrap;
}

.top-bar label {
  color: #888;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.top-bar input[type="number"] {
  width: 90px;
  padding: 5px 8px;
  background: #111214;
  border: 1px solid #3a3b3e;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 13px;
  border-radius: 3px;
}

.top-bar input[type="number"]:focus {
  outline: none;
  border-color: #5a7a9a;
}

.top-bar button {
  padding: 5px 14px;
  background: #2a4a6a;
  border: 1px solid #3a5a7a;
  color: #d0d8e0;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.15s;
}

.top-bar button:hover { background: #3a5a7a; }
.top-bar button:active { background: #1a3a5a; }

.top-bar select {
  padding: 5px 8px;
  background: #111214;
  border: 1px solid #3a3b3e;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 12px;
  border-radius: 3px;
  cursor: pointer;
}

.top-bar select:focus { outline: none; border-color: #5a7a9a; }

.top-bar .sep {
  width: 1px;
  height: 20px;
  background: #2a2b2e;
}

.status-text {
  color: #666;
  font-size: 11px;
  margin-left: auto;
}

.main-area {
  display: flex;
  justify-content: center;
  padding: 16px;
  gap: 12px;
  flex-wrap: wrap;
}

.planetary-panel {
  flex: 1 1 55%;
  max-width: 640px;
  min-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.planetary-panel canvas {
  width: 100%;
  max-width: 640px;
}

/* Tooltip */
.cell-tooltip {
  position: fixed;
  z-index: 1000;
  background: rgba(20, 22, 26, 0.94);
  border: 1px solid #3a4a5a;
  border-radius: 5px;
  padding: 8px 12px;
  font-size: 11px;
  line-height: 1.6;
  color: #c8c8cc;
  pointer-events: none;
  max-width: 320px;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}

.cell-tooltip .tip-row {
  white-space: nowrap;
}

.cell-tooltip .tip-row b {
  color: #5a7a9a;
  font-weight: 600;
}

canvas {
  border: 1px solid #2a2b2e;
  cursor: crosshair;
  image-rendering: pixelated;
}

canvas.globe-canvas {
  image-rendering: auto;
  cursor: grab;
}

canvas.globe-canvas:active {
  cursor: grabbing;
}

canvas.mollweide-canvas {
  image-rendering: auto;
  cursor: crosshair;
}

canvas.hidden-canvas {
  display: none;
}

.view-toggle {
  display: inline-flex;
  border: 1px solid #3a3b3e;
  border-radius: 3px;
  overflow: hidden;
}

.view-toggle button {
  padding: 5px 10px;
  background: #111214;
  border: none;
  border-right: 1px solid #3a3b3e;
  color: #888;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  border-radius: 0;
}

.view-toggle button:last-child {
  border-right: none;
}

.view-toggle button:hover {
  background: #1e2024;
  color: #c0c0c4;
}

.view-toggle button.active {
  background: #2a4a6a;
  color: #d0d8e0;
}

/* ── Snapshot Info Panel (bottom-left quadrant) ── */
.snapshot-panel {
  background: #1a1b1e;
  border: 1px solid #2a2b2e;
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 11px;
  line-height: 1.55;
  color: #c8c8cc;
  min-height: 180px;
  max-height: 400px;
  overflow-y: auto;
  width: 100%;
  max-width: 640px;
  margin-top: 10px;
}

.snapshot-panel::-webkit-scrollbar { width: 5px; }
.snapshot-panel::-webkit-scrollbar-track { background: #111214; border-radius: 3px; }
.snapshot-panel::-webkit-scrollbar-thumb { background: #3a3b3e; border-radius: 3px; }

.snapshot-panel .snap-placeholder {
  color: #555;
  font-style: italic;
  text-align: center;
  padding: 60px 0;
}

.snapshot-panel .snap-section {
  margin-bottom: 6px;
}

.snapshot-panel .snap-section:last-child {
  margin-bottom: 0;
}

.snapshot-panel .snap-header {
  color: #5a7a9a;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.5px;
  border-bottom: 1px solid #2a2b2e;
  padding-bottom: 2px;
  margin-bottom: 3px;
}

.snapshot-panel .snap-row {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #b0b0b4;
}

.snapshot-panel .snap-row b {
  color: #7a9aba;
  font-weight: 600;
}

.snapshot-panel .snap-row .val {
  color: #d0d0d4;
}

.snapshot-panel .snap-timestamp {
  color: #555;
  font-size: 10px;
  text-align: right;
  margin-top: 6px;
  border-top: 1px solid #2a2b2e;
  padding-top: 4px;
}

.info-panel {
  display: none;
}



/* ── Regional detail panel ── */
.regional-panel {
  flex: 1 1 40%;
  max-width: 520px;
  min-width: 280px;
}



.regional-placeholder {
  background: #1a1b1e;
  border: 1px solid #2a2b2e;
  border-radius: 4px;
  padding: 24px 16px;
  text-align: center;
  color: #555;
  font-style: italic;
  font-size: 12px;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.regional-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: #1a1b1e;
  border: 1px solid #2a2b2e;
  border-bottom: none;
  border-radius: 4px 4px 0 0;
}

.regional-header .region-label {
  color: #5a7a9a;
  font-size: 12px;
  flex: 1;
}

.regional-header select {
  padding: 4px 8px;
  background: #111214;
  border: 1px solid #3a3b3e;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 11px;
  border-radius: 3px;
  cursor: pointer;
}

.regional-header select:focus { outline: none; border-color: #5a7a9a; }

.regional-header .close-btn {
  padding: 2px 8px;
  background: transparent;
  border: 1px solid #3a3b3e;
  color: #888;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  border-radius: 3px;
  line-height: 1;
}

.regional-header .close-btn:hover { background: #2a2b2e; color: #ccc; }

.regional-canvas-wrap {
  border: 1px solid #2a2b2e;
  border-top: none;
  border-radius: 0 0 4px 4px;
  overflow: hidden;
  line-height: 0;
}

.regional-canvas-wrap canvas {
  image-rendering: pixelated;
  cursor: crosshair;
  width: 100%;
  max-width: 1024px;
}

.active-panel {
  border-color: #5a7a9a !important;
}

.regional-canvas-wrap.active-panel {
  border-color: #5a7a9a !important;
}

.regional-header.active-panel {
  border-color: #5a7a9a !important;
}

/* ── Tuning Panel ── */
#tuningToggle {
  padding: 5px 14px;
  background: #2a4a6a;
  border: 1px solid #3a5a7a;
  color: #d0d8e0;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.15s;
}
#tuningToggle:hover { background: #3a5a7a; }

#tuningPanel {
  display: none;
  background: rgba(10, 15, 25, 0.95);
  border: 1px solid rgba(100, 120, 150, 0.25);
  border-radius: 6px;
  padding: 12px;
  max-height: 520px;
  overflow-y: auto;
  width: 100%;
}

#tuningPanel::-webkit-scrollbar {
  width: 6px;
}
#tuningPanel::-webkit-scrollbar-track {
  background: rgba(20, 25, 35, 0.5);
  border-radius: 3px;
}
#tuningPanel::-webkit-scrollbar-thumb {
  background: rgba(100, 120, 150, 0.3);
  border-radius: 3px;
}

.tune-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}

.tune-presets button {
  padding: 3px 10px;
  background: #1e2a3a;
  border: 1px solid #3a4a5a;
  color: #8899aa;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.15s, color 0.15s;
}
.tune-presets button:hover {
  background: #2a3a4a;
  color: #aabbcc;
}
.tune-presets button.preset-active {
  background: #2a4a6a;
  color: #d0d8e0;
  border-color: #4a6a8a;
}

.tune-group-label {
  color: #667788;
  font-size: 11px;
  margin: 10px 0 4px 0;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.tune-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 3px 0;
  font-size: 12px;
}

.tune-row label {
  width: 140px;
  text-align: right;
  color: #8899aa;
  flex-shrink: 0;
  font-size: 11px;
}

.tune-row input[type="range"] {
  width: 120px;
  accent-color: #4a7aaa;
}

.tune-value {
  width: 50px;
  text-align: left;
  color: #aabbcc;
  font-family: monospace;
  font-size: 11px;
}

.tune-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(100, 120, 150, 0.15);
}

.tune-actions button {
  padding: 4px 12px;
  background: #1e2a3a;
  border: 1px solid #3a4a5a;
  color: #8899aa;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.15s;
}
.tune-actions button:hover {
  background: #2a3a4a;
  color: #aabbcc;
}

.tune-toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20, 30, 50, 0.95);
  border: 1px solid #4a6a8a;
  color: #c0d0e0;
  padding: 8px 20px;
  border-radius: 4px;
  font-size: 12px;
  font-family: inherit;
  z-index: 2000;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.tune-toast.visible { opacity: 1; }

.tuning-wrap {
  width: 100%;
  padding: 0 16px 8px 16px;
  background: #1a1b1e;
  border-bottom: 1px solid #2a2b2e;
}

.info-value.type-continental { color: #8ab47a; }
.info-value.type-oceanic { color: #5a8aba; }
.info-value.type-photo { color: #c06040; }
.info-value.type-chemo { color: #8050a0; }
.info-value.type-mixo { color: #a05070; }
.info-value.type-barren { color: #808080; }
.info-value.type-frozen { color: #c0c8d0; }
</style>
</head>
<body>

<div class="top-bar">
  <label for="seedInput">Seed</label>
  <input type="number" id="seedInput" value="42" min="0" max="999999">
  <button id="genBtn">Generate</button>
  <select id="resolutionSelect" title="Surface detail resolution">
    <option value="1">Normal (512×256)</option>
    <option value="2">High (1024×512)</option>
    <option value="4" selected>Very High (2048×1024)</option>
    <option value="8">Ultra (4096×2048)</option>
  </select>
  <div id="progressContainer" style="display:none; width:180px; height:14px; border:1px solid #3a5a7a; border-radius:3px; overflow:hidden; background:#141c28; vertical-align:middle;">
    <div id="progressBar" style="height:100%; width:0%; background:#4a9d8e; transition:width 0.1s;"></div>
  </div>
  <span id="progressText" style="font-size:11px; color:#8fa; display:inline-block; min-width:110px; vertical-align:middle;"></span>
  <div class="sep"></div>
  <label for="overlaySelect">Overlay</label>
  <select id="overlaySelect">
    <option value="surface">Surface</option>
    <option value="topographic">Topographic</option>
    <option value="plates">Plates</option>
    <option value="iron">Mineral: Iron</option>
    <option value="copper">Mineral: Copper</option>
    <option value="manganese">Mineral: Manganese</option>
    <option value="composite">Mineral: Composite</option>
    <option value="moisture">Moisture</option>
    <option value="precipitation">Precipitation</option>
    <option value="groundwater">Groundwater</option>
    <option value="waterAvail">Water Availability</option>
    <option value="wind">Wind</option>
    <option value="currents">Ocean Currents</option>
    <option value="floraType">Flora Type</option>
    <option value="floraDensity">Flora Density</option>
    <option value="terrainType">Terrain Type (HR)</option>
    <option value="substrate">Substrate (HR)</option>
    <option value="saturation">Saturation (HR)</option>
    <option value="drainage">Drainage (HR)</option>
  </select>
  <div class="sep"></div>
  <label>View</label>
  <div class="view-toggle">
    <button id="viewFlat" class="active" title="Flat map view">🗺 Flat</button>
    <button id="viewGlobe" title="3D globe view">🌍 Globe</button>
    <button id="viewMollweide" title="Mollweide equal-area projection">🗂 Mollweide</button>
  </div>
  <button id="homeBtn" title="Return to home orientation (north-up, equator-centered)">⌂ Home</button>
  <button id="infoSnapBtn" title="Capture snapshot of current cell data (I)">I Info</button>
  <span id="speedControl" style="display:none;">
    <label style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Speed</label>
    <input type="range" id="spinSpeedSlider" min="0" max="100" value="30"
           style="width:100px;vertical-align:middle;">
    <button id="pauseSpinBtn" title="Pause/Resume spin" style="padding:5px 8px;background:#2a4a6a;border:1px solid #3a5a7a;color:#d0d8e0;font-family:inherit;font-size:12px;cursor:pointer;border-radius:3px;">⏸</button>
  </span>
  <span class="status-text" id="statusText">Ready</span>
</div>

<div class="tuning-wrap">
  <button id="tuningToggle">⚙ Tuning ▼</button>
  <div id="tuningPanel"></div>
</div>
<div class="tune-toast" id="tuneToast"></div>

<div class="main-area">
  <div class="planetary-panel">
    <canvas id="planetCanvas" width="1024" height="512"></canvas>
    <canvas id="globeCanvas" class="globe-canvas hidden-canvas" width="600" height="600"></canvas>
    <canvas id="mollweideCanvas" class="mollweide-canvas hidden-canvas" width="1024" height="512"></canvas>
    <div class="snapshot-panel" id="snapshotPanel">
      <div class="snap-placeholder">Press <b>I</b> to capture cell info</div>
    </div>
  </div>
  <div class="regional-panel" id="regionalPanel">
    <div class="regional-placeholder" id="regionalPlaceholder">Click a cell on any map view to generate a high-resolution regional detail view (~1 km per cell).</div>
    <div id="regionalActive" style="display:none;">
      <div class="regional-header" id="regionalHeader">
        <span class="region-label" id="regionLabel">REGION: (—, —)</span>
        <select id="regionalOverlaySelect">
          <option value="surface">Surface</option>
          <option value="topographic">Topographic</option>
          <option value="drainage">Drainage</option>
          <option value="saturation">Saturation</option>
          <option value="terrainType">Terrain Type</option>
          <option value="zone">Zone</option>
          <option value="iron">Mineral: Iron</option>
          <option value="copper">Mineral: Copper</option>
          <option value="manganese">Mineral: Manganese</option>
          <option value="composite">Mineral: Composite</option>
          <option value="moisture">Moisture</option>
          <option value="precipitation">Precipitation</option>
          <option value="groundwater">Groundwater</option>
          <option value="waterAvail">Water Availability</option>
          <option value="floraType">Flora Type</option>
          <option value="floraDensity">Flora Density</option>
        </select>
        <button class="close-btn" id="closeRegionalBtn" title="Close regional view">✕</button>
      </div>
      <div class="regional-canvas-wrap" id="regionalCanvasWrap">
        <canvas id="regionalCanvas" width="512" height="512"></canvas>
      </div>
    </div>
    <!-- ── Tile detail panel (Phase B — additive) ── -->
    <div id="tileDetailContainer" style="display:none; position:relative; margin-top:12px;">
      <div class="regional-header" id="tileDetailHeader">
        <span class="region-label" id="tileDetailTitle">TILES:</span>
        <select id="tileOverlaySelect">
          <option value="surface">Surface</option>
          <option value="paletteFg">Palette FG</option>
          <option value="drainage">Drainage</option>
          <option value="saturation">Saturation</option>
          <option value="terrain">Terrain Type</option>
          <option value="substrate">Substrate</option>
          <option value="canopy">Canopy</option>
          <option value="flora">Flora Type</option>
          <option value="variant">Variant</option>
        </select>
        <button class="close-btn" id="tileCloseBtn" title="Close tile view">✕</button>
      </div>
      <div class="regional-canvas-wrap" id="tileCanvasWrap">
        <canvas id="tileCanvas" width="512" height="512"></canvas>
      </div>
    </div>
  </div>
</div>
<div class="cell-tooltip" id="cellTooltip" style="display:none;"></div>
<div class="cell-tooltip" id="tileTooltip" style="display:none;"></div>

<script>
// ── Tunable Parameters ──
const params = {
  // Plates
  plateCountBase: 14,
  plateCountRange: 6,
  continentalRatio: 0.30,
  minPlateSpacing: 0.28,  // 3D sphere units

  // Elevation
  continentalBase: -0.08,
  continentalNoise: 0.18,
  oceanicBase: -0.30,
  fractalAmp: 0.15,
  fractalOctaves: 4,
  fractalScale: 0.02,

  // Mountains
  collisionHeight: 0.65,
  mountainNoiseScale: 0.05,
  arcHeight: 0.55,
  arcNoiseScale: 0.06,

  // Peak shape
  peakAspectRatio: 2.5,       // long axis / short axis for boundary-aligned peaks
  peakAngularNoise: 0.25,     // how much the radius varies with angle (0 = perfect ellipse, 1 = very jagged)
  peakAngularFreq: 5,         // number of lobes around the peak (higher = more indented coastline)

  // Arc Chains
  arcChainMinPeaks: 4,
  arcChainMaxPeaks: 8,
  arcChainSpacing: 4,
  arcChainJitter: 1.5,
  arcSubPeakRadiusMin: 3,
  arcSubPeakRadiusMax: 6,

  // Hotspots
  hotspotCountBase: 3,
  hotspotCountRange: 5,
  hotspotIntensityMin: 0.5,
  hotspotIntensityMax: 1.0,
  subPeakMin: 2,
  subPeakMax: 5,
  subPeakSpread: 80,

  // Erosion
  erosionPasses: 4,
  erosionRate: 0.18,

  // Blend
  blendWidth: 6,

  // Regional detail
  coastAmplitude: 0.10,
  coastWidth: 0.07,
  mountainDetail: 0.05,
  shapeNoiseAmp: 0.05,
  drainageDepth: 0.012,
  drainagePathsMin: 6,
  drainagePathsMax: 12,

  // Wind
  windBlockingStrength: 8.0,
  windDeflectionFactor: 0.5,
  windDeflectionPasses: 3,
  tradeWindSpeed: 1.2,
  westerlyWindSpeed: 0.9,
  itczWidth: 8,
  tradeEndLat: 28,
  subtropicalEndLat: 35,
  westerlyEndLat: 55,

  // Ocean Currents
  currentStressCoeff: 0.03,
  currentCoriolisStrength: 0.15,
  currentAdvectionRate: 0.02,
  currentFriction: 0.12,
  currentIterations: 50,
  maxCurrentSpeed: 3.0,
  sstAdvectionIterations: 35,
  sstMixRate: 0.1,
  upwellingCooling: 0.15,

  // Precipitation
  moistureIterations: 70,
  thermalEvapFactor: 0.18,
  windEvapFactor: 0.10,
  oroFactor: 0.4,
  convFactor: 0.3,
  bgPrecipRate: 0.045,
  moistureDiffusion: 0.08,

  // Groundwater
  coastalGroundwater: 0.35,
  groundwaterDepthFactor: 2.0,
  groundwaterRecharge: 0.5,
  groundwaterGeothermal: 0.8,
  coastalThreshold: 0.08,

  // Drainage
  hydDrainageScale: 0.15,
  hydDrainageCap: 0.4,

  // Planetary atmosphere
  atmosphericPressure: 1.2,
  sstFloor: 0.50,
};

// Store defaults for reset
const defaultParams = { ...params };

const paramConfig = {
  plateCountBase:     { label: 'Plate count base',     min: 4,     max: 20,    step: 1,     group: 'Plates' },
  plateCountRange:    { label: 'Plate count range',    min: 1,     max: 10,    step: 1,     group: 'Plates' },
  continentalRatio:   { label: 'Continental %',        min: 0.10,  max: 0.70,  step: 0.05,  group: 'Plates' },
  minPlateSpacing:    { label: 'Min plate spacing',    min: 0.15,  max: 0.60,  step: 0.01,  group: 'Plates' },
  continentalBase:    { label: 'Continental base',     min: -0.25, max: 0.05,  step: 0.01,  group: 'Elevation' },

// ── Constants ──
const W = 512, H = 256;
const TOTAL = W * H;

// ── PRNG: mulberry32 ──
function mulberry32(seed) {
  let s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Noise ──
function hashInt(x, y, seed) {
  let h = (seed & 0xffffffff) + (x * 374761393) + (y * 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}

function noise2D(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const n00 = hashInt(ix, iy, seed);
  const n10 = hashInt(ix + 1, iy, seed);
  const n01 = hashInt(ix, iy + 1, seed);
  const n11 = hashInt(ix + 1, iy + 1, seed);
  const nx0 = n00 + (n10 - n00) * sx;
  const nx1 = n01 + (n11 - n01) * sx;
  return (nx0 + (nx1 - nx0) * sy) * 2 - 1; // map to -1..1
}

function fractalNoise(x, y, seed, octaves, baseScale) {
  let value = 0, amplitude = 1, frequency = baseScale, totalAmp = 0;
  for (let i = 0; i < octaves; i++) {
    value += amplitude * noise2D(x * frequency, y * frequency, seed + i * 1000);
    totalAmp += amplitude;
    amplitude *= 0.5;
    frequency *= 2;
  }
  return value / totalAmp;
}

// ── 3D noise for wrapping x-axis ──
function hashInt3D(x, y, z, seed) {
  let h = (seed & 0xffffffff) + (x * 374761393) + (y * 668265263) + (z * 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}

function noise3D(x, y, z, seed) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const uz = fz * fz * (3 - 2 * fz);
  const n000 = hashInt3D(ix,   iy,   iz,   seed);
  const n100 = hashInt3D(ix+1, iy,   iz,   seed);
  const n010 = hashInt3D(ix,   iy+1, iz,   seed);
  const n110 = hashInt3D(ix+1, iy+1, iz,   seed);
  const n001 = hashInt3D(ix,   iy,   iz+1, seed);
  const n101 = hashInt3D(ix+1, iy,   iz+1, seed);
  const n011 = hashInt3D(ix,   iy+1, iz+1, seed);
  const n111 = hashInt3D(ix+1, iy+1, iz+1, seed);
  const nx00 = n000 + (n100 - n000) * ux;
  const nx10 = n010 + (n110 - n010) * ux;
  const nx01 = n001 + (n101 - n001) * ux;
  const nx11 = n011 + (n111 - n011) * ux;
  const nxy0 = nx00 + (nx10 - nx00) * uy;
  const nxy1 = nx01 + (nx11 - nx01) * uy;
  return (nxy0 + (nxy1 - nxy0) * uz) * 2 - 1; // map to -1..1
}

function fractalNoise3D(x, y, z, seed, octaves, scale) {
  let value = 0, amplitude = 1, frequency = scale, totalAmp = 0;
  for (let i = 0; i < octaves; i++) {
    value += amplitude * noise3D(x * frequency, y * frequency, z * frequency, seed + i * 1000);
    totalAmp += amplitude;
    amplitude *= 0.5;
    frequency *= 2;
  }
  return value / totalAmp;
}

// Map x to a circle in 3D so x=0 and x=W land on the same point,
// producing seamless wrapping on the x-axis.
function wrappedNoise(x, y, seed, octaves, scale) {
  const theta = (x / W) * Math.PI * 2;
  const circleScale = W / (Math.PI * 2); // preserve feature size
  const nx = Math.cos(theta) * circleScale;
  const nz = Math.sin(theta) * circleScale;
  return fractalNoise3D(nx, y, nz, seed, octaves, scale);
}

// ── Precomputed sphere positions for all cells ──
const spherePos = new Array(W);
for (let cx = 0; cx < W; cx++) {
  spherePos[cx] = new Array(H);
  for (let cy = 0; cy < H; cy++) {
    const lon = (cx / W) * Math.PI * 2 - Math.PI;
    const lat = (cy / H) * Math.PI - Math.PI / 2;
    spherePos[cx][cy] = {
      x: Math.cos(lat) * Math.cos(lon),
      y: Math.sin(lat),
      z: Math.cos(lat) * Math.sin(lon)
    };
  }
}

// Conversion factor: cell distance (at equator) to 3D unit-sphere distance
const CELL_TO_3D = 2 * Math.PI / W; // ≈ 0.01227

function dist3D(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

// Sample noise in 3D using sphere position — eliminates ALL grid artifacts
function sphereNoise(pos, seed, octaves, scale) {
  const s = scale * 100;
  // Offset by irrational numbers to break grid alignment with sphere axes
  return fractalNoise3D(
    pos.x * s + 0.3183,   // ≈ 1/π
    pos.y * s + 0.7071,   // ≈ 1/√2
    pos.z * s + 0.4142,   // ≈ √2 - 1
    seed, octaves, 1.0
  );
}

// ── Utilities ──
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function wrappedDistSq(x1, y1, x2, y2) {
  let dx = Math.abs(x1 - x2);
  if (dx > W / 2) dx = W - dx;
  const dy = y1 - y2;
  return dx * dx + dy * dy;
}

function wrappedDist(x1, y1, x2, y2) {
  return Math.sqrt(wrappedDistSq(x1, y1, x2, y2));
}

function wrapX(x) { return ((x % W) + W) % W; }

// ── Spherical distance (fixes pole pinching) ──
function toSphere(cellX, cellY) {
  const lon = (cellX / W) * Math.PI * 2 - Math.PI;  // -π to π
  const lat = (cellY / H) * Math.PI - Math.PI / 2;   // -π/2 to π/2 (south to north)
  return {
    x: Math.cos(lat) * Math.cos(lon),
    y: Math.sin(lat),
    z: Math.cos(lat) * Math.sin(lon)
  };
}

function sphericalDist(x1, y1, x2, y2) {
  const a = toSphere(x1, y1);
  const b = toSphere(x2, y2);
  const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

// Convert a plate drift (2D angle + speed) to a 3D tangent vector on the sphere
function driftTo3D(centerX, centerY, angleDeg, speed) {
  const lon = (centerX / W) * Math.PI * 2 - Math.PI;
  const lat = (centerY / H) * Math.PI - Math.PI / 2;
  // Local east unit vector
  const ex = -Math.sin(lon), ey = 0, ez = Math.cos(lon);
  // Local north unit vector
  const nx = -Math.cos(lon) * Math.sin(lat), ny = Math.cos(lat), nz = -Math.sin(lon) * Math.sin(lat);
  const a = angleDeg * Math.PI / 180;
  return {
    x: speed * (Math.cos(a) * ex + Math.sin(a) * nx),
    y: speed * (Math.cos(a) * ey + Math.sin(a) * ny),
    z: speed * (Math.cos(a) * ez + Math.sin(a) * nz),
  };
}

function idx(x, y) { return y * W + wrapX(x); }

function maxKey(obj) {
  let best = null, bestVal = -Infinity;
  for (const k in obj) {
    if (obj[k] > bestVal) { bestVal = obj[k]; best = k; }
  }
  return best;
}

function toRad(deg) { return deg * Math.PI / 180; }

function getLatitudeBand(y) {
  if (y < 25 || y >= 230) return 'polar';
  if (y < 64 || y >= 192) return 'temperate';
  return 'tropical';
}

// ── Planet data ──
let cells = null;
let plates = null;
let hotspots = null;
let geoSeeds = null; // mountain/arc/rift seed points

// ── Spatial index for geological seeds ──
const GRID_SIZE = 20;
const GRID_W = Math.ceil(W / GRID_SIZE);
const GRID_H = Math.ceil(H / GRID_SIZE);

function buildSeedGrid(seeds) {
  const grid = new Array(GRID_W * GRID_H);
  for (let i = 0; i < grid.length; i++) grid[i] = [];
  for (const s of seeds) {
    const gx = Math.floor(s.x / GRID_SIZE) % GRID_W;
    const gy = clamp(Math.floor(s.y / GRID_SIZE), 0, GRID_H - 1);
    grid[gy * GRID_W + gx].push(s);
  }
  return grid;
}

function queryNearbySeeds(grid, x, y, maxRadius3D) {
  const results = [];
  const pos = spherePos[x][y];
  // Convert 3D radius to cell units, accounting for pole compression
  const lat = Math.abs(((y + 0.5) / H) - 0.5) * Math.PI;
  const cosLat = Math.max(0.05, Math.cos(lat));
  const equatCells = maxRadius3D / CELL_TO_3D;
  const safeCells = equatCells / cosLat;
  const cellRadius = Math.min(Math.ceil(safeCells / GRID_SIZE) + 1, Math.ceil(GRID_W / 2));
  const gx0 = Math.floor(x / GRID_SIZE);
  const gy0 = Math.floor(y / GRID_SIZE);
  for (let dy = -cellRadius; dy <= cellRadius; dy++) {
    const gy = gy0 + dy;
    if (gy < 0 || gy >= GRID_H) continue;
    for (let dx = -cellRadius; dx <= cellRadius; dx++) {
      const gx = ((gx0 + dx) % GRID_W + GRID_W) % GRID_W;
      const bucket = grid[gy * GRID_W + gx];
      for (const s of bucket) {
        const d = dist3D(pos, spherePos[s.x][s.y]);
        if (d < maxRadius3D) {
          results.push({ seed: s, dist: d });
        }
      }
    }
  }
  return results;
}

// ── Generation pipeline ──
function generatePlanet(seed) {
  const rng = mulberry32(seed);
  cells = new Array(TOTAL);
  for (let i = 0; i < TOTAL; i++) {
    cells[i] = {
      x: i % W,
      y: (i / W) | 0,
      plateId: 0,
      plateType: 'oceanic',
      nearestDist: 0,
      secondPlateId: 0,
      secondDist: Infinity,
      boundaryType: null,
      boundaryStrength: 0,
      boundaryDistance: 999,
      elevation: 0,
      isLand: false,
      isShallowWater: false,
      isDeepWater: true,
      minerals: { iron: 0, copper: 0, manganese: 0 },
      mineralTotal: 0,
      isDepleted: true,
      dominant: 'iron',
      volcanism: 0,
      proximity: 0,
      blend: 0.5,
      convergence: 0,
      moisture: 0,
      baseMoisture: 0,
      temperature: 0.7,
      isFreezing: false,
      wind: { direction: 0, speed: 1 },
      windU: 0,
      windV: 0,
      windSpeed: 0,
      currentU: 0,
      currentV: 0,
      currentSpeed: 0,
      sst: 0.7,
      precipitation: 0,
      atmosphericMoisture: 0,
      groundwater: 0,
      drainage: 0,
      waterAvailability: 0,
      floraType: 'none',
      floraDensity: 0,
    };
  }

  // Step 1: Plates
  step1_generatePlates(seed, rng);
  // Step 1b: Generate geological seed points (mountains, arcs, rifts)
  step1b_generateGeoSeeds(seed, rng);
  // Step 2: Elevation
  step2_computeElevation(seed, rng);
  // Step 3: Minerals
  step3_computeMinerals(seed, rng);
  // Step 4: Atmosphere
  step4_computeAtmosphere(seed, rng);
  // Step 5: Flora
  step5_computeFlora();
  // Step 5b: Terrain + cover type (via the canonical deriveTerrainAndCover)
  step5b_deriveTerrainType();
  // Diagnostic
  printWeatherDiagnostic();
  printPrecipDiagnostic();
}

// ── Step 1: Plates ──
function step1_generatePlates(seed, rng) {
  const N = params.plateCountBase + (seed % params.plateCountRange);

  // 1a. Place centers
  const centers = [];
  let attempts = 0;
  while (centers.length < N && attempts < 50000) {
    const cx = Math.floor(rng() * W);
    const cy = Math.floor(rng() * H);
    let ok = true;
    for (const c of centers) {
      if (dist3D(spherePos[cx][cy], spherePos[c.x][c.y]) < params.minPlateSpacing) { ok = false; break; }
    }
    if (ok) centers.push({ x: cx, y: cy });
    attempts++;
  }

  // 1c. Assign plate properties
  plates = centers.map((c, i) => {
    const type = rng() < params.continentalRatio ? 'continental' : 'oceanic';
    return {
      id: i,
      center: c,
      type: type,
      drift: {
        angle: rng() * 360,
        speed: 0.5 + rng() * 2.5,
      },
      baseRock: {
        iron: type === 'continental' ? 0.3 + rng() * 0.3 : 0.15 + rng() * 0.2,
        copper: 0.05 + rng() * 0.15,
        manganese: type === 'oceanic' ? 0.2 + rng() * 0.3 : 0.05 + rng() * 0.15,
      },
    };
  });

  // 1b. Voronoi assignment (track nearest and second-nearest)
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let nearest = { id: -1, dist: Infinity };
      let secondNearest = { id: -1, dist: Infinity };
      const pos = spherePos[x][y];
      for (let p = 0; p < plates.length; p++) {
        const d = dist3D(pos, spherePos[plates[p].center.x][plates[p].center.y]);
        if (d < nearest.dist) {
          secondNearest = { id: nearest.id, dist: nearest.dist };
          nearest = { id: p, dist: d };
        } else if (d < secondNearest.dist) {
          secondNearest = { id: p, dist: d };
        }
      }
      const c = cells[y * W + x];
      c.plateId = nearest.id;
      c.plateType = plates[nearest.id].type;
      c.nearestDist = nearest.dist;
      c.secondPlateId = secondNearest.id;
      c.secondDist = secondNearest.dist;
    }
  }

  // 1d. Classify boundaries
  const dx4 = [1, -1, 0, 0];
  const dy4 = [0, 0, -1, 1];

  // First pass: identify boundary cells and their types
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = cells[y * W + x];
      const plateA = plates[c.plateId];
      let bestConvergence = 0;
      let bestType = null;
      let isBoundary = false;

      for (let d = 0; d < 4; d++) {
        const nx = wrapX(x + dx4[d]);
        const ny = y + dy4[d];
        if (ny < 0 || ny >= H) continue;
        const neighbor = cells[ny * W + nx];
        if (neighbor.plateId === c.plateId) continue;

        isBoundary = true;
        const plateB = plates[neighbor.plateId];

        // Boundary normal — use 3D vectors on the sphere
        const pA3 = spherePos[plateA.center.x][plateA.center.y];
        const pB3 = spherePos[plateB.center.x][plateB.center.y];
        const bnx3 = pB3.x - pA3.x, bny3 = pB3.y - pA3.y, bnz3 = pB3.z - pA3.z;
        const bnLen = Math.sqrt(bnx3*bnx3 + bny3*bny3 + bnz3*bnz3) || 1;

        // Project drift vectors (as 3D tangent vectors) onto boundary normal
        const driftA3 = driftTo3D(plateA.center.x, plateA.center.y, plateA.drift.angle, plateA.drift.speed);
        const driftB3 = driftTo3D(plateB.center.x, plateB.center.y, plateB.drift.angle, plateB.drift.speed);
        const driftA_proj = (driftA3.x * bnx3 + driftA3.y * bny3 + driftA3.z * bnz3) / bnLen;
        const driftB_proj = (driftB3.x * bnx3 + driftB3.y * bny3 + driftB3.z * bnz3) / bnLen;
        const convergence = driftA_proj - driftB_proj;

        if (Math.abs(convergence) > Math.abs(bestConvergence)) {
          bestConvergence = convergence;

          if (convergence > 0.8) {
            if (plateA.type === 'continental' && plateB.type === 'continental') {
              bestType = 'collision';
            } else {
              bestType = 'subduction';
            }
          } else if (convergence < -0.8) {
            if (plateA.type === 'continental' && plateB.type === 'continental') {
              bestType = 'rift';
            } else {
              bestType = 'spreading';
            }
          } else {
            bestType = 'transform';
          }
        }
      }

      if (isBoundary) {
        c.boundaryType = bestType;
        c.boundaryStrength = clamp(Math.abs(bestConvergence) / 3.0, 0, 1);
        c.boundaryDistance = 0;
      }
    }
  }

  // BFS from boundary cells to compute boundaryDistance for non-boundary cells
  const queue = [];
  const visited = new Uint8Array(TOTAL);
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].boundaryDistance === 0) {
      queue.push(i);
      visited[i] = 1;
    }
  }

  let head = 0;
  while (head < queue.length) {
    const ci = queue[head++];
    const cx = ci % W;
    const cy = (ci / W) | 0;
    const cell = cells[ci];

    for (let d = 0; d < 4; d++) {
      const nx = wrapX(cx + dx4[d]);
      const ny = cy + dy4[d];
      if (ny < 0 || ny >= H) continue;
      const ni = ny * W + nx;
      if (visited[ni]) continue;

      const newDist = cell.boundaryDistance + 1;
      if (newDist > 15) continue; // only propagate up to distance 15

      visited[ni] = 1;
      const neighbor = cells[ni];
      neighbor.boundaryDistance = newDist;
      neighbor.boundaryType = cell.boundaryType;
      neighbor.boundaryStrength = cell.boundaryStrength;
      queue.push(ni);
    }
  }

  // 1e. Hotspots
  const numHotspots = params.hotspotCountBase + (seed % params.hotspotCountRange);
  hotspots = [];
  for (let i = 0; i < numHotspots; i++) {
    hotspots.push({
      x: Math.floor(rng() * W),
      y: Math.floor(rng() * H),
      intensity: params.hotspotIntensityMin + rng() * (params.hotspotIntensityMax - params.hotspotIntensityMin),
    });
  }
}

// ── Step 1b: Generate geological seed points ──
function step1b_generateGeoSeeds(seed, rng) {
  // Collect boundary cells by interaction type
  const collisionCells = [];
  const subductionCells = [];
  const riftCells = [];

  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    if (c.boundaryDistance !== 0) continue;
    if (c.boundaryType === 'collision') collisionCells.push(c);
    else if (c.boundaryType === 'subduction') subductionCells.push(c);
    else if (c.boundaryType === 'rift') riftCells.push(c);
  }

  const mountainSeeds = [];
  const arcSeeds = [];
  const riftSeeds = [];

  // Place mountain seeds along collision boundaries
  shuffleArray(collisionCells, rng);
  const MTN_MIN_SPACING = 0.15; // 3D sphere units (~12 cells at equator)
  for (const c of collisionCells) {
    let tooClose = false;
    for (const s of mountainSeeds) {
      if (dist3D(spherePos[c.x][c.y], spherePos[s.x][s.y]) < MTN_MIN_SPACING) {
        tooClose = true; break;
      }
    }
    if (!tooClose) {
      const offsetX = (rng() - 0.5) * 6;
      const offsetY = (rng() - 0.5) * 6;
      const sx = wrapX(Math.round(c.x + offsetX));
      const sy = clamp(Math.round(c.y + offsetY), 0, H - 1);

      // Compute local boundary direction from nearby collision cells
      let boundaryDir = null;
      const searchRad = 12;
      const nearbyCells = [];
      for (const bc of collisionCells) {
        const dd = wrappedDistSq(sx, sy, bc.x, bc.y);
        if (dd > 0 && dd < searchRad * searchRad) nearbyCells.push(bc);
      }
      if (nearbyCells.length >= 2) {
        let bestPair = null, bestDist = 0;
        for (let i = 0; i < nearbyCells.length; i++) {
          for (let j = i + 1; j < nearbyCells.length; j++) {
            const d = dist3D(spherePos[nearbyCells[i].x][nearbyCells[i].y],
                             spherePos[nearbyCells[j].x][nearbyCells[j].y]);
            if (d > bestDist) {
              bestDist = d;
              bestPair = [nearbyCells[i], nearbyCells[j]];
            }
          }
        }
        const p1 = spherePos[bestPair[0].x][bestPair[0].y];
        const p2 = spherePos[bestPair[1].x][bestPair[1].y];
        const bdx = p2.x - p1.x, bdy = p2.y - p1.y, bdz = p2.z - p1.z;
        const blen = Math.sqrt(bdx*bdx + bdy*bdy + bdz*bdz) || 1;
        boundaryDir = { x: bdx/blen, y: bdy/blen, z: bdz/blen };
      }

      mountainSeeds.push({
        x: sx,
        y: sy,
        height: params.collisionHeight * (0.35 + rng() * 0.65),
        radius: (7 + rng() * 7) * CELL_TO_3D,   // 3D radius
        convergence: c.boundaryStrength,
        boundaryDir: boundaryDir,
      });
    }
  }

  // Place volcanic arc chains along subduction boundaries
  shuffleArray(subductionCells, rng);
  const ARC_MIN_SPACING = 0.17; // 3D sphere units (~14 cells at equator)
  const arcChainParents = []; // track parent positions for spacing check
  for (const c of subductionCells) {
    let tooClose = false;
    for (const s of arcChainParents) {
      if (dist3D(spherePos[c.x][c.y], spherePos[s.x][s.y]) < ARC_MIN_SPACING) {
        tooClose = true; break;
      }
    }
    if (tooClose) continue;

    // Register this parent position for spacing
    arcChainParents.push({ x: c.x, y: c.y });

    // Determine boundary type: oceanic-oceanic vs continental-oceanic
    const plateA = plates[c.plateId];
    const plateB = plates[c.secondPlateId];
    const isOceanicArc = plateA.type === 'oceanic' && plateB.type === 'oceanic';

    // Oceanic arcs: longer chains, tighter spacing
    // Continental arcs: shorter chains, wider spacing
    const minPeaks = isOceanicArc
      ? Math.max(params.arcChainMinPeaks, Math.ceil(params.arcChainMinPeaks * 1.25))
      : Math.max(2, params.arcChainMinPeaks - 1);
    const maxPeaks = isOceanicArc
      ? params.arcChainMaxPeaks
      : Math.max(minPeaks, params.arcChainMaxPeaks - 2);
    const chainSpacing = isOceanicArc
      ? Math.max(2, params.arcChainSpacing - 1)
      : params.arcChainSpacing + 1;

    const numPeaks = minPeaks + Math.floor(rng() * (maxPeaks - minPeaks + 1));

    // Determine local boundary direction from nearby subduction cells
    const searchRadius = 15;
    const nearbyBoundary = [];
    for (const sc of subductionCells) {
      const dd = wrappedDistSq(c.x, c.y, sc.x, sc.y);
      if (dd > 0 && dd < searchRadius * searchRadius) {
        nearbyBoundary.push(sc);
      }
    }

    // Fit a direction vector to the nearby boundary cells
    let dirX = 0, dirY = 0;
    if (nearbyBoundary.length >= 2) {
      // Use principal component: accumulate offsets from center
      for (const nc of nearbyBoundary) {
        let dx = nc.x - c.x;
        if (dx > W / 2) dx -= W;
        if (dx < -W / 2) dx += W;
        const dy = nc.y - c.y;
        dirX += dx;
        dirY += dy;
      }
      // Use the dominant direction (first principal component approximation)
      // Try covariance approach for better fit
      let cxx = 0, cxy = 0, cyy = 0;
      for (const nc of nearbyBoundary) {
        let dx = nc.x - c.x;
        if (dx > W / 2) dx -= W;
        if (dx < -W / 2) dx += W;
        const dy = nc.y - c.y;
        cxx += dx * dx;
        cxy += dx * dy;
        cyy += dy * dy;
      }
      // Eigenvector of largest eigenvalue of [[cxx,cxy],[cxy,cyy]]
      const trace = cxx + cyy;
      const det = cxx * cyy - cxy * cxy;
      const eigenval = trace / 2 + Math.sqrt(Math.max(0, trace * trace / 4 - det));
      dirX = cxy;
      dirY = eigenval - cxx;
      if (Math.abs(dirX) < 0.001 && Math.abs(dirY) < 0.001) {
        dirX = 1; dirY = 0;
      }
    } else {
      // Fallback: random direction
      const angle = rng() * Math.PI * 2;
      dirX = Math.cos(angle);
      dirY = Math.sin(angle);
    }

    // Normalize direction
    const dirLen = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
    dirX /= dirLen;
    dirY /= dirLen;

    // Compute 3D boundary direction for arc chain from nearby subduction cells
    let arcBoundaryDir = null;
    if (nearbyBoundary.length >= 2) {
      let bestPairA = null, bestDistA = 0;
      for (let i = 0; i < nearbyBoundary.length; i++) {
        for (let j = i + 1; j < nearbyBoundary.length; j++) {
          const d = dist3D(spherePos[nearbyBoundary[i].x][nearbyBoundary[i].y],
                           spherePos[nearbyBoundary[j].x][nearbyBoundary[j].y]);
          if (d > bestDistA) {
            bestDistA = d;
            bestPairA = [nearbyBoundary[i], nearbyBoundary[j]];
          }
        }
      }
      const p1a = spherePos[bestPairA[0].x][bestPairA[0].y];
      const p2a = spherePos[bestPairA[1].x][bestPairA[1].y];
      const bdxa = p2a.x - p1a.x, bdya = p2a.y - p1a.y, bdza = p2a.z - p1a.z;
      const blena = Math.sqrt(bdxa*bdxa + bdya*bdya + bdza*bdza) || 1;
      arcBoundaryDir = { x: bdxa/blena, y: bdya/blena, z: bdza/blena };
    }

    // Perpendicular direction for jitter
    const perpX = -dirY;
    const perpY = dirX;

    // Parent height for this chain
    const parentHeight = params.arcHeight * (0.5 + rng() * 0.5);

    // Generate sub-peaks centered on this position along the boundary direction
    const halfChain = (numPeaks - 1) / 2;
    for (let p = 0; p < numPeaks; p++) {
      const alongOffset = (p - halfChain) * chainSpacing;
      const jitter = (rng() - 0.5) * 2 * params.arcChainJitter;

      const peakX = wrapX(Math.round(c.x + dirX * alongOffset + perpX * jitter));
      const peakY = clamp(Math.round(c.y + dirY * alongOffset + perpY * jitter), 0, H - 1);

      const peakHeight = parentHeight * (0.5 + rng() * 0.5);
      const peakRadius = (params.arcSubPeakRadiusMin + rng() * (params.arcSubPeakRadiusMax - params.arcSubPeakRadiusMin)) * CELL_TO_3D;

      arcSeeds.push({
        x: peakX,
        y: peakY,
        height: peakHeight,
        radius: peakRadius,
        convergence: c.boundaryStrength,
        boundaryDir: arcBoundaryDir,
      });
    }
  }

  // Place rift seeds along rift boundaries
  shuffleArray(riftCells, rng);
  const RIFT_MIN_SPACING = 0.20; // 3D sphere units (~16 cells at equator)
  for (const c of riftCells) {
    let tooClose = false;
    for (const s of riftSeeds) {
      if (dist3D(spherePos[c.x][c.y], spherePos[s.x][s.y]) < RIFT_MIN_SPACING) {
        tooClose = true; break;
      }
    }
    if (!tooClose) {
      const offsetX = (rng() - 0.5) * 4;
      const offsetY = (rng() - 0.5) * 4;
      riftSeeds.push({
        x: wrapX(Math.round(c.x + offsetX)),
        y: clamp(Math.round(c.y + offsetY), 0, H - 1),
        depth: 0.04 + rng() * 0.06,
        radius: (6 + rng() * 5) * CELL_TO_3D,  // 3D radius
      });
    }
  }

  // Build spatial grids for fast lookup
  geoSeeds = {
    mountains: mountainSeeds,
    arcs: arcSeeds,
    rifts: riftSeeds,
    mountainGrid: buildSeedGrid(mountainSeeds),
    arcGrid: buildSeedGrid(arcSeeds),
    riftGrid: buildSeedGrid(riftSeeds),
  };
}

function shuffleArray(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Step 2: Elevation ──
// Compute effective distance with elliptical + angular noise falloff
function computeEffectiveDist(pos, seedObj) {
    const seedPos = spherePos[seedObj.x][seedObj.y];
    const dx = pos.x - seedPos.x;
    const dy = pos.y - seedPos.y;
    const dz = pos.z - seedPos.z;
    const rawDist = Math.sqrt(dx*dx + dy*dy + dz*dz);

    if (rawDist < 0.0001 || !seedObj.boundaryDir) {
        // No boundary direction (hotspot) or at the peak center — use raw distance
        return rawDist;
    }

    const bd = seedObj.boundaryDir;

    // Decompose displacement into parallel (along boundary) and perpendicular components
    const parallel = dx * bd.x + dy * bd.y + dz * bd.z;
    const perpSq = rawDist * rawDist - parallel * parallel;
    const perp = Math.sqrt(Math.max(0, perpSq));

    // Elliptical distance: shrink the parallel component by aspect ratio
    // This makes the peak wider along the boundary direction
    const aspect = params.peakAspectRatio;
    const ellipticalDist = Math.sqrt((parallel / aspect) * (parallel / aspect) + perp * perp);

    // Angular noise: modulate the effective radius based on angle around the peak
    // This creates irregular coastlines where the peak intersects sea level
    const angle = Math.atan2(parallel, perp);
    const noiseInput = angle * params.peakAngularFreq + seedObj.x * 7.31 + seedObj.y * 13.17;
    const angularMod = 1.0 + Math.sin(noiseInput) * params.peakAngularNoise
                           + Math.sin(noiseInput * 1.7 + 3.0) * params.peakAngularNoise * 0.5;

    // Return modulated elliptical distance
    // Dividing distance by angularMod means where angularMod > 1, the peak extends further out
    // and where angularMod < 1, it pulls inward — creating bays and headlands
    return ellipticalDist / angularMod;
}

function step2_computeElevation(seed, rng) {
  // Expand search radii by aspect ratio so elongated seeds are found
  const MAX_MTN_RADIUS = 0.25 * params.peakAspectRatio;   // 3D units, expanded for elongation
  const MAX_ARC_RADIUS = 0.18 * params.peakAspectRatio;   // 3D units, expanded for elongation
  const MAX_RIFT_RADIUS = 0.18;  // 3D units (~15 cells at equator) — rifts unchanged
  const HOTSPOT_RADIUS = 0.18;   // 3D units (~15 cells at equator) — hotspots unchanged

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = cells[y * W + x];
      const pos = spherePos[x][y];

      const noise1 = sphereNoise(pos, seed + 500, 2, 0.015);

      // Base elevation — blended near plate boundaries for smooth continental shelves
      const plate1 = plates[c.plateId];
      const plate2 = plates[c.secondPlateId];
      const noiseAmp = params.continentalNoise;
      const baseElev1 = (plate1.type === 'continental' ? params.continentalBase : params.oceanicBase) + noise1 * noiseAmp;
      const baseElev2 = (plate2.type === 'continental' ? params.continentalBase : params.oceanicBase) + noise1 * noiseAmp;

      const edgeRatio = (c.secondDist - c.nearestDist) / (c.secondDist + c.nearestDist);
      const blendSteepness = 120 / params.blendWidth;
      const blend = 1 / (1 + Math.exp(-edgeRatio * blendSteepness));

      let elevation = baseElev2 + (baseElev1 - baseElev2) * blend;

      c.blend = blend;
      const proximity = 1 - blend;  // 0.5 at boundary, ~0 deep inside
      c.proximity = proximity;

      if (proximity > 0.01) {
        const pA3 = spherePos[plate1.center.x][plate1.center.y];
        const pB3 = spherePos[plate2.center.x][plate2.center.y];
        const bnx3 = pB3.x - pA3.x, bny3 = pB3.y - pA3.y, bnz3 = pB3.z - pA3.z;
        const bnLen = Math.sqrt(bnx3*bnx3 + bny3*bny3 + bnz3*bnz3) || 1;
        const dA3 = driftTo3D(plate1.center.x, plate1.center.y, plate1.drift.angle, plate1.drift.speed);
        const dB3 = driftTo3D(plate2.center.x, plate2.center.y, plate2.drift.angle, plate2.drift.speed);
        const driftA = (dA3.x * bnx3 + dA3.y * bny3 + dA3.z * bnz3) / bnLen;
        const driftB = (dB3.x * bnx3 + dB3.y * bny3 + dB3.z * bnz3) / bnLen;
        c.convergence = (driftA - driftB) / 3;
      } else {
        c.convergence = 0;
      }

      // Mountain seeds (collision zones) — elliptical + angular noise falloff
      const nearbyMtns = queryNearbySeeds(geoSeeds.mountainGrid, x, y, MAX_MTN_RADIUS);
      for (const { seed: mtn } of nearbyMtns) {
        const r = mtn.radius;
        const dist = computeEffectiveDist(pos, mtn);
        if (dist < r) {
          const falloff = Math.exp(-(dist * dist) / (r * r * 0.4));
          const localNoise = sphereNoise(pos, seed + 999, 2, params.mountainNoiseScale);
          const noiseMod = clamp(0.5 + localNoise * 0.6, 0.1, 1.0);
          elevation += mtn.height * mtn.convergence * falloff * noiseMod;
        }
      }

      // Volcanic arc seeds (subduction zones) — elliptical + angular noise falloff
      const nearbyArcs = queryNearbySeeds(geoSeeds.arcGrid, x, y, MAX_ARC_RADIUS);
      for (const { seed: arc } of nearbyArcs) {
        const r = arc.radius;
        const dist = computeEffectiveDist(pos, arc);
        if (dist < r) {
          const falloff = Math.exp(-(dist * dist) / (r * r * 0.4));
          const localNoise = sphereNoise(pos, seed + 777, 2, params.arcNoiseScale);
          const noiseMod = clamp(0.4 + localNoise * 0.7, 0.05, 1.0);
          elevation += arc.height * arc.convergence * falloff * noiseMod;
        }
      }

      // Rift seeds (continental rift zones) — depressions, unchanged radial falloff
      const nearbyRifts = queryNearbySeeds(geoSeeds.riftGrid, x, y, MAX_RIFT_RADIUS);
      for (const { seed: rift, dist } of nearbyRifts) {
        const r = rift.radius;
        if (dist < r) {
          const falloff = Math.exp(-(dist * dist) / (r * r * 0.4));
          const localNoise = sphereNoise(pos, seed + 888, 2, 0.05);
          const noiseMod = clamp(0.3 + localNoise * 0.5, 0.1, 1.0);
          elevation -= rift.depth * falloff * noiseMod;
        }
      }

      // Hotspot modifier — unchanged radial falloff (hotspots are roughly radial)
      for (const hs of hotspots) {
        const hsDist = dist3D(pos, spherePos[hs.x][hs.y]);
        if (hsDist < HOTSPOT_RADIUS) {
          elevation += hs.intensity * 0.35 * Math.max(0, 1 - hsDist / HOTSPOT_RADIUS);
        }
      }

      // Fractal noise — no suppression needed with off-axis noise sampling
      elevation += sphereNoise(pos, seed, params.fractalOctaves, params.fractalScale) * params.fractalAmp;

      c.elevation = elevation;
      c.isLand = elevation > 0.0;
      c.isShallowWater = elevation > -0.08 && elevation <= 0.0;
      c.isDeepWater = elevation <= -0.08;
    }
  }
}

// ── Step 3: Minerals ──
function step3_computeMinerals(seed, rng) {
  const MAX_MTN_RADIUS = 0.25;   // 3D units
  const MAX_ARC_RADIUS = 0.18;   // 3D units
  const HOTSPOT_VOLC_RADIUS = 0.15;  // 3D units (~12 cells at equator)
  const HOTSPOT_CENTER_RADIUS = 0.037; // 3D units (~3 cells at equator)

  // 3a. Base chemistry — blend between nearest and second-nearest plate
  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    const plate1 = plates[c.plateId];
    const plate2 = plates[c.secondPlateId];
    const b = c.blend; // 0.5 at boundary, ~1.0 deep inside plate1

    c.minerals.iron = (plate1.baseRock.iron * b + plate2.baseRock.iron * (1 - b)) * 0.3;
    c.minerals.copper = (plate1.baseRock.copper * b + plate2.baseRock.copper * (1 - b)) * 0.3;
    c.minerals.manganese = (plate1.baseRock.manganese * b + plate2.baseRock.manganese * (1 - b)) * 0.3;
  }

  // 3b. Volcanic concentration — use seed points, not proximity trace
  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    let volcanism = 0;

    const nearbyMtns = queryNearbySeeds(geoSeeds.mountainGrid, c.x, c.y, MAX_MTN_RADIUS);
    for (const { seed: mtn, dist } of nearbyMtns) {
      const r = mtn.radius;
      if (dist < r) {
        const falloff = Math.exp(-(dist * dist) / (r * r * 0.5));
        volcanism += mtn.convergence * mtn.height * falloff;
      }
    }

    const nearbyArcs = queryNearbySeeds(geoSeeds.arcGrid, c.x, c.y, MAX_ARC_RADIUS);
    for (const { seed: arc, dist } of nearbyArcs) {
      const r = arc.radius;
      if (dist < r) {
        const falloff = Math.exp(-(dist * dist) / (r * r * 0.5));
        volcanism += arc.convergence * arc.height * falloff;
      }
    }

    for (const hs of hotspots) {
      const hsDist = dist3D(spherePos[c.x][c.y], spherePos[hs.x][hs.y]);
      if (hsDist < HOTSPOT_VOLC_RADIUS) volcanism += hs.intensity * Math.max(0, 1 - hsDist / HOTSPOT_VOLC_RADIUS);
    }

    volcanism = clamp(volcanism, 0, 1.0);
    c.volcanism = volcanism;

    c.minerals.iron += volcanism * 0.55;
    c.minerals.copper += volcanism * 0.35;
    c.minerals.manganese += volcanism * 0.3;

    for (const hs of hotspots) {
      const hsDist = dist3D(spherePos[c.x][c.y], spherePos[hs.x][hs.y]);
      if (hsDist < HOTSPOT_CENTER_RADIUS) {
        const centerBoost = (1 - hsDist / HOTSPOT_CENTER_RADIUS) * 0.4;
        c.minerals.iron      = Math.max(c.minerals.iron, centerBoost * hs.intensity);
        c.minerals.manganese = Math.max(c.minerals.manganese, centerBoost * hs.intensity * 0.8);
        c.minerals.copper    = Math.max(c.minerals.copper, centerBoost * hs.intensity * 0.5);
      }
    }
  }

  // 3c. Erosion transport — 8-directional, multi-target distribution
  for (let pass = 0; pass < params.erosionPasses; pass++) {
    const snapIron = new Float32Array(TOTAL);
    const snapCopper = new Float32Array(TOTAL);
    const snapManganese = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) {
      snapIron[i] = cells[i].minerals.iron;
      snapCopper[i] = cells[i].minerals.copper;
      snapManganese[i] = cells[i].minerals.manganese;
    }

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const c = cells[ci];
        const elev = c.elevation;

        const neighbors = [
          { nx: wrapX(x - 1), ny: y },
          { nx: wrapX(x + 1), ny: y },
          { nx: x,            ny: y - 1 },
          { nx: x,            ny: y + 1 },
          { nx: wrapX(x - 1), ny: y - 1 },
          { nx: wrapX(x + 1), ny: y - 1 },
          { nx: wrapX(x - 1), ny: y + 1 },
          { nx: wrapX(x + 1), ny: y + 1 },
        ];

        let totalDiff = 0;
        const lowerNeighbors = [];
        for (const n of neighbors) {
          if (n.ny < 0 || n.ny >= H) continue;
          const ni = n.ny * W + n.nx;
          const nElev = cells[ni].elevation;
          if (nElev < elev) {
            const diff = elev - nElev;
            lowerNeighbors.push({ idx: ni, diff });
            totalDiff += diff;
          }
        }

        if (totalDiff > 0) {
          const transferRate = params.erosionRate;
          for (const n of lowerNeighbors) {
            const fraction = (n.diff / totalDiff) * transferRate;
            cells[n.idx].minerals.iron      += snapIron[ci] * fraction;
            cells[n.idx].minerals.copper    += snapCopper[ci] * fraction;
            cells[n.idx].minerals.manganese += snapManganese[ci] * fraction;
          }
          c.minerals.iron      -= snapIron[ci] * transferRate;
          c.minerals.copper    -= snapCopper[ci] * transferRate;
          c.minerals.manganese -= snapManganese[ci] * transferRate;
        }
      }
    }
  }

  // 3d. Marine sedimentation
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].isDeepWater) cells[i].minerals.manganese += 0.08;
  }

  // 3e. Clamp and totals
  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    c.minerals.iron = clamp(c.minerals.iron, 0, 1);
    c.minerals.copper = clamp(c.minerals.copper, 0, 1);
    c.minerals.manganese = clamp(c.minerals.manganese, 0, 1);
    c.mineralTotal = c.minerals.iron + c.minerals.copper + c.minerals.manganese;
    c.isDepleted = c.mineralTotal < 0.15;
    c.dominant = maxKey(c.minerals);
  }
}

// ── Step 4: Hydrological System ──
function step4_computeAtmosphere(seed, rng) {
  const statusEl = document.getElementById('statusText');

  // ── Step 4a: Wind Vector Field ──
  statusEl.textContent = 'Generating wind field…';

  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  for (let y = 0; y < H; y++) {
    const lat = (y / H) * 180 - 90;
    const absLat = Math.abs(lat);

    let u = 0, vMag = 0, spd = 0;

    const itcz = params.itczWidth;
    const tradeEnd = params.tradeEndLat;
    const subEnd = params.subtropicalEndLat;
    const westEnd = params.westerlyEndLat;
    const tradeSpd = params.tradeWindSpeed;
    const westSpd = params.westerlyWindSpeed;

    if (absLat < itcz) {
      u = 0; vMag = 0.3; spd = 0.3;
    } else if (absLat < itcz + 5) {
      const t = smoothstep(itcz, itcz + 5, absLat);
      u = -tradeSpd * t;
      vMag = 0.3 + (tradeSpd * 0.3 - 0.3) * t;
      spd = 0.3 + (tradeSpd - 0.3) * t;
    } else if (absLat < tradeEnd) {
      u = -tradeSpd; vMag = tradeSpd * 0.3; spd = tradeSpd;
    } else if (absLat < tradeEnd + 5) {
      const t = smoothstep(tradeEnd, tradeEnd + 5, absLat);
      u = -tradeSpd * (1 - t);
      vMag = tradeSpd * 0.3 * (1 - t) + 0.15 * t;
      spd = tradeSpd + (0.5 - tradeSpd) * t;
    } else if (absLat < subEnd) {
      u = 0; vMag = 0.15; spd = 0.5;
    } else if (absLat < subEnd + 5) {
      const t = smoothstep(subEnd, subEnd + 5, absLat);
      u = westSpd * t;
      vMag = 0.15 + (westSpd * 0.15 - 0.15) * t;
      spd = 0.5 + (westSpd - 0.5) * t;
    } else if (absLat < westEnd) {
      u = westSpd; vMag = westSpd * 0.15; spd = westSpd;
    } else if (absLat < westEnd + 5) {
      const t = smoothstep(westEnd, westEnd + 5, absLat);
      u = westSpd * (1 - t) + (-0.4) * t;
      vMag = westSpd * 0.15 * (1 - t) + 0.12 * t;
      spd = westSpd + (0.4 - westSpd) * t;
    } else {
      u = -0.4; vMag = 0.12; spd = 0.4;
    }

    for (let x = 0; x < W; x++) {
      const c = cells[y * W + x];
      c.windU = u;

      let v = 0;
      if (absLat < itcz) {
        v = lat > 0 ? -vMag : vMag;
      } else if (absLat < tradeEnd + 5) {
        v = lat > 0 ? -vMag : vMag;
      } else if (absLat < subEnd) {
        v = lat > 0 ? vMag : -vMag;
      } else if (absLat < westEnd + 5) {
        v = lat > 0 ? vMag : -vMag;
      } else {
        v = lat > 0 ? -vMag : vMag;
      }

      c.windV = v;
      c.windSpeed = spd;
    }
  }

  // Topographic deflection (iterative passes)
  for (let pass = 0; pass < params.windDeflectionPasses; pass++) {
    const snapU = new Float32Array(TOTAL);
    const snapV = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) {
      snapU[i] = cells[i].windU;
      snapV[i] = cells[i].windV;
    }

    for (let y = 1; y < H - 1; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const c = cells[ci];
        if (!c.isLand) continue;

        const xp = wrapX(x + 1), xm = wrapX(x - 1);
        const gradX = (cells[y * W + xp].elevation - cells[y * W + xm].elevation) / 2;
        const gradY = (cells[(y + 1) * W + x].elevation - cells[(y - 1) * W + x].elevation) / 2;
        const gradMag = Math.sqrt(gradX * gradX + gradY * gradY);
        if (gradMag < 0.001) continue;

        const wU = snapU[ci], wV = snapV[ci];
        const dotWG = wU * gradX + wV * gradY;
        const uphill = dotWG / gradMag;
        if (uphill <= 0) continue;

        const block = clamp(uphill * gradMag * params.windBlockingStrength, 0, 0.85);
        const dotGG = gradX * gradX + gradY * gradY;
        const projFactor = dotWG / dotGG;
        const windAlongGradU = projFactor * gradX;
        const windAlongGradV = projFactor * gradY;

        c.windU -= windAlongGradU * block;
        c.windV -= windAlongGradV * block;

        c.windU += (-gradY) * block * params.windDeflectionFactor;
        c.windV += gradX * block * params.windDeflectionFactor;
      }
    }

    for (let i = 0; i < TOTAL; i++) {
      cells[i].windSpeed = Math.sqrt(cells[i].windU * cells[i].windU + cells[i].windV * cells[i].windV);
    }
  }

  // ── Step 4b: Ocean Currents ──
  statusEl.textContent = 'Computing ocean currents…';

  const numCurrentIter = Math.round(params.currentIterations);
  for (let iter = 0; iter < numCurrentIter; iter++) {
    const snapCU = new Float32Array(TOTAL);
    const snapCV = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) {
      snapCU[i] = cells[i].currentU;
      snapCV[i] = cells[i].currentV;
    }

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const c = cells[ci];
        if (c.isLand) continue;

        c.currentU += c.windU * params.currentStressCoeff;
        c.currentV += c.windV * params.currentStressCoeff;

        const lat = (y / H) * 180 - 90;
        const latRad = lat * Math.PI / 180;
        const f = Math.sin(latRad);
        const angle = f * params.currentCoriolisStrength;
        const cosA = Math.cos(angle), sinA = Math.sin(angle);
        const newU = c.currentU * cosA - c.currentV * sinA;
        const newV = c.currentU * sinA + c.currentV * cosA;
        c.currentU = newU;
        c.currentV = newV;

        const dx4 = [1, -1, 0, 0];
        const dy4 = [0, 0, -1, 1];
        for (let d = 0; d < 4; d++) {
          const nx = wrapX(x + dx4[d]);
          const ny = y + dy4[d];
          if (ny < 0 || ny >= H) continue;
          const ni = ny * W + nx;
          if (cells[ni].isLand) {
            const ldx = dx4[d], ldy = dy4[d];
            const towardLand = c.currentU * ldx + c.currentV * ldy;
            if (towardLand > 0) {
              c.currentU -= towardLand * ldx;
              c.currentV -= towardLand * ldy;
              c.currentU += (-ldy) * towardLand * 0.5;
              c.currentV += ldx * towardLand * 0.5;
            }
          }
        }

        const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
        const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];
        let totalInflowU = 0, totalInflowV = 0;
        for (let d = 0; d < 8; d++) {
          const nx = wrapX(x + dx8[d]);
          const ny = y + dy8[d];
          if (ny < 0 || ny >= H) continue;
          const ni = ny * W + nx;
          if (cells[ni].isLand) continue;
          const tdx = -dx8[d], tdy = -dy8[d];
          const tLen = Math.sqrt(tdx * tdx + tdy * tdy);
          const dot = (snapCU[ni] * tdx + snapCV[ni] * tdy) / tLen;
          if (dot > 0) {
            const weight = dot / (Math.abs(dot) + 0.5);
            totalInflowU += snapCU[ni] * weight;
            totalInflowV += snapCV[ni] * weight;
          }
        }
        const inflowMag = Math.sqrt(totalInflowU * totalInflowU + totalInflowV * totalInflowV);
        if (inflowMag > params.currentAdvectionRate) {
          const scale = params.currentAdvectionRate / inflowMag;
          totalInflowU *= scale;
          totalInflowV *= scale;
        }
        c.currentU += totalInflowU;
        c.currentV += totalInflowV;

        c.currentU *= (1.0 - params.currentFriction);
        c.currentV *= (1.0 - params.currentFriction);

        const speed = Math.sqrt(c.currentU * c.currentU + c.currentV * c.currentV);
        if (speed > params.maxCurrentSpeed) {
          c.currentU *= params.maxCurrentSpeed / speed;
          c.currentV *= params.maxCurrentSpeed / speed;
        }
      }
    }
  }

  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    c.currentSpeed = Math.sqrt(c.currentU * c.currentU + c.currentV * c.currentV);
  }

  for (let y = 0; y < H; y++) {
    const lat = (y / H) * 180 - 90;
    const absLat = Math.abs(lat);
    const baseSst = 1.0 - (absLat / 90) * 0.6;
    for (let x = 0; x < W; x++) {
      const c = cells[y * W + x];
      if (!c.isLand) {
        c.sst = baseSst;
      }
    }
  }

  const numSstIter = Math.round(params.sstAdvectionIterations);
  for (let iter = 0; iter < numSstIter; iter++) {
    const snapSST = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) snapSST[i] = cells[i].sst;

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const c = cells[ci];
        if (c.isLand) continue;

        const srcX = x - Math.round(clamp(c.currentU * 2, -2, 2));
        const srcY = y - Math.round(clamp(c.currentV * 2, -2, 2));
        const wsx = wrapX(srcX);
        const wsy = clamp(srcY, 0, H - 1);
        const si = wsy * W + wsx;
        if (!cells[si].isLand) {
          c.sst += (snapSST[si] - c.sst) * params.sstMixRate;
        }
      }
    }
  }

  for (let y = 1; y < H - 1; y++) {
    for (let x = 0; x < W; x++) {
      const ci = y * W + x;
      const c = cells[ci];
      if (c.isLand) continue;

      const lat = (y / H) * 180 - 90;
      const dx4 = [1, -1, 0, 0];
      const dy4 = [0, 0, -1, 1];
      let isCoastal = false;
      for (let d = 0; d < 4; d++) {
        const nx = wrapX(x + dx4[d]);
        const ny = y + dy4[d];
        if (ny >= 0 && ny < H && cells[ny * W + nx].isLand) {
          isCoastal = true;
          const ekmanU = lat > 0 ? c.windV : -c.windV;
          const ekmanV = lat > 0 ? -c.windU : c.windU;
          const awayDot = ekmanU * dx4[d] + ekmanV * dy4[d];
          if (awayDot < -0.1) {
            c.sst -= params.upwellingCooling * Math.min(1, Math.abs(awayDot));
            c.sst = Math.max(0.15, c.sst);
          }
        }
      }
    }
  }

  for (let i = 0; i < TOTAL; i++) {
    if (!cells[i].isLand) {
      cells[i].sst = Math.max(cells[i].sst, params.sstFloor);
    }
  }

  // ── Step 4c: Moisture Advection & Precipitation ──
  statusEl.textContent = 'Running precipitation model…';

  const moisture = new Float32Array(TOTAL);
  const precipAccum = new Float32Array(TOTAL);

  let maxWindSpeed = 0.01;
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].windSpeed > maxWindSpeed) maxWindSpeed = cells[i].windSpeed;
  }

  const numMoistIter = Math.round(params.moistureIterations);
  for (let iter = 0; iter < numMoistIter; iter++) {
    const snap = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) snap[i] = moisture[i];

    for (let i = 0; i < TOTAL; i++) {
      const c = cells[i];
      if (!c.isLand) {
        const thermalEvap = c.sst * c.sst * params.thermalEvapFactor * params.atmosphericPressure;
        const windEvap = (c.windSpeed / maxWindSpeed) * c.sst * params.windEvapFactor * params.atmosphericPressure;
        let evapRate = thermalEvap + windEvap;
        if (evapRate <= 0) {
          evapRate = 0.05;
        }
        moisture[i] += evapRate;
      }
    }

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
        const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];
        let incoming = 0;

        for (let d = 0; d < 8; d++) {
          const nx = wrapX(x + dx8[d]);
          const ny = y + dy8[d];
          if (ny < 0 || ny >= H) continue;
          const ni = ny * W + nx;
          const nc = cells[ni];
          const tdx = -dx8[d], tdy = -dy8[d];
          const tLen = Math.sqrt(tdx * tdx + tdy * tdy);
          const dot = (nc.windU * tdx + nc.windV * tdy) / tLen;
          if (dot > 0) {
            const transfer = snap[ni] * dot * nc.windSpeed * 0.12;
            incoming += transfer;
          }
        }

        moisture[ci] += incoming;
      }
    }

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const c = cells[ci];
        const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
        const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];
        let totalOut = 0;
        for (let d = 0; d < 8; d++) {
          const nx = wrapX(x + dx8[d]);
          const ny = y + dy8[d];
          if (ny < 0 || ny >= H) continue;
          const tdx = dx8[d], tdy = dy8[d];
          const tLen = Math.sqrt(tdx * tdx + tdy * tdy);
          const dot = (c.windU * tdx + c.windV * tdy) / tLen;
          if (dot > 0) {
            totalOut += dot * c.windSpeed * 0.12;
          }
        }
        const outRate = Math.min(totalOut, 0.9);
        moisture[ci] -= snap[ci] * outRate;
        if (moisture[ci] < 0) moisture[ci] = 0;
      }
    }

    for (let y = 1; y < H - 1; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const c = cells[ci];
        if (moisture[ci] <= 0) continue;

        let oroPrecip = 0;
        let convPrecip = 0;

        // Orographic and convective precipitation — LAND ONLY
        if (c.isLand) {
          const xp = wrapX(x + 1), xm = wrapX(x - 1);
          const gradX = (cells[y * W + xp].elevation - cells[y * W + xm].elevation) / 2;
          const gradY = (cells[(y + 1) * W + x].elevation - cells[(y - 1) * W + x].elevation) / 2;

          const uplift = c.windU * gradX + c.windV * gradY;
          if (uplift > 0) {
            const effectiveOroFactor = params.oroFactor / params.atmosphericPressure;
            oroPrecip = moisture[ci] * uplift * effectiveOroFactor;
          }

          const divU = (cells[y * W + xp].windU - cells[y * W + xm].windU) / 2;
          const divV = (cells[(y + 1) * W + x].windV - cells[(y - 1) * W + x].windV) / 2;
          const div = divU + divV;
          if (div < 0) {
            const effectiveConvFactor = params.convFactor / params.atmosphericPressure;
            convPrecip = moisture[ci] * (-div) * effectiveConvFactor;
          }
        }

        // Background precipitation — EVERYWHERE (land and ocean)
        // On a humid planet, it rains everywhere. This is the primary
        // moisture drain that keeps the atmosphere in equilibrium.
        const bgPrecip = moisture[ci] * params.bgPrecipRate;

        const totalPrecip = Math.min(oroPrecip + convPrecip + bgPrecip, moisture[ci] * 0.8);
        moisture[ci] -= totalPrecip;

        // Only accumulate precipitation stats on land (we care about land rainfall for flora)
        if (c.isLand) {
          precipAccum[ci] += totalPrecip;
        }
      }
    }

    const diffSnap = new Float32Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) diffSnap[i] = moisture[i];
    for (let y = 1; y < H - 1; y++) {
      for (let x = 0; x < W; x++) {
        const ci = y * W + x;
        const xp = wrapX(x + 1), xm = wrapX(x - 1);
        const avg = (diffSnap[y * W + xp] + diffSnap[y * W + xm] +
                     diffSnap[(y - 1) * W + x] + diffSnap[(y + 1) * W + x]) / 4;
        moisture[ci] += (avg - moisture[ci]) * params.moistureDiffusion * params.atmosphericPressure;
      }
    }

    for (let i = 0; i < TOTAL; i++) {
      if (cells[i].isLand && precipAccum[i] > 0) {
        moisture[i] += precipAccum[i] * 0.02 * params.atmosphericPressure;
      }
    }
  }

  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].isLand) {
      const elevProxy = 1.0 - Math.min(cells[i].elevation * 5, 1);
      const minMoisture = elevProxy * 0.15 * params.atmosphericPressure;
      if (moisture[i] < minMoisture) moisture[i] = minMoisture;
    }
  }

  // Collect all nonzero land precipitation values
  const landPrecipValues = [];
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].isLand && precipAccum[i] > 0) {
      landPrecipValues.push(precipAccum[i]);
    }
  }

  let precipScale;
  if (landPrecipValues.length > 0) {
    // Sort and use 95th percentile as the reference maximum
    // This prevents a single extreme windward cell from crushing everything
    landPrecipValues.sort((a, b) => a - b);
    const p95Index = Math.floor(landPrecipValues.length * 0.95);
    precipScale = landPrecipValues[p95Index] || 0.001;
  } else {
    precipScale = 0.001;
  }

  for (let i = 0; i < TOTAL; i++) {
    cells[i].precipitation = cells[i].isLand
      ? clamp(precipAccum[i] / precipScale, 0, 1)
      : 0;
    cells[i].atmosphericMoisture = clamp(
      moisture[i] / (precipScale * 0.5 + 0.001), 0, 1
    );
    cells[i].moisture = cells[i].precipitation;
    cells[i].baseMoisture = cells[i].precipitation;
  }

  // ── Step 4d: Groundwater ──
  statusEl.textContent = 'Computing groundwater…';

  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    if (!c.isLand) {
      c.groundwater = 1.0;
      continue;
    }

    const coastalBase = c.elevation < params.coastalThreshold
        ? (1.0 - c.elevation / params.coastalThreshold) * params.coastalGroundwater
        : 0;

    const recharge = c.precipitation * params.groundwaterRecharge;
    const geothermal = c.volcanism * params.groundwaterGeothermal;
    const depthPenalty = Math.max(0, c.elevation - 0.05) * params.groundwaterDepthFactor;

    c.groundwater = clamp(coastalBase + recharge + geothermal - depthPenalty, 0, 1);
  }

  // ── Step 4e: Drainage Accumulation ──
  statusEl.textContent = 'Computing drainage…';

  const landIndices = [];
  for (let i = 0; i < TOTAL; i++) {
    if (cells[i].isLand) landIndices.push(i);
  }
  landIndices.sort((a, b) => cells[b].elevation - cells[a].elevation);

  const flowAccum = new Float32Array(TOTAL);
  for (let i = 0; i < TOTAL; i++) {
    flowAccum[i] = cells[i].isLand ? cells[i].precipitation : 0;
  }

  const dx8 = [-1, 0, 1, -1, 1, -1, 0, 1];
  const dy8 = [-1, -1, -1, 0, 0, 1, 1, 1];
  for (const ci of landIndices) {
    const cx = ci % W;
    const cy = (ci / W) | 0;
    const elev = cells[ci].elevation;

    let lowestIdx = -1, lowestElev = elev;
    for (let d = 0; d < 8; d++) {
      const nx = wrapX(cx + dx8[d]);
      const ny = cy + dy8[d];
      if (ny < 0 || ny >= H) continue;
      const ni = ny * W + nx;
      if (cells[ni].elevation < lowestElev) {
        lowestElev = cells[ni].elevation;
        lowestIdx = ni;
      }
    }
    if (lowestIdx >= 0) {
      flowAccum[lowestIdx] += flowAccum[ci];
    }
  }

  for (let i = 0; i < TOTAL; i++) {
    cells[i].drainage = cells[i].isLand ?
      clamp(Math.log(1 + flowAccum[i]) * params.hydDrainageScale, 0, params.hydDrainageCap) : 0;
  }

  // ── Step 4f: Water Availability ──
  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    if (c.isLand) {
      c.waterAvailability = clamp(
          c.precipitation * 0.7 + c.groundwater * 0.3 + c.drainage,
          0, 1
      );
      const elevPenalty = Math.max(0, c.elevation - 0.05) * 3.0;
      const minWater = Math.max(0, 0.15 - elevPenalty) * params.atmosphericPressure;
      c.waterAvailability = Math.max(c.waterAvailability, minWater);
    } else {
      c.waterAvailability = 1.0;
    }
    c.moisture = c.waterAvailability;
  }

  // Temperature
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ci = y * W + x;
      const c = cells[ci];
      const latFrac = Math.abs(y - 128) / 128;
      const baseTemp = 1.0 - latFrac * 0.4;
      const elevCooling = Math.max(0, c.elevation) * 0.3;
      c.temperature = clamp(baseTemp - elevCooling, 0.4, 1.0);
      c.isFreezing = c.temperature < 0.5;
    }
  }
}

// ── Step 5: Flora ──
function step5_computeFlora() {
  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];
    if (!c.isLand) {
      c.floraType = 'none';
      c.floraDensity = 0;
      continue;
    }
    if (c.isFreezing) {
      c.floraType = 'frozen';
      c.floraDensity = 0;
      continue;
    }

    const light = 1.0;
    const water = c.waterAvailability;
    const photoFitness = light * water * 0.8;
    const chemoFitness = c.mineralTotal * Math.max(water, c.groundwater * 1.5) * 1.2;
    const mixoFitness  = (0.6 + 0.5 * c.mineralTotal) * water;
    const maxFitness = Math.max(photoFitness, chemoFitness, mixoFitness);

    if (maxFitness < 0.02) {
      c.floraType = 'barren';
      c.floraDensity = 0;
    } else if (photoFitness >= chemoFitness && photoFitness >= mixoFitness) {
      c.floraType = 'photosynthetic';
      c.floraDensity = clamp(maxFitness, 0, 1);
    } else if (chemoFitness >= photoFitness && chemoFitness >= mixoFitness) {
      c.floraType = 'chemotrophic';
      c.floraDensity = clamp(maxFitness, 0, 1);
    } else {
      c.floraType = 'mixotrophic';
      c.floraDensity = clamp(maxFitness, 0, 1);
    }
  }
}

// ── Step 5b: Terrain + cover for the low-res planetary grid ──
// Routes through THE canonical deriveTerrainAndCover so the planetary map
// classifies terrain identically to the regional / high-res / tile views.
// The low-res grid doesn't compute the detailed substrate/flora fields those
// grids have, so they're ESTIMATED here from the planetary sim's own fields.
// The same estimates are stashed on the cell so the surface overlay's
// computeTilePalette call sees the exact inputs the derivation used.
function step5b_deriveTerrainType() {
  for (let i = 0; i < TOTAL; i++) {
    const c = cells[i];

    if (!c.isLand) {
      c.terrainType = c.isDeepWater ? 'deep_water' : 'water';
      c.coverType = 'none';
      continue;
    }
    if (c.isFreezing) {
      c.terrainType = 'rock';
      c.coverType = 'none';
      continue;
    }

    // Estimate the physical fields the low-res grid lacks so the canonical
    // function sees inputs comparable to the high-res grid's.
    const grainSize     = clamp(0.25 + c.elevation * 0.6, 0.05, 0.95);
    const saturation    = clamp(c.waterAvailability || 0, 0, 1);
    const groundCover   = c.floraDensity > 0 ? Math.max(0.3, c.floraDensity * 0.8) : 0;
    const canopyDensity = c.floraDensity > 0.2 ? c.floraDensity * 0.7 : 0;
    const chemoCrust    = c.floraType === 'chemotrophic' ? clamp(c.floraDensity * 0.5, 0, 1) : 0;
    const waterTableDepth = clamp((1 - saturation) * (0.3 + c.elevation * 2), 0, 1);
    const isCoastal     = c.elevation > 0 && c.elevation < 0.03;

    const result = deriveTerrainAndCover(
      c.elevation,
      c.isLand,
      grainSize,
      saturation,
      groundCover,
      canopyDensity,
      chemoCrust,
      c.floraType,
      waterTableDepth,
      isCoastal
    );

    c.terrainType = result.terrainType;
    c.coverType   = result.coverType;
    c._estGrainSize   = grainSize;
    c._estSaturation  = saturation;
    c._estGroundCover = groundCover;
    c._estCanopy      = canopyDensity;
    c._estChemoCrust  = chemoCrust;
  }
}

// ── Weather Diagnostic ──
function printWeatherDiagnostic() {
  const bands = [
    { name: 'Polar N (70-90)',       yMin: 0,   yMax: Math.floor(H * 0.11) },
    { name: 'Subpolar N (55-70)',    yMin: Math.floor(H * 0.11), yMax: Math.floor(H * 0.19) },
    { name: 'Westerly N (35-55)',    yMin: Math.floor(H * 0.19), yMax: Math.floor(H * 0.31) },
    { name: 'Subtropical N (28-35)', yMin: Math.floor(H * 0.31), yMax: Math.floor(H * 0.36) },
    { name: 'Trade N (8-28)',        yMin: Math.floor(H * 0.36), yMax: Math.floor(H * 0.46) },
    { name: 'ITCZ (0-8)',           yMin: Math.floor(H * 0.46), yMax: Math.floor(H * 0.54) },
    { name: 'Trade S (8-28)',        yMin: Math.floor(H * 0.54), yMax: Math.floor(H * 0.64) },
    { name: 'Subtropical S (28-35)', yMin: Math.floor(H * 0.64), yMax: Math.floor(H * 0.69) },
    { name: 'Westerly S (35-55)',    yMin: Math.floor(H * 0.69), yMax: Math.floor(H * 0.81) },
    { name: 'Subpolar S (55-70)',    yMin: Math.floor(H * 0.81), yMax: Math.floor(H * 0.89) },
    { name: 'Polar S (70-90)',       yMin: Math.floor(H * 0.89), yMax: H },
  ];

  console.log('=== WEATHER DIAGNOSTIC ===');

  for (const band of bands) {
    const bandCells = [];
    for (let y = band.yMin; y < band.yMax; y++) {
      for (let x = 0; x < W; x++) {
        bandCells.push(cells[y * W + x]);
      }
    }

    const ocean = bandCells.filter(c => !c.isLand);
    const land = bandCells.filter(c => c.isLand);

    const avg = (arr, fn) => arr.length ? arr.reduce((s, c) => s + fn(c), 0) / arr.length : 0;

    const windSpd = avg(bandCells, c => c.windSpeed || 0);
    const windU = avg(bandCells, c => c.windU || 0);
    const windV = avg(bandCells, c => c.windV || 0);
    const sst = avg(ocean, c => c.sst || 0);
    const oceanMoist = avg(ocean, c => c.atmosphericMoisture || 0);
    const landMoist = avg(land, c => c.atmosphericMoisture || 0);
